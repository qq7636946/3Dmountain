<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dceaf1">
  <title>MONTIS — Glacial Orb Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Noto+Sans+TC:wght@200;300;400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #2f5f8a;
      --ink-dim: rgba(47, 95, 138, .48);
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden
    }

    body {
      background:
        linear-gradient(180deg, #c9dfe9 0%, #e9eef1 48%, #f6e9e6 61%, #b7dce9 100%);
      color: var(--ink);
      /* 西文走 Jost，中文走 Noto Sans TC。順序就是分工：瀏覽器拿不到的字
     才往後找，所以拉丁字母一定是 Jost，漢字一定是 Noto Sans TC。 */
      font-family: "Jost", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    #gl {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      touch-action: none;
      cursor: default;
    }

    body.is-drop-hovered #gl {
      cursor: grab
    }

    body.is-drop-grabbed #gl {
      cursor: grabbing
    }

    .wash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(68% 38% at 50% 54%, rgba(255, 233, 226, .10), transparent 58%),
        radial-gradient(120% 90% at 50% 44%, transparent 58%, rgba(74, 111, 133, .16) 100%);
      mix-blend-mode: soft-light;
    }

    .grain {
      position: fixed;
      inset: -60%;
      pointer-events: none;
      z-index: 3;
      opacity: .04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
      animation: grain .24s steps(2) infinite;
    }

    @keyframes grain {
      0% {
        transform: translate3d(-2%, -1%, 0)
      }

      25% {
        transform: translate3d(1%, 2%, 0)
      }

      50% {
        transform: translate3d(2%, -2%, 0)
      }

      75% {
        transform: translate3d(-1%, 1%, 0)
      }

      100% {
        transform: translate3d(0, 0, 0)
      }
    }

    .chrome {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.8s var(--ease) .5s;
    }

    body.is-ready .chrome {
      opacity: 1
    }

    .brand,
    .study {
      position: absolute;
      top: clamp(20px, 2.4vw, 38px);
      font-size: .62rem;
      letter-spacing: .34em;
      line-height: 1;
      color: var(--ink-dim);
      text-transform: uppercase;
    }

    .brand {
      left: clamp(20px, 3.2vw, 54px);
      font-weight: 400
    }

    .study {
      right: clamp(20px, 3.2vw, 54px);
      letter-spacing: .24em
    }

    .hair {
      position: absolute;
      left: 50%;
      bottom: clamp(18px, 2.6vw, 34px);
      width: 38px;
      height: 1px;
      transform: translateX(-50%);
      background: rgba(47, 95, 138, .28);
    }

    /* ------------------------------------------------------------------
   主標：水珠從字後面浮出來。
   字級用 vw 而不是 rem，因為這一行的重點是「橫跨整個畫面」——它必須在
   任何寬度下都幾乎碰到左右邊，字距才撐得開。水珠中心在畫面 43% 高，字
   壓在 50%，於是球體剛好從字腰穿過去，這是參考圖的關係。
   ------------------------------------------------------------------ */
    .hero {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      padding: 0 clamp(16px, 3vw, 48px);
    }

    .hero-title {
      font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      /* 這個係數是量出來的，不是挑出來的：這一行在 Jost、字距 .012em 下
         的寬度剛好是字級的 13.7 倍，所以 6.4vw 讓整行佔滿視窗寬度的
         88%——參考圖裡它幾乎碰到左右兩邊，那正是這個排版的氣勢來源。
         字重或字距一改，這個係數就要重新量一次。 */
      font-size: clamp(1.9rem, 5.2vw, 8.4rem);
      line-height: .96;
      letter-spacing: .012em;
      color: #fff;
      white-space: nowrap;
      /* 白字壓在亮海面上會糊掉，所以給它一點自己的陰影當底，而不是加一層
     暗板——參考圖裡字是直接站在光上的。 */
      text-shadow: 0 .04em .28em rgba(35, 62, 96, .26);
    }

    .hero-sub {
      margin-top: clamp(.5rem, 1.1vw, 1.1rem);
      font-family: "Noto Sans TC", "Jost", sans-serif;
      font-weight: 300;
      font-size: clamp(.72rem, 1.12vw, 1.08rem);
      letter-spacing: .42em;
      text-indent: .42em;
      /* 這一行正好壓在水珠最亮的地方，白字配淡陰影會直接消失。改成全白
         加一層收得很緊的深藍暈——不是加暗板，字仍然站在光上，只是自己
         帶了一圈邊，這樣它在球上、在天空上、在海面上都讀得到。 */
      color: #fff;
      text-shadow:
        0 0 .10em rgba(30, 54, 86, .55),
        0 .04em .30em rgba(30, 54, 86, .42);
    }

    /* 進場：標題比水珠晚一步，字要等場景站穩才浮上來。 */
    .hero-title,
    .hero-sub {
      opacity: 0;
      transform: translateY(.42em);
      transition: opacity 1.6s var(--ease), transform 1.6s var(--ease);
    }

    body.is-ready .hero-title {
      opacity: 1;
      transform: none;
      transition-delay: .9s
    }

    body.is-ready .hero-sub {
      opacity: 1;
      transform: none;
      transition-delay: 1.25s
    }

    /* 標題必須在珠子到達之前就讓開，而且要快：進場用的 1.6 秒在這裡會
       讓字和珠子擠在一起。0.42 秒離場，副標比主標早一步走。
       往上推而不是往下：珠子是朝觀眾來的，字讓路的方向要和它相反。 */
    body.is-transitioning .hero-title,
    body.is-section-two .hero-title,
    body.is-transitioning .hero-sub,
    body.is-section-two .hero-sub {
      opacity: 0;
      transform: translateY(-.58em);
      transition: opacity .42s var(--ease), transform .52s var(--ease);
      transition-delay: 0s
    }

    body.is-transitioning .hero-sub,
    body.is-section-two .hero-sub {
      transition-delay: 0s;
      transition-duration: .3s, .4s
    }

    @media (max-width:680px) {
      .hero-title {
        white-space: normal;
        font-size: clamp(2rem, 10.5vw, 3.4rem);
        letter-spacing: .005em
      }

      .hero-sub {
        letter-spacing: .26em;
        text-indent: .26em
      }
    }

    .hair:before,
    .hair:after {
      content: "";
      position: absolute;
      top: 0;
      width: 3px;
      height: 3px;
      margin-top: -1px;
      border-radius: 50%;
      background: rgba(47, 95, 138, .36);
    }

    .hair:before {
      left: -8px
    }

    .hair:after {
      right: -8px
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #e4edf1;
      transition: opacity 1.15s var(--ease), visibility 1.15s;
    }

    .loader.is-done {
      opacity: 0;
      visibility: hidden
    }

    .loader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .loader-logo {
      font-size: .78rem;
      letter-spacing: .48em;
      text-indent: .48em;
      color: var(--ink);
    }

    .loader-line {
      width: min(210px, 46vw);
      height: 1px;
      overflow: hidden;
      background: rgba(47, 95, 138, .16);
    }

    .loader-line i {
      display: block;
      width: 100%;
      height: 100%;
      background: #4a86bb;
      transform: scaleX(0);
      transform-origin: left center;
      animation: load 1.25s var(--ease) forwards;
    }

    .loader-note {
      color: var(--ink-dim);
      font-size: .52rem;
      letter-spacing: .24em;
    }

    @keyframes load {
      to {
        transform: scaleX(1)
      }
    }

    .fallback {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 30px;
      color: var(--ink);
      text-align: center;
      background: #e4edf1;
      font-size: .78rem;
      letter-spacing: .14em;
    }

    .section-two {
      /* Media reveal and settle are both keyed off the scroll progress from
     JS, so the hand-off stays locked to the drop instead of racing it. */
      --s2-media: 0;
      --s2-scale: 1.075;
      position: fixed;
      inset: 0;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      background:
        radial-gradient(70% 52% at 50% 62%, rgba(255, 239, 234, .48), transparent 64%),
        radial-gradient(92% 72% at 50% 0%, rgba(156, 204, 222, .34), transparent 72%),
        linear-gradient(180deg, #c6dce6 0%, #e8eef1 49%, #eee9e7 64%, #b8d8e5 100%);
      will-change: opacity;
    }

    .section-two.is-active {
      visibility: visible
    }

    .section-two.is-live {
      pointer-events: auto
    }

    /* Deep plate beneath the film: the swap never shows a black frame even
   if the video is still buffering when the flare clears. */
    .s2-plate {
      position: absolute;
      inset: 0;
      opacity: var(--s2-media);
      background:
        radial-gradient(118% 88% at 50% 40%, #26414f 0%, #162834 62%, #0e1c26 100%);
    }

    .s2-media {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: var(--s2-media);
      transform: scale(var(--s2-scale));
      transform-origin: 50% 54%;
      will-change: transform, opacity;
    }

    .s2-media video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.25s var(--ease);
    }

    .section-two.is-video-ready .s2-media video {
      opacity: 1
    }

    .s2-clouds {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none
    }

    .s2-clouds i {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse at 40% 45%,
          rgba(245, 248, 252, .72) 0%,
          rgba(232, 239, 246, .40) 30%,
          rgba(212, 221, 229, .13) 58%,
          transparent 76%);
      filter: blur(var(--pcb, 18px));
      will-change: transform;
      animation: var(--pca) linear infinite;
    }

    @keyframes pcA {
      from {
        transform: translateX(-22vw)
      }

      to {
        transform: translateX(122vw)
      }
    }

    @keyframes pcB {
      from {
        transform: translateX(122vw)
      }

      to {
        transform: translateX(-22vw)
      }
    }

    /* Reading shade: keeps the type legible over any frame of the film. */
    .s2-shade {
      position: absolute;
      inset: 0;
      opacity: var(--s2-media);
      background:
        linear-gradient(100deg, rgba(9, 20, 28, .72) 0%, rgba(9, 20, 28, .38) 38%, transparent 68%),
        linear-gradient(0deg, rgba(9, 20, 28, .46) 0%, transparent 42%),
        radial-gradient(122% 88% at 50% 46%, transparent 40%, rgba(8, 18, 26, .46) 100%);
    }

    /* ---------- section two type (copy ported from the chapter build) ---- */
    .s2-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding-left: clamp(64px, 15vw, 300px);
      padding-right: clamp(24px, 6vw, 80px);
      color: #fff;
    }

    .s2-block {
      max-width: min(760px, 64vw)
    }

    .mask {
      display: block;
      overflow: hidden
    }

    .mask>i {
      display: block;
      font-style: normal;
      transform: translateY(112%);
      opacity: 0;
      transition: transform 1.05s var(--ease), opacity .8s var(--ease);
      transition-delay: var(--d, 0s);
    }

    .section-two.is-in .mask>i {
      transform: none;
      opacity: 1
    }

    /* Leaving is not the entrance played backwards: no stagger, and quick,
   so scrolling back up never feels like it drags the type with it. */
    .section-two:not(.is-in) .mask>i {
      transition-duration: .5s, .34s;
      transition-delay: 0s;
    }

    .s2-eyebrow {
      font-size: clamp(.86rem, 1.1vw, 1.05rem);
      letter-spacing: .02em;
      opacity: .92;
      margin-bottom: clamp(22px, 3vw, 44px);
    }

    .s2-title {
      font-weight: 200;
      font-size: clamp(2rem, 4.6vw, 4.5rem);
      line-height: 1.12;
      letter-spacing: .005em;
      text-transform: uppercase;
      margin-bottom: clamp(30px, 4vw, 58px);
    }

    .s2-cta {
      display: inline-flex;
      align-items: center;
      gap: clamp(18px, 2vw, 34px);
      text-decoration: none;
      color: #fff;
    }

    .s2-cta .txt {
      font-size: .72rem;
      letter-spacing: .24em;
      font-weight: 500;
      text-transform: uppercase
    }

    .s2-cta .circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .45);
      display: grid;
      place-items: center;
      font-size: .8rem;
      opacity: 0;
      transform: scale(.76);
      transition: background .5s var(--ease), color .5s var(--ease),
        border-color .5s var(--ease),
        transform .72s var(--ease) .30s, opacity .55s var(--ease) .30s;
    }

    .section-two.is-in .s2-cta .circle {
      opacity: 1;
      transform: none
    }

    .s2-cta:hover .circle {
      background: #fff;
      color: #12222c;
      border-color: #fff;
      transform: translateX(4px)
    }

    .s2-rule {
      height: 1px;
      width: min(300px, 34vw);
      margin-top: clamp(22px, 2.4vw, 38px);
      background: rgba(255, 255, 255, .38);
      transform: scaleX(0);
      transform-origin: 0 50%;
      transition: transform 1.2s var(--ease) .42s;
    }

    .section-two.is-in .s2-rule {
      transform: scaleX(1)
    }

    .section-two:not(.is-in) .s2-rule {
      transform-origin: 100% 50%;
      transition-duration: .42s;
      transition-delay: 0s;
    }

    .section-two:not(.is-in) .s2-cta .circle {
      transition-duration: .3s, .3s, .3s, .34s, .26s;
      transition-delay: 0s;
    }

    .section-two:not(.is-in) .s2-back {
      transition-delay: 0s;
      transition-duration: .35s
    }

    .s2-back {
      position: absolute;
      right: clamp(20px, 3.2vw, 54px);
      bottom: clamp(22px, 3vw, 46px);
      font-size: .54rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .46);
      opacity: 0;
      transition: opacity .9s var(--ease) .5s;
    }

    .section-two.is-in .s2-back {
      opacity: 1
    }

    .transition-flash {
      --flare-x: 50%;
      --flare-y: 62%;
      position: fixed;
      inset: -18%;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      background:
        /* 白 → 淡藍紫 → 紫 → 洋紅 → 青：這是薄膜色散的順序。夾在紫和青
           之間那個非光譜色的洋紅，就是讓這條漸層讀成「干涉」而不是「彩
           虹」的關鍵。原本的漸層只有青色，紫和洋紅完全沒有。虹彩放在
           20–42%、alpha ≥ .32，再往外或再淡在這麼淡的場域上就看不見。 */
        radial-gradient(ellipse at var(--flare-x) var(--flare-y),
          rgba(255, 255, 255, 1) 0 1.2%,
          rgba(246, 243, 255, .97) 4.5%,
          rgba(214, 206, 255, .80) 11%,
          rgba(188, 168, 248, .56) 20%,
          rgba(222, 152, 232, .40) 30%,
          rgba(132, 206, 246, .32) 42%,
          rgba(108, 146, 208, .12) 54%,
          transparent 72%);
      mix-blend-mode: screen;
      will-change: opacity, transform;
      transform-origin: var(--flare-x) var(--flare-y);
      transform: scale(.08, .035);
    }

    .transition-flash:before {
      content: "";
      position: absolute;
      left: 5%;
      right: 5%;
      top: var(--flare-y);
      height: 2px;
      transform: translateY(-50%);
      /* 一條對稱的白線橫過畫面正中央，是最公式化的鏡頭光暈符號。兩端
         不對稱（一邊偏紫、一邊偏洋紅），整條降到三分之一。 */
      background: linear-gradient(90deg,
          transparent,
          rgba(196, 176, 250, .26) 20%,
          rgba(255, 255, 255, .92) 48%,
          rgba(224, 156, 234, .26) 80%,
          transparent);
      opacity: .34;
      filter: blur(.4px);
      box-shadow:
        0 0 10px rgba(226, 214, 255, .70),
        0 0 34px rgba(150, 120, 230, .40);
    }

    .section-two-index {
      position: absolute;
      left: clamp(20px, 3.2vw, 54px);
      bottom: clamp(22px, 3vw, 46px);
      color: rgba(255, 255, 255, .54);
      font-size: .58rem;
      letter-spacing: .30em;
      text-transform: uppercase;
    }

    body.is-ready.is-transitioning .chrome {
      opacity: .24
    }

    body.is-ready.is-section-two .chrome {
      opacity: 0
    }

    .tuner {
      position: fixed;
      top: 74px;
      right: 18px;
      z-index: 12;
      width: min(330px, calc(100vw - 36px));
      max-height: calc(100vh - 96px);
      color: #dcebf3;
      border: 1px solid rgba(196, 226, 240, .22);
      background: rgba(23, 45, 58, .76);
      box-shadow: 0 18px 55px rgba(26, 56, 73, .22);
      backdrop-filter: blur(18px) saturate(118%);
      -webkit-backdrop-filter: blur(18px) saturate(118%);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .8s var(--ease) .65s, transform .8s var(--ease) .65s;
    }

    body.is-ready .tuner {
      opacity: 1;
      transform: none
    }

    .tuner.is-folded .tuner-body {
      display: none
    }

    .tuner-head {
      height: 43px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 13px 0 15px;
      border-bottom: 1px solid rgba(196, 226, 240, .14);
    }

    .tuner-title {
      font-size: .58rem;
      letter-spacing: .27em;
      text-transform: uppercase;
    }

    .tuner-toggle {
      width: 25px;
      height: 25px;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      font: 300 .9rem/1 "Jost", sans-serif;
    }

    .tuner-body {
      max-height: calc(100vh - 140px);
      overflow: auto;
      padding: 5px 14px 14px;
      scrollbar-width: thin;
      scrollbar-color: rgba(205, 230, 242, .28) transparent;
    }

    .tune-group {
      padding: 12px 0 8px;
      border-bottom: 1px solid rgba(196, 226, 240, .11)
    }

    .tune-group:last-of-type {
      border-bottom: 0
    }

    .tune-group h3 {
      margin-bottom: 9px;
      color: rgba(222, 239, 247, .58);
      font-size: .48rem;
      font-weight: 400;
      letter-spacing: .28em;
    }

    .tune-row {
      min-height: 25px;
      display: grid;
      grid-template-columns: 64px 1fr 45px;
      align-items: center;
      gap: 8px;
    }

    .tune-row.is-morph {
      min-height: 45px;
      padding-top: 2px;
    }

    .tune-row.is-morph:after {
      content: "圓球  ◀────────▶  液態波";
      grid-column: 2/4;
      margin-top: -5px;
      color: rgba(218, 239, 248, .48);
      font: 400 .42rem/1 Consolas, monospace;
      letter-spacing: .04em;
      text-align: center;
    }

    .tune-row label {
      color: rgba(226, 240, 247, .72);
      font-size: .5rem;
      letter-spacing: .08em;
    }

    .tune-row input[type="range"] {
      width: 100%;
      height: 1px;
      accent-color: #a9d7ea;
      cursor: ew-resize;
    }

    .tune-value {
      color: #e8f5fb;

  <script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"

}
</script>

  <script type="module">
    import * as THREE from 'three';
    import { Water } from 'three/addons/objects/Water.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';

    const canvas = document.querySelector('#gl');
    const loader = document.querySelector('#loader');
    const loaderNote = document.querySelector('.loader-note');
    const fallback = document.querySelector('#fallback');
    const sectionTwo = document.querySelector('#sectionTwo');
    const sectionTwoVideo = document.querySelector('#sectionTwoVideo');
    const transitionFlash = document.querySelector('#transitionFlash');
    const tuner = document.querySelector('#tuner');
    const tunerBody = document.querySelector('#tunerBody');
    const tunerToggle = document.querySelector('#tunerToggle');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
    } catch (error) {
      fallback.style.display = 'grid';
      loader.classList.add('is-done');
      throw error;
    }

    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.65));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    /* Neutral, not ACES. ACES at this exposure turns #eef3fa into #d4d6d8 and
       cannot reach the cyan or the magenta from real light at any brightness:
       that table is exactly the note "not grey". Neutral is identity below .76
       and compresses only the peak, which is what lets a high-key plate keep
       its colour. */
    renderer.toneMapping = THREE.NeutralToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    /* No fog. The plate is high-key and luminous: depth comes from the metal's
       own reflections, not from grey air. */

    /* The camera sits 1.26 above the metal and pitches 4.909 degrees up, so
       the horizon lands at 66% of the frame and the drop at 43% — clear of
       each other. The old frame had the drop at 45.6% and the horizon at
       45.0%, the hero tangled in its own horizon line, which is what made the
       page read as a demo rather than a photograph. Far goes to 340: the sea
       runs to 170 and the backdrop is a 150 dome. */
    const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, .08, 340);
    camera.position.set(0, 1.26, 10.0);
    const cameraLook = new THREE.Vector3(0, 2.72, -7.0);
    camera.lookAt(cameraLook);

    const CONFIG = {
      camera: { x: 0, y: 1.26, z: 10.0, tx: 0, ty: 2.72, tz: -7.0, fov: 30 },
      water: { x: 0, y: .03, z: -12.5, rx: 0, ry: 0, rz: 0, sx: 1.62, sy: .08, sz: 1.72, opacity: .34, waveHeight: .085, waveSpeed: .52 },
      /* THE ROOM. Every value is the hex it reaches the screen as: applyConfig
         runs each one through paletteLinear before upload, so what is typed is
         what is seen. INK is a saturated blue and must stay one — darkness in
         this plate is blue ink, never a neutral. Set it to anything with
         R=G=B and the grey comes straight back. */
      field: {
        /* Two palettes in one block. TOP is the visible ceiling of the frame
           and HORIZON is eye level: those two are what the camera sees. ZENITH,
           UPPER, FLOOR and LOWER are never drawn — only the ball and the sea
           ever look at them — so darkening the drawn ceiling and brightening
           the reflected one costs nothing and puts the hero's crown BRIGHTER
           than the sky behind it. */
        zenith: '#e8eef8', upper: '#eaf0fa', top: '#92a8cd', horizon: '#e6edf7',
        lower: '#c9d5e8', floor: '#93a6c4', ink: '#3f5a7e',
        /* 核心光壓下來：原本的亮度會把整片畫面洗白，折面的層次就沒了。 */
        core: 1.5, coreSpread: 1, bandGain: .13, dither: .006
      },
      /* THE SWELL. SWELL scales every amplitude; its maximum of 3 is not
         arbitrary: the sum of Q*A*k is .2252 at 1 and a Gerstner surface only
         self-intersects at 1.0, so even at 3 the metal cannot fold through
         itself. No slider here can break the surface. TIME SCALE .55 is the
         one liberty in the field: wave speed goes as the square root of
         wavelength, so slowing everything by .55 makes the sea read 3.3 times
         larger than its world units. That, not viscosity, is what makes molten
         metal look heavy. */
      /* 流速壓到每一道浪自己的相速度以下。原本的流速幾乎正好抵銷第三道浪，
         讓它在畫面裡「站住」27 秒不動，旁邊第四道又被推快成閃爍 —— 凍住的
         摺痕配上抖動，正是錫箔的樣子。規則：|dot(方向,流速)| ≤ 0.45 × 相速度。 */
      sea: {
        swell: 2.6, heading: 0, spread: 1, current: .30, drift: .22, timeScale: .85,
        detail: 1.0, filament: .26, lift: 1.9, haze: 55, hazeFar: 150, edge: .22
      },
      /* THE METAL. F0 never under .70 on any channel: below that the eye reads
         a dielectric and the plate turns to plastic. Water sits at .02, which
         is why the old build read as a lake. */
      /* 光帶少而寬：原本 2.6 條的週期比一道浪的起伏還細，掃過去只會變成雜訊。
         1.5 條時，一道摺面剛好帶一亮一暗，那才是參考圖的長條紋。 */
      chrome: {
        bands: 1.5, bandPhase: .145, bandLight: 1.20, bandInk: 1.35,
        rail: 2.1, railY: .34, f0: .88, rough: .024, aniso: .55, streak: 1.15,
        contour: 0, iris: .085, irisPhase: 2.4, irisEdge: 3.5, occlude: .11
      },
      air: { sparkle: .85, size: .55, speed: .5 },
      /* The hero. Its metal is authored apart from the sea's: one set of
         numbers cannot serve a grazing plane and a sphere, and every value
         that suited the water made the ball worse. BAND is how much of the
         room's band stack it may mirror, and it is zero on purpose — on a ball
         those bands are rings. CARD is the black flag that gives it a light
         direction instead. */
      drop: {
        x: 0, y: 3.36, z: -7.0, rx: 0, ry: 0, rz: 0, scale: 1.20, roundness: 1,
        roughness: .028, thickness: 0, transmission: 0,
        f0: .94, aniso: .08, streak: 1.55, iris: .58, irisEdge: 1.35,
        contour: .55, band: 0, card: .92, rim: .55, rimEdge: 12,
        lens: .34, lensEdge: 8.5
      },
      physics: {
        enabled: 1, startY: 3.36, waterY: 0,
        gravity: 6.4, airDrag: .035, impact: 1,
        rippleSpeed: 3.3, damping: 1.12, splash: .82, loopDelay: 1.85,
        scrollThreshold: 160, fluidity: 1.08, fallStretch: .38, impactSoftness: .94,
        touchForce: .89, touchRadius: .76, touchSpring: 9.5,
        touchDamping: 4.8, touchWobble: .72
      },
      /* Pointer-driven surface interaction: dragging across the lake sheds a
         wake of expanding rings, a press strikes a splash, and the bead of
         water can be taken hold of and thrown back into the surface. */
      /* A poke is no longer free of the sea it sits in. A wave of wavelength
         2.30 travels at 1.042, so SPEED 1.05 puts a ring on exactly the
         swell's own dispersion law — against the 2.60 ratio the old pair ran
         at, which is why the surface used to ping like a puddle. The longer
         wavelength also gives the packet under one crest: a single fat fold,
         not a ringing train. */
      ripple: {
        strength: 1, speed: 1.05, damping: .86, wavelength: 2.30,
        trail: 1, click: 1.15, mirror: .95,
        ambient: 1, ambientSpeed: 1
      },
      /* 水珠的皮膚要活著。變形量原本是 0，表面完全靜止，那是鋼珠不是水珠；
         現在給它一點慢的表面張力起伏，速度放慢代表比較重的液體。 */
      /* 頻率壓得很低是有原因的：表面張力會把高頻皺褶抹平，一顆會起皺的
         水珠看起來像揉過的紙。要的是整顆慢慢呼吸、輕微不對稱。 */
      distortion: {
        waveMorph: .50, amount: .42, waveAmplitude: .045, waveFrequency: 1.15,
        waveSpeed: .60, twist: .055, twistFrequency: 3.6,
        breathing: .030
      },
      transition: {
        scrollThreshold: 400, speed: .89, sinkDepth: .42,
        wobble: 1.08, drift: 0, spin: 1, sectionFade: 1
      },
      /* 前散。整段轉場都是 dropTransition.progress 這一個純量的函數，沒有
         任何一次性的旗標，所以往上捲的時候它會原封不動地倒著走回來。
         TRAVEL 18.5：珠子從 z=-7 出發，鏡頭在 z=10，所以十七個單位才到
         鏡頭，多給一點半才算真的飛出畫面。
         ACCEL 2.05：z 隨進度的 2.05 次方走。這個指數就是「朝你加速」的
         全部——線性的話珠子會像被吊著平移過來，一點壓迫感都沒有。
         BURST AT .58：大部分珠子掠過鏡頭的時刻。光芒要壓在這裡，晚一點
         就變成「珠子先走光了才亮」。 */
      disperse: {
        /* 彈道，全部以鏡頭時間（秒）計。
           SPEED 64：主珠的出發速度（世界單位/秒）。從 z=-7 到鏡頭的 17
           個單位，配 DRAG .9 的線性阻力，主珠在 0.29 秒抵達鏡頭平面，
           也就是 progress .44——正好是光開始點火的那一格。
           SIZE SPEED .30：小的快，v ∝ (R/r)^.30，最小那顆快 1.7 倍；
           SIZE DRAG .55：小的也拖得重，k ∝ (R/r)^.55，所以它們衝得快但
           收得快。到達時間因此散在 0.17–0.48 秒之間，不是一面牆。
           GRAVITY 9：這個場景讀起來比世界單位大三倍，9.8 m/s² 換算過來
           會把珠子在半秒內砸進海裡；9 給的是一道緩弧。
           RING .38 / RING FREQ 26 / RING DAMP .30：Rayleigh 二階模，主珠
           26 rad/s，小珠依 r^-1.5 加快、上限 84。 */
        beads: 15, speed: 74, sizeSpeed: .40, drag: .9, sizeDrag: .55,
        gravity: 9, cone: 14, loft: .06, release: .26,
        /* 拉長是「軸比」而不是 sz：橫向縮 1/√sz 之後軸比是 sz^1.5，所以
           .40 給主珠全速時 1.35:1——鉻珠子該是近圓帶一點拖影，量到 6.7:1
           的雪茄就是太過。RING .30 讓出生那一刻是 2:1 的細絲，再擺回來。 */
        stretch: .40, ring: .30, ringFreq: 26, ringDamp: .30, spin: .55,
        /* 珠子抵達鏡頭平面的時刻可以從這個檔案自己的式子解出來：
           travel·fi^accel = 17 → fi = (17/18.5)^(1/2.05) = .9597。
           領頭那顆在 p=.437 通過，最後一顆在 p=.595，所以穿越的窗口是
           .44–.60、中心 .52。光芒就該壓在這裡，±.13 蓋住整段穿越。 */
        burst: 1.75, burstAt: .50, burstWidth: .13, cut: .15,
        exposure: .30, veil: .50, nearFade: 2.2,
        /* 交棒。第二塊要在光還滿的時候就已經不透明，讓光「退開」露出它，
           而不是在清空的畫面裡淡進來——後者就是最廉價的那種疊化。 */
        handoff: .46
      },
      /* The drop carries no light of its own any more: its mote cloud, the
         orbiting sparkles, the painted highlights and the two soft glows are
         all at zero, so the water beads are lit only by the scene. The
         sliders stay, and bring any of them back. */
      details: {
        motes: 0, moteSize: 2.20, moteSpeed: 1.45,
        waterGlints: .10, glintSize: 2.22,
        highlight: 0, transitionFlash: 1.45,
        orbitSpeed: .48, sparkleSize: 1.22,
        satelliteIntensity: 0, glow: 0
      },
      /* The gather. The orb no longer surfaces from the river: it is born in
         the air as a clump of a dozen smaller beads of water, fused where they
         touch (metaballs), which are drawn one by one into the largest until a
         single drop is left — the one the visitor then plays with. Everything
         here is what a real coalescence does: the pull accelerates as the gap
         closes, a bead keeps its size until it touches and is only then taken
         in, the survivor grows by volume (cube root), and every swallow rings
         through it and dies away.
         With LOOP 1 it never ends: the one drop rests (SETTLE), sheds its beads again
         (SPLIT) — the largest first, each pinching off with a recoil — and
         they hang apart (HOLD) before the next gather.
         The split has its own settings (tuner group DROP SPLIT): its length,
         how far apart the pinch-offs fall, how long each bead stays joined by
         a neck, how hard it is thrown, the bow it leaves on, how much the
         order is shuffled each turn and how hard each one recoils. Every turn
         one to STRAYS of the small beads also break away as droplets of their
         own, further out, picked and aimed at random. */
      /* 進場要讀成「很多顆水珠聚成一顆」，所以數量多、顆粒小、散得更開，
         抵達的時間也拉得更錯開：先是一片懸浮的珠子，再一顆顆被吃進去。 */
      gather: {
        count: 22, sizeMin: .13, sizeMax: .36, spread: 1.40,
        /* Slower than water by measurement, not by taste: the capillary time
           of a drop goes as the square root of density over surface tension,
           and mercury against water is 1.42. A metal drop coalesces and rings
           about 40% slower than a water drop the same size. */
        hold: 1.20, duration: 5.40, stagger: .62, contact: .72,
        arc: .34, breathe: .03, spin: .22,
        wobbleGain: .085, wobbleDamp: 1.8, wobbleFreq: 6.7, settle: 1.05,
        fuse: 1.0,
        /* 0: the beads gather once, in the entrance, and the drop stays whole.
           1: it rests, splits and gathers again, turn after turn. */
        loop: 0,
        /* 0: the page opens on the drop already whole, with no gathering. 1:
           the beads gather into it as the loader clears. Read at load. */
        intro: 1,
        split: 3.20, splitStagger: .45, splitContact: .70, splitSnap: 2.6,
        splitArc: .36, splitShuffle: .35, splitRing: .042,
        strays: 2, straySize: .26, strayReach: .8
      },
      /* The droplet: the Codrops "Interactive, Droplet-like Metaballs" drop,
         ported into this scene. Every bead, the orb and the pointer's trail
         are one raymarched signed-distance surface fused by the demo's
         exponential smooth-min. The defaults are the demo itself: SMOOTH 7 is
         its k measured against its static sphere, TRAIL SIZE 1 its trail, INK
         1 its black body with no glass showing, SHEEN 1 and CONTRAST 7 its
         noise-reflection colour, and MATCH 1 puts that colour on screen at
         the demo's own display values through this page's tone mapping.
         WATER swaps the demo's purple for this lake's blues (0 is the demo's
         own palette): GLOW COLOR and SHEEN COLOR take the lake's hue at the
         brightness of the demo's two tints, so the highlights move exactly as
         they did, and BODY fills the black body with deep water (BODY COLOR).
         CLARITY is how much of the scene shows through the water, refracted:
         0 is an opaque body, 1 clear glass; the highlights lie over either.
         With MATCH 0 the older glass look is used instead, where INK darkens
         the glass (the CLEAR GLASS button). TRAIL
         draws liquid out of the drop after the pointer, within TRAIL REACH
         drop radii of it. STEPS is the march budget. */
      droplet: {
        smooth: 7, ink: 1, sheen: 1, contrast: 7, match: 1, noiseScale: 2, noiseSpeed: 2,
        trail: 1, trailSize: 1, trailReach: 3.2, steps: 40,
        /* Nothing inside the ball, literally: CLARITY and BODY are read by no
           line of shader any more, but a non-zero CLARITY pinned the proxy's
           transmission above zero, which put it in three's transmissive list
           and paid for a whole extra opaque render of the scene every frame. */
        water: 1, body: 0, bodyColor: '#3d5f78', glowColor: '#26313a', sheenColor: '#cfe4ff',
        clarity: 0
      },
      /* GRAIN 是螢幕雜訊：畫面這麼亮、這麼平，一點顆粒能壓住漸層的色帶，
         也讓它像一張拍出來的照片而不是算出來的圖。SIZE 是顆粒大小（螢幕
         像素），SPEED 是它跳動的快慢，0 就靜止不動。 */
      scene: {
        exposure: .88, bloom: .24, bloomCut: 2.10, env: 1, keyLight: .9, fillLight: 0,
        grain: .055, grainSize: 1.3, grainSpeed: 1
      }
    };
    /* Phones and narrow screens march fewer steps. Taken before the defaults
       are copied, so RESET keeps it. */
    const DROPLET_LITE = matchMedia('(max-width: 720px), (pointer: coarse)').matches;
    if (DROPLET_LITE) CONFIG.droplet.steps = 28;
    /* ------------------------------------------------------------------

     stretched key from the upper left, and the sea's bounce underneath —

      }

vec3 montisChrome(vec3 N,vec3 V,vec2 flow,float curv,float rough,float irisMask,float bandGain,float card){

    const envProbeMaterial = backdropMaterial.clone();
    envProbeMaterial.uniforms = Object.assign(
      { uBlur: { value: .02 }, uDither: { value: 0 }, uBandGain: { value: .55 }, uVeilOn: { value: 0 } },
      montisEnvUniforms,
      montisVeilUniforms
    );
    const envScene = new THREE.Scene();
    envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 48, 32), envProbeMaterial));
    let envTarget = null;
    let envBakeTimer = 0;
    function bakeEnvironment() {
      const next = pmrem.fromScene(envScene, .02);
      if (envTarget) envTarget.dispose();
      envTarget = next;
      scene.environment = next.texture;
    }
    /* A bake costs the better part of a frame. Never per frame, and never on
       slider input. */
    function queueEnvBake() { clearTimeout(envBakeTimer); envBakeTimer = setTimeout(bakeEnvironment, 250); }
    bakeEnvironment();
    /* pmrem is deliberately NOT disposed: the palette is live-tunable, so the
       generator has to survive to rebuild the probe. */
    renderer.setClearColor(0x92a8cd, 1);

    /* ------------------------------------------------------------------
       PROCEDURAL CLOUD SEA
       Two feathered FBM layers echo the cloud field used by index.html:
       a broad high layer and a quieter deck behind the mountain range.
       ------------------------------------------------------------------ */
    const cloudVertexShader = `
  varying vec2 vUv;
  void main(){
    vUv=uv;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
  }
`;
    const cloudFragmentShader = `
  precision highp float;
  uniform float uTime,uSpeed,uOpacity,uCoverage;
  uniform vec2 uOffset;
  uniform vec3 uShadow,uLight;
  varying vec2 vUv;

  vec2 hash(vec2 p){
    p=vec2(
      dot(p,vec2(127.1,311.7)),
      dot(p,vec2(269.5,183.3))
    );
    return -1.+2.*fract(sin(p)*43758.5453123);
  }
  float cloudNoise(vec2 p){
    const float K1=.366025404;
    const float K2=.211324865;
    vec2 i=floor(p+(p.x+p.y)*K1);
    vec2 a=p-i+(i.x+i.y)*K2;
    vec2 o=step(a.yx,a.xy);
    vec2 b=a-o+K2;
    vec2 c=a-1.+2.*K2;
    vec3 h=max(.5-vec3(
      dot(a,a),
      dot(b,b),
      dot(c,c)
    ),0.);
    vec3 n=h*h*h*h*vec3(
      dot(a,hash(i)),
      dot(b,hash(i+o)),
      dot(c,hash(i+vec2(1.)))
    );
    return clamp(dot(n,vec3(70.))*.5+.5,0.,1.);
  }
  float fbm(vec2 p){
    float value=0.;
    float amplitude=.52;
    mat2 rotation=mat2(1.58,1.18,-1.18,1.58);
    for(int i=0;i<6;i++){
      value+=cloudNoise(p)*amplitude;
      p=rotation*p+vec2(.17,-.13);
      amplitude*=.50;
    }
    return value;
  }
  void main(){
    vec2 centred=vUv-.5;
    vec2 p=centred*vec2(3.05,1.42)+uOffset;
    float t=uTime*uSpeed*.018;
    float base=fbm(p*1.08+vec2(t,-t*.22));
    float body=fbm(
      p*2.02+vec2(-t*.58,t*.31)+vec2(base*.82,-base*.46)
    );
    float wisps=fbm(p*4.8+vec2(t*1.7,-t*.72));
    float field=base*.68+body*.42+wisps*.10;
    float density=smoothstep(uCoverage,uCoverage+.26,field);
    density+=wisps*.12*smoothstep(.12,.72,density);
    density=clamp(density,0.,1.);

    float featherX=smoothstep(0.,.12,vUv.x)
      *smoothstep(0.,.12,1.-vUv.x);
    float featherY=smoothstep(0.,.10,vUv.y)
      *smoothstep(0.,.16,1.-vUv.y);
    float lightMix=clamp(.22+body*.58+vUv.y*.16,0.,1.);
    vec3 color=mix(uShadow,uLight,lightMix);
    color*=1.-density*.055;
    gl_FragColor=vec4(
      color,
      density*uOpacity*featherX*featherY
    );
  }
`;
    function createCloudMaterial({
      opacity,
      speed,
      coverage,
      offset,
      shadow,
      light
    }) {
      return new THREE.ShaderMaterial({
        /* Drawn with the opaque layers, after the sky, the dunes and the
           water by renderOrder, but blended exactly as a transparent layer.
           That puts the clouds into the scene the droplet refracts and ahead
           of the droplet's soft edge; the alpha factors keep the target's
           alpha at 1 so the refraction stays opaque behind them. */
        transparent: false,
        blending: THREE.CustomBlending,
        blendEquation: THREE.AddEquation,
        blendSrc: THREE.SrcAlphaFactor,
        blendDst: THREE.OneMinusSrcAlphaFactor,
        blendSrcAlpha: THREE.OneFactor,
        blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
        depthWrite: false,
        depthTest: true,
        fog: false,
        side: THREE.DoubleSide,
        uniforms: {
          uTime: { value: 0 },
          uSpeed: { value: speed },
          uOpacity: { value: opacity },
          uCoverage: { value: coverage },
          uOffset: { value: offset.clone() },
          uShadow: { value: new THREE.Color(shadow) },
          uLight: { value: new THREE.Color(light) }
        },
        vertexShader: cloudVertexShader,
        fragmentShader: cloudFragmentShader
      });
    }


    /* ------------------------------------------------------------------
       PROCEDURAL SURFACE TEXTURES
       ------------------------------------------------------------------ */
    function makeNormalTexture(size = 256, strength = 1.4) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const image = ctx.createImageData(size, size);
      const height = new Float32Array(size * size);

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const u = x / size, v = y / size;
          height[y * size + x] =
            Math.sin((u * 6.0 + v * .45) * Math.PI * 2) * .52
            + Math.sin((v * 3.2 - u * .28) * Math.PI * 2) * .28
            + Math.sin((u * 13.0 + v * 7.0) * Math.PI * 2) * .08;
        }
      }
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const xm = (x - 1 + size) % size, xp = (x + 1) % size;
          const ym = (y - 1 + size) % size, yp = (y + 1) % size;
          const dx = height[y * size + xp] - height[y * size + xm];
          const dy = height[yp * size + x] - height[ym * size + x];
          const n = new THREE.Vector3(-dx * strength, -dy * strength, 1).normalize();
          const i = (y * size + x) * 4;
          image.data[i] = (n.x * .5 + .5) * 255;
          image.data[i + 1] = (n.y * .5 + .5) * 255;
          image.data[i + 2] = (n.z * .5 + .5) * 255;
          image.data[i + 3] = 255;
        }
      }
      ctx.putImageData(image, 0, 0);
      const texture = new THREE.CanvasTexture(c);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.colorSpace = THREE.NoColorSpace;
      texture.needsUpdate = true;
      return texture;
    }

    /* Shallow relief only: the river reads as a near-still mirror, so the
       normals just need to break the reflection into slow bands. */
    const waterNormal = makeNormalTexture(256, .26);
    waterNormal.repeat.set(5, 3);
    waterNormal.anisotropy = renderer.capabilities.getMaxAnisotropy();





    /* ------------------------------------------------------------------
       WATER
       Planar reflection plus a generated multi-frequency normal field gives
       broad calm ripples without an external image dependency.
       ------------------------------------------------------------------ */
    const sunDirection = new THREE.Vector3(-.18, .42, -1).normalize();

    /* ------------------------------------------------------------------
       POINTER RIPPLE FIELD
       One shared packet of ring sources drives every surface that has to
       answer the pointer: the planar mirror buckles its reflection, the
       authored river tilts its shading normal, and a thin overlay draws the
       crests. Each slot is (centre.x, centre.z, age, strength); strength
       zero means the slot is free, so the whole field costs a handful of
       branches while the pointer is off the water.
       ------------------------------------------------------------------ */
    const RIPPLE_SLOTS = 12;
    const rippleSlots = Array.from(
      { length: RIPPLE_SLOTS },
      () => new THREE.Vector4(0, 0, 999, 0)
    );
    const uRipples = { value: rippleSlots };
    /* x speed, y damping, z master gain, w angular wavenumber */
    const uRippleParams = {
      value: new THREE.Vector4(
        CONFIG.ripple.speed,
        CONFIG.ripple.damping,
        CONFIG.ripple.strength,
        Math.PI * 2 / CONFIG.ripple.wavelength
      )
    };
    const uRippleLive = { value: 0 };
    const uRippleMirror = { value: CONFIG.ripple.mirror };
    const uRippleTime = { value: 0 };
    /* x strength, y speed */
    const uRippleAmbient = {
      value: new THREE.Vector2(
        CONFIG.ripple.ambient,
        CONFIG.ripple.ambientSpeed
      )
    };

    /* Returns (height, slopeX, slopeZ, foam). Each ring is a travelling
       gaussian packet, so `x` is the signed distance to the wave front and
       the crest count stays fixed while the ring expands; differentiating
       that packet analytically gives the slope without sampling twice.
    
       `ambientFlow` is the lake's own breathing — a handful of long swells
       drifting the same way, so the surface is never dead still even with
       the pointer nowhere near it. It returns (height, slopeX, slopeZ) in
       the same units as the rings, so both feed the same shading. */
    const RIPPLE_GLSL = `
  uniform vec4 uRipples[${RIPPLE_SLOTS}];
  uniform vec4 uRippleParams;
  uniform float uRippleLive;
  uniform float uRippleTime;
  uniform vec2 uRippleAmbient;

  vec4 rippleField(vec2 p){
    vec4 acc=vec4(0.);
    if(uRippleLive<.5)return acc;
    for(int i=0;i<${RIPPLE_SLOTS};i++){
      vec4 source=uRipples[i];
      if(source.w<=.001)continue;
      vec2 delta=p-source.xy;
      float dist=max(length(delta),1e-3);
      float x=dist-source.z*uRippleParams.x;
      /* Rings swell in over the first breath instead of being stamped
         on at full strength — a ring that appears whole is the single
         thing that reads as hard rather than as water. */
      float birth=smoothstep(0.,.17,source.z);
      float decay=exp(-source.z*uRippleParams.y)*source.w*birth;
      float amp=exp(-x*x*.62)*decay*(.045/(1.+dist*.62));
      float k=uRippleParams.w;
      float s=sin(x*k);
      acc.x+=amp*s;
      acc.yz+=(delta/dist)*amp*(cos(x*k)*k-1.24*x*s);
      /* Soft core, alive only for the first few frames: that is what
         separates a strike from a ring merely passing through. */
      acc.w+=exp(-dist*dist*1.15)*exp(-source.z*4.6)*source.w
        *smoothstep(0.,.06,source.z);
    }
    acc.xyz*=uRippleParams.z;
    return acc;
  }

  vec3 ambientSwell(vec2 p,vec2 dir,float k,float speed,float amp,float t){
    float phase=dot(dir,p)*k-t*speed;
    float c=cos(phase)*amp*k;
    return vec3(sin(phase)*amp,dir.x*c,dir.y*c);
  }

  vec3 ambientFlow(vec2 p){
    if(uRippleAmbient.x<=.001)return vec3(0.);
    float t=uRippleTime*uRippleAmbient.y;
    /* Mostly one way, with two crossing at a shallow angle: the shape
       wind leaves on open water, not a standing checkerboard. */
    vec3 acc=ambientSwell(p,vec2( .97, .24), .40, .55,.0052,t)
      +ambientSwell(p,vec2( .88,-.47), .63, .78,.0034,t)
      +ambientSwell(p,vec2( .99, .12),1.15,1.24,.0017,t)
      +ambientSwell(p,vec2( .71, .70),1.94,1.71,.0009,t)
      +ambientSwell(p,vec2(-.31, .95), .34, .38,.0040,t);
    return acc*uRippleAmbient.x;
  }
`;

    const water = new Water(
      new THREE.PlaneGeometry(130, 130),
      {
        textureWidth: 1024,
        textureHeight: 1024,
        waterNormals: waterNormal,
        sunDirection,
        /* A cold, pale body colour keeps the surface reading as a mirror of
           the sky rather than as a coloured pool: what little of the water
           itself shows through stays inside the glacial palette. */
        sunColor: 0xeef4f8,
        waterColor: 0xc2d6e6,
        distortionScale: 1.30,
        fog: true,
        alpha: .94,
        format: THREE.RGBAFormat
      }
    );
    water.rotation.x = -Math.PI / 2;
    water.position.y = 0;
    water.position.z = -13;
    water.receiveShadow = true;
    /* Water.js divides its reflection distortion by the view distance, so
       the surface goes glass-flat at the waterline. The reference plate
       keeps a slow swell all the way to the far bank, so give the term a
       floor and bias it vertically — that reads as horizontal banding in
       the mirrored image rather than as a shimmer. */
    water.material.uniforms.uRipples = uRipples;
    water.material.uniforms.uRippleParams = uRippleParams;
    water.material.uniforms.uRippleLive = uRippleLive;
    water.material.uniforms.uRippleMirror = uRippleMirror;
    water.material.uniforms.uRippleTime = uRippleTime;
    water.material.uniforms.uRippleAmbient = uRippleAmbient;
    water.material.fragmentShader = 'uniform float uRippleMirror;\n'
      + RIPPLE_GLSL
      + water.material.fragmentShader
        .replace(
          'surfaceNormal.xz * ( 0.001 + 1.0 / distance )',
          'surfaceNormal.xz * vec2( 0.55, 1.85 ) * ( 0.085 + 1.0 / distance )'
        )
        /* Close to the camera the mirror dissolves into flat water, the way
           the reference plate fades its reflection toward the foreground.
           Doing it here rather than in the river veil keeps the falloff even
           across the whole surface instead of tracing the river mesh edge. */
        .replace(
          'float theta = max( dot( eyeDirection, surfaceNormal ), 0.0 );',
          'reflectionSample = mix( reflectionSample, waterColor * 1.24,'
          + ' smoothstep( 30.0, 8.0, distance ) * 0.62 );\n'
          + 'float theta = max( dot( eyeDirection, surfaceNormal ), 0.0 );'
        )
        /* The pointer wake enters through the shading normal rather than the
           geometry. On a mirror that is the honest channel: what a real ring
           does to a mountain lying in the water is bend the reflection. */
        .replace(
          'vec3 surfaceNormal = normalize( noise.xzy * vec3( 1.5, 1.0, 1.5 ) );',
          'vec3 surfaceNormal = normalize( noise.xzy * vec3( 1.5, 1.0, 1.5 ) );\n'
          + 'vec4 pointerRipple = rippleField( worldPosition.xz );\n'
          + 'vec3 ambientRipple = ambientFlow( worldPosition.xz );\n'
          + 'surfaceNormal.xz -= ( pointerRipple.yz * 1.30'
          + ' + ambientRipple.yz * 7.5 ) * uRippleMirror;\n'
          + 'surfaceNormal = normalize( surfaceNormal );'
        )
        /* Soft-clipped rather than clamped: a hard ceiling on the crest is
           what flattens a ring into a decal. */
        .replace(
          'vec3 outgoingLight = albedo;',
          'float rippleLift = ( pointerRipple.x + ambientRipple.x ) * 13.0;\n'
          + 'rippleLift /= 1.0 + abs( rippleLift );\n'
          + 'vec3 outgoingLight = albedo'
          + ' + vec3( 0.86, 0.93, 1.0 ) * pointerRipple.w * 0.11 * uRippleMirror'
          + ' + vec3( 0.80, 0.90, 1.0 ) * rippleLift * 0.075;'
        );
    water.material.needsUpdate = true;
    water.material.uniforms.size.value = 1.35;
    water.material.uniforms.alpha.value = .88;
    water.renderOrder = 1;
    scene.add(water);
    /* The lake is off. What follows takes its place; the mirror is kept in
       the file for one more step, until the old water's callers are gone. */
    water.visible = false;

    /* ------------------------------------------------------------------
       THE SWELL
       Five Gerstner components on ONE dispersion law: omega = sqrt(g*k) times
       a single global scale. That scalar is the only liberty taken, and
       because wave speed goes as the square root of wavelength, slowing
       everything makes the sea read three times larger than its world units.
       That, and not viscosity, is what makes molten metal look heavy: a
       metal's gravity waves travel at exactly water's speed, since the
       relation is density-independent. What metal does not do is foam, spray,
       or carry fine chop.
       Components are never given independent speeds. Tied to one relation
       they read as one fluid; untied they read as stacked noise, and the drop
       stops looking like the same substance as the sea.
       The five phase offsets are not decoration: with all of them at zero
       every component crosses zero together at the world origin, putting a
       slope spike on the composition's exact centreline.
       ------------------------------------------------------------------ */
    const SEA_N = 5;
    const SEA_GLSL = `
  uniform vec4 uSeaWave[${SEA_N}];
  uniform vec4 uSeaDir[${SEA_N}];
  uniform vec2 uSeaCurrent;
  uniform float uSeaTime;
  uniform float uSeaGain;

  vec3 seaField(vec2 p,float cell,out vec3 n,out vec2 flow,out float lost){
    /* The whole field is bodily advected: waves on a current. One line,
       and it is where the left-to-right flow of the plate comes from — a
       single plane wave has no motion along its own crests. */
    vec2 q=p-uSeaCurrent*uSeaTime;
    vec3 disp=vec3(0.);
    vec3 B=vec3(1.,0.,0.);
    vec3 T=vec3(0.,0.,1.);
    flow=vec2(0.);
    lost=0.;
    for(int i=0;i<${SEA_N};i++){
      vec4 W=uSeaWave[i];
      vec4 D=uSeaDir[i];
      float lambda=6.2831853/W.x;
      /* Nyquist with a margin of three. Below it a component would beat
         against the ring spacing instead of being drawn. */
      float keep=1.-smoothstep(lambda*.22727,lambda*.38462,cell);
      /* 構圖上的收斂：畫面最前面那片金屬必須是全場最平靜的。keep 管的
         是網格解析不了的遠處，而近處五道浪全開，於是佔了半個構圖的地方
         反而最吵。這裡把三道短浪在 9.5→19 之間才放進來，最近的水面就只
         剩兩道長浪，成為一面真正的鏡子。
         注意下面的 lost 不能乘 calm：那會把近處的金屬磨粗，而近處的金屬
         正是唯一該保持完美鏡面的地方。 */
      float calm=mix(1.,smoothstep(9.5,19.0,length(cameraPosition.xz-p)),
        step(.333,W.x));
      float A=W.z*uSeaGain*keep*calm;
      float ph=W.x*dot(D.xy,q)-W.y*uSeaTime+D.z;
      float S=sin(ph),C=cos(ph);
      float WA=A*W.x;
      float QS=W.w*WA*S;
      disp.xz+=D.xy*(W.w*A*C);
      disp.y+=A*S;
      /* B is dP/dx and T is dP/dz. The cheap first-order normal shows its
         error in the mirror at this grazing angle, so the full Jacobian is
         kept: six extra multiply-adds per component, vertex side only. */
      B.x-=D.x*D.x*QS; B.y+=D.x*WA*C; B.z-=D.x*D.y*QS;
      T.x-=D.x*D.y*QS; T.y+=D.y*WA*C; T.z-=D.y*D.y*QS;
      /* Horizontal orbital velocity of a deep-water Gerstner wave. */
      flow+=D.xy*(W.w*A*W.y*S);
      /* The variance of a sine of slope amplitude s is half s squared. */
      float s=W.z*uSeaGain*W.x;
      lost+=(1.-keep*keep)*.5*s*s;
    }
    n=normalize(cross(T,B));
    return disp;
  }
`;

    /* ------------------------------------------------------------------
       THE SEA MESH
       A radial fan, not a plane. The camera sits just over a unit above the
       surface, so one unit of metal at the bottom of frame is fifty pixels
       deep and one unit far out is a single pixel: a uniform grid spends
       nearly every vertex it has where none is needed. Rings are laid out
       between uniform-on-screen and uniform-in-world, which keeps all five
       components alive out to where the drop lands and lets the far field
       dissolve into the backdrop instead of ending on a drawn line.
       The inner radius is load-bearing: the frame's bottom edge cuts the
       plane at about seven units, but a crest at the fan's inner rim would
       lift it back into frame if the rim were any further out.
       aCell is the larger of the ring gap and the spoke gap, so the vertex
       shader can fade any component the mesh can no longer carry. Distance
       makes the sea smooth instead of making it beat against its own
       tessellation.
       ------------------------------------------------------------------ */
    const SEA_LITE = DROPLET_LITE;
    const SEA_RINGS = SEA_LITE ? 104 : 168;
    const SEA_SPOKES = SEA_LITE ? 112 : 168;
    /* 內緣推到 1.6：畫面最底端量到的距離是 4.6 單位，因為浪峰會朝鏡頭抬起
       來，而扇形原本的內緣正好就在 4.0——於是底邊會露出扇心那道弧線，後面
       就是背景球。留兩倍的餘裕。 */
    const SEA_NEAR = 1.6;
    /* 外緣推到 600：原本的外緣落在地平線下方一點點，兩者亮度不一致時會在
       海的上緣畫出一條硬邊，那就是「薄紙帶」的上緣。 */
    const SEA_FAR = 600;
    const SEA_POW = .45;
    const SEA_SPAN = 76 * Math.PI / 180;

    function createSeaGeometry() {
      const N = SEA_RINGS, M = SEA_SPOKES;
      const count = (N + 1) * (M + 1);
      const positions = new Float32Array(count * 3);
      const cells = new Float32Array(count);
      const a = Math.pow(SEA_NEAR, -SEA_POW), b = Math.pow(SEA_FAR, -SEA_POW);
      const radii = new Float32Array(N + 1);
      for (let j = 0; j <= N; j++)radii[j] = Math.pow(a + (b - a) * j / N, -1 / SEA_POW);
      let p = 0, c = 0;
      for (let j = 0; j <= N; j++) {
        const d = radii[j];
        const prev = radii[Math.max(0, j - 1)], next = radii[Math.min(N, j + 1)];
        const sides = (j > 0 ? 1 : 0) + (j < N ? 1 : 0);
        const gap = Math.max((next - prev) / sides, d * SEA_SPAN / M);
        for (let i = 0; i <= M; i++) {
          const th = (i / M - .5) * SEA_SPAN;
          positions[p++] = Math.sin(th) * d;
          positions[p++] = 0;
          positions[p++] = -Math.cos(th) * d;
          cells[c++] = gap;
        }
      }
      const index = new Uint32Array(N * M * 6);
      let t = 0;
      for (let j = 0; j < N; j++)for (let i = 0; i < M; i++) {
        const A = j * (M + 1) + i, B = A + M + 1;
        /* 繞序：扇形的頂點是 x=sin(θ)d、z=-cos(θ)d，所以 (A,B,A+1) 的法線指
           向 -Y——正面朝下。鏡頭在水面上方，材質又是 FrontSide，整片海因此
           被背面剔除掉，只剩下浪面翻過垂直的那幾個像素會畫出來（量到的是
           57600 個像素裡只有 1725 個）。這裡把兩個三角形都反過來繞。 */
        index[t++] = A; index[t++] = A + 1; index[t++] = B;
        index[t++] = A + 1; index[t++] = B + 1; index[t++] = B;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      g.setAttribute('aCell', new THREE.BufferAttribute(cells, 1));
      g.setIndex(new THREE.BufferAttribute(index, 1));
      return g;
    }

    /* 每一道浪的波長都拉長 4.2 倍，而且五道全部留在同一條頻散關係上
       （ω/√k 恆為 1.7227，這才是「同一種流體」的定義）。
       為什麼要拉長：原本主浪的陡度 k·A 是 0.275，那是一片接近碎裂的強風
       浪；金屬流不會那樣。拉長之後陡度掉到 0.065，斜率均方根從 16.3 度降到
       3.9 度——這就是柵欄狀雜訊消失的原因，因為斜率的梯度是隨 A·k² 走的，
       拉長 4.2 倍等於梯度掉 17.6 倍，光帶在近處變成一個週期三十個像素，到
       遠方才壓縮進地平線。波長成了 46/28/17/10/6.5 單位，所以整片海上只橫
       過兩三道大摺——慢而重，那才是參考圖裡的樣子。
       ω 本身已經跟著掉了 √4.2＝2.05 倍，所以 timeScale 要往上補回來。 */
    const SEA_WAVES = [
      [.1360, 0.6353, .1850, 1.00], [.2233, 0.8140, .0870, .85],
      [.3649, 1.0406, .0390, .60], [.6106, 1.3462, .0160, .35],
      [.9652, 1.6924, .0074, .00]
    ];
    const SEA_DIRS = [
      [.28, .960, 0], [-.42, .908, 1.97], [.74, .673, 4.12],
      [-.88, .475, 2.55], [.96, -.280, 5.31]
    ];
    /* 五道浪各自的方位角，以及它們的平均方位。方向參數是繞著這個平均值轉
       的，所以「方位 0、扇開 1」就是原本的海，動了才會變。 */
    const SEA_DIR_ANGLES = SEA_DIRS.map(d => Math.atan2(d[0], d[1]));
    const SEA_DIR_MEAN = SEA_DIR_ANGLES.reduce((a, b) => a + b, 0) / SEA_DIR_ANGLES.length;
    /* 整片海一起轉。
       方位 HEADING 把浪列連同它底下的流一起旋轉——兩者一起轉，每一道浪和
       流速的內積都不變，所以那條「別讓流把某一道浪推到停住」的規則（都卜勒
       凍結）自動成立，轉到哪裡都不會出現卡住不動的摺痕。
       扇開 SPREAD 只縮放各道浪對平均方位的偏離：0 是五道完全平行，海面成為
       一組乾淨的長脊，最像鏡子；1 是原本的扇形；再往上就是交錯的湧浪。 */
    function applySeaDirs() {
      const h = (CONFIG.sea.heading || 0) * Math.PI / 180;
      const s = CONFIG.sea.spread === undefined ? 1 : CONFIG.sea.spread;
      for (let i = 0; i < SEA_DIRS.length; i++) {
        const th = SEA_DIR_MEAN + h + (SEA_DIR_ANGLES[i] - SEA_DIR_MEAN) * s;
        const v = seaUniforms.uSeaDir.value[i];
        v.x = Math.sin(th); v.y = Math.cos(th); v.z = SEA_DIRS[i][2];
      }
      /* 流也跟著轉，否則轉了方位之後流會橫著切過浪脊。 */
      const c = Math.cos(h), sn = Math.sin(h);
      seaUniforms.uSeaCurrent.value.set(
        CONFIG.sea.current * c + CONFIG.sea.drift * sn,
        -CONFIG.sea.current * sn + CONFIG.sea.drift * c
      );
    }

    const seaUniforms = Object.assign({
      uSeaWave: { value: SEA_WAVES.map(w => new THREE.Vector4(...w)) },
      uSeaDir: { value: SEA_DIRS.map(d => new THREE.Vector4(d[0], d[1], d[2], 0)) },
      uSeaCurrent: { value: new THREE.Vector2(CONFIG.sea.current, CONFIG.sea.drift) },
      uSeaTime: { value: 0 },
      uSeaGain: { value: CONFIG.sea.swell },
      uDetail: { value: new THREE.Vector2(CONFIG.sea.detail, CONFIG.sea.filament) },
      uRough: { value: CONFIG.chrome.rough },
      uRippleLift: { value: CONFIG.sea.lift },
      uHaze: { value: new THREE.Vector2(CONFIG.sea.haze, CONFIG.sea.hazeFar) },
      uDropXZ: { value: new THREE.Vector2(CONFIG.drop.x, CONFIG.drop.z) },
      uDropRad: { value: 1.248 },
      uDropOcclude: { value: CONFIG.chrome.occlude },
      /* x near, y far, z amount: the ink on the closest metal. */
      uSeaEdge: { value: new THREE.Vector3(7.5, 15.0, CONFIG.sea.edge) },
      uBandGain: { value: CONFIG.field.bandGain },
      /* 英雄水珠，給海面倒影用：xyz 是位置，w 是半徑。 */
      uEnvHero: { value: new THREE.Vector4(0, 3.36, -7, 1.44) },
      uHeroOn: { value: 0 },
      /* Bound BY REFERENCE, never copied: spawnRipple, queueRipple and
         splashAt then drive this surface with no change at all. */
      uRipples, uRippleParams, uRippleLive, uRippleTime, uRippleMirror, uRippleAmbient,
      uVeilOn: { value: 1 }
    }, montisEnvUniforms, montisChromeUniforms, montisVeilUniforms);
    const seaMaterial = new THREE.ShaderMaterial({
      uniforms: seaUniforms,
      fog: false,
      defines: SEA_LITE ? { MONTIS_LITE: 1, SEA_LITE: 1 } : {},
      vertexShader: `
    attribute float aCell;
    ${SEA_GLSL}
    ${RIPPLE_GLSL}
    uniform float uRippleLift;
    varying vec3 vWorld;
    varying vec3 vNormal;
    varying vec2 vFlow;
    varying float vLost;
    varying float vDist;
    void main(){
      vec4 world=modelMatrix*vec4(position,1.);
      vec3 n;vec2 flow;float lost;
      vec3 d=seaField(world.xz,aCell,n,flow,lost);
      world.xyz+=d;
      /* The pointer's wake and the drop's impact move the metal itself,
         not just its shading: a strike is a real dent. Sampled at the
         displaced position, so the ring rides the fluid and bends as the
         swell carries it. */
      vec4 rip=rippleField(world.xz);
      world.y+=rip.x*uRippleLift;
      vWorld=world.xyz; vNormal=n; vFlow=flow; vLost=lost;
      vDist=length(cameraPosition-world.xyz);
      gl_Position=projectionMatrix*viewMatrix*world;
    }
  `,
      fragmentShader: MONTIS_ENV_GLSL + MONTIS_CHROME_GLSL + MONTIS_VEIL_GLSL + MONTIS_DITHER_GLSL + RIPPLE_GLSL + `
    uniform vec2 uSeaCurrent,uDetail,uHaze,uDropXZ;
    uniform float uSeaTime,uRough,uRippleLift,uDropRad,uDropOcclude;
    uniform vec3 uSeaEdge;
    uniform float uBandGain,uHeroOn;
    /* Declared here rather than in the shared ripple chunk: the old lake
       carried it on the mirror's own shader. */
    uniform float uRippleMirror;
    varying vec3 vWorld; varying vec3 vNormal; varying vec2 vFlow;
    varying float vLost; varying float vDist;

    void main(){
      /* ------------------------------------------------------------
         THE FINE STRUCTURE
         Shading only: the mesh never carries it, so it costs no vertices
         and cannot beat against the ring spacing. Strongly anisotropic —
         crest lines along x, so it varies in z, which at this near-
         grazing camera comes out as the razor-thin horizontal speculars
         of the plate, stretched along the flow. Each component fades on
         its own radial footprint, and the slope the fade removes is not
         thrown away: it widens the specular lobe instead.
         ------------------------------------------------------------ */
      /* 只有海面把水珠放進它反射的房間裡。 */
      montisEnvFrom=vWorld;
      montisEnvHero=uHeroOn;
      vec3 nrm=normalize(vNormal);
      float lost=vLost;
      /* Offset by the swell's own orbital velocity: in a real fluid the
         fine ripples ARE carried by the long waves, and that is what
         draws the filaments out where two folds meet. */
      vec2 q=vWorld.xz-uSeaCurrent*uSeaTime+vFlow*uDetail.y;
      /* 只留一層，而且只留四分之一的幅度。這三層原本是給漫射表面當凹凸用
         的，但在鏡面上，一道 .099 的斜率會把反射仰角掃過半條光帶 —— 每一
         條細紋都畫出一條亮暗硬邊，而且三層幾乎同方向，就成了平行的皺褶。
         另外兩層的斜率變異數不是丟掉，而是併進 lost，由粗糙度轉成較寬的
         高光，那才是它們真正的物理意義。 */
      /* 這一層也要跟著拉長 4.2 倍。原本的波長是 0.86 個世界單位，在浪身
         都拉長之後它成了畫面上唯一的高頻，於是整片近海看起來像瓦楞紙。
         時間項同樣依 √λ 放慢，它才跟海是同一種流體。 */
      float f,a,ph;
      f=1.-smoothstep(24.0,46.0,vDist);
      a=.016*uDetail.x*f; ph=1.740*(.16*q.x+.987*q.y)-.659*uSeaTime;
      nrm.x-=.16*a*cos(ph); nrm.z-=.987*a*cos(ph);
      lost+=(1.-f*f)*.5*.016*.016*uDetail.x*uDetail.x;
      lost+=uDetail.x*uDetail.x*(1.-smoothstep(9.,22.,vDist))*.00129;

      /* The ring is re-evaluated here rather than interpolated: the mesh
         cannot resolve a packet this narrow at the drop's distance, but a
         fragment can, and both carry the same scale so they agree
         wherever both resolve it. */
      vec4 rip=rippleField(vWorld.xz);
      nrm.xz-=rip.yz*uRippleLift*.7647*uRippleMirror;
      nrm=normalize(nrm);

      /* What distance took from the detail comes back as a wider specular
         lobe. Without this the far sea is a perfect mirror and reads as
         plastic; with it, satin. */
      /* 還要再加一項，而這一項才是鋁箔感的真正解藥：lost 只記了「網格」
         丟掉的斜率，完全沒有人管「一個像素」丟掉的斜率。在十四單位外，
         一個像素橫跨的反射仰角是 0.1，那裡面塞著三分之一條光帶、好幾條
         軌道和好幾條細絲，而它們全都以六七成的對比被畫出來——那不是細
         節，那是混疊。fwidth 量的就是這個像素足跡，把它折進粗糙度，雜訊
         就變回色調，鏡面也不會再隨著鏡頭爬動。 */
      float foot=2.*fwidth(nrm.z)+.6*fwidth(nrm.x);
      float rough=sqrt(uRough*uRough+2.*lost+.25*foot*foot);

      vec3 V=normalize(cameraPosition-vWorld);
      /* Signed curvature from the swell's own second difference, cheaply:
         negative in a crease. */
      float curv=clamp((nrm.y-1.)*9.-rip.x*2.4,-1.,1.);
      /* A low-frequency gate on which folds may flash at all: widen this
         smoothstep before ever touching the amount. */
      /* 原本這個 mask 是一條波長 25 單位的正弦，橫過整片海慢慢飄——那不是
         遮罩，那是一條會移動的大條紋，而且在掠射角下整條同時全亮，就成了
         那些淡紫色的斑塊。鉻的色散只出現在兩道摺相接的細絲上，所以改成綁
         在摺本身：只有較陡的側坡才配帶色。 */
      float fold=clamp((1.-nrm.y)*260.,0.,1.);
      float mask=smoothstep(.45,.95,fold);
      vec3 col=montisChrome(nrm,V,vFlow+uSeaCurrent*.35,curv,rough,mask,1.,0.);

      /* Contact, not a shadow. A mirror has nothing to shade, so the drop
         reads as reflection occlusion: the metal under it returns less of
         the room. The bright column welding the bead to the sea is not
         drawn here — it is already there, because the core's broad lobes
         stand behind the drop and the sea mirrors them. */
      /* 但它必須跟著水面走，否則就是一塊漂在畫面上、和底下的波紋毫無關
         係的圓斑——客戶說的「像污漬」就是它。往鏡頭方向拉長，因為這是反
         射的遮蔽而不是影子；再用 nrm.y 開關，讓波峰可以直接穿過去。 */
      vec2 off=vWorld.xz-uDropXZ;
      off.y*=.42;
      float r2=dot(off,off)/max(uDropRad*uDropRad*4.2,1e-4);
      col*=1.-uDropOcclude*exp(-r2)*(.30+.70*smoothstep(.34,-.26,vWorld.y));

      /* No fog and no horizon line: the sea dissolves into the exact
         direction it is mirroring, which is exposure-correct by
         construction and leaves no seam where the fan ends. */
      vec3 view=normalize(vWorld-cameraPosition);
      /* The near edge: the closest metal looks almost straight down into
         itself, and in a real pour that is the inkiest part of the plate.
         A multiply, never a lerp to a colour, so it takes the value down
         and the blue up without touching a single specular. */
      col=mix(col,col*uEnvInk*1.05,smoothstep(uSeaEdge.y,uSeaEdge.x,vDist)*uSeaEdge.z);
      /* 用背景自己的光帶量去溶解，兩邊才會等亮；原本海的外緣比它上面一像
         素的天空亮 0.254，那就是海上緣那條硬邊。順便用分支省掉九成像素的
         一次環境取樣。 */
      float hz=smoothstep(uHaze.x,uHaze.y,vDist);
      if(hz>.001)col=mix(col,montisEnv(view,.05,uBandGain,0.),hz);
      col=montisVeil(col,view);
      col+=montisDither(gl_FragCoord.xy)*.004;
      gl_FragColor=vec4(max(col,vec3(0.)),1.);
    }
  `
    });

    const sea = new THREE.Mesh(createSeaGeometry(), seaMaterial);
    sea.name = 'montis-sea';
    /* The bounds are wrong the moment the waves displace it. */
    sea.frustumCulled = false;
    sea.receiveShadow = false;
    sea.castShadow = false;
    sea.renderOrder = 1;
    scene.add(sea);

    /* Fine horizontal caustics keep the reflection from reading as a flat
       mirror. Their frequencies are deliberately stretched like calm water
       viewed from a camera only a little above the surface. */
    const waterVeilMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime: { value: 0 },
        uBlue: { value: new THREE.Color('#8fb6cc') },
        uWhite: { value: new THREE.Color('#eef7fb') }
      },
      vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
    }
  `,
      fragmentShader: `
    uniform float uTime;
    uniform vec3 uBlue,uWhite;
    varying vec2 vUv;
    void main(){
      float bend=sin(vUv.x*42.+uTime*.18)*.010
        + sin(vUv.x*17.-uTime*.11)*.006;
      float a=abs(sin((vUv.y+bend)*26.-uTime*.18));
      float b=abs(sin((vUv.y-bend*.7)*13.+uTime*.12));
      float fine=pow(1.-a,14.);
      float broad=pow(1.-b,16.);
      float horizon=smoothstep(.05,.58,vUv.y);
      vec3 col=mix(uBlue,uWhite,clamp(fine+broad*.65,0.,1.));
      float alpha=(.008+fine*.030+broad*.022)*horizon;
      gl_FragColor=vec4(col,alpha);
    }
  `
    });
    const waterVeil = new THREE.Mesh(
      new THREE.PlaneGeometry(130, 130),
      waterVeilMaterial
    );
    waterVeil.rotation.x = -Math.PI / 2;
    waterVeil.position.set(0, .018, -13);
    waterVeil.renderOrder = 2;
    scene.add(waterVeil);

    /* The crests themselves. Height alone is invisible on a plane seen this
       flat, so the overlay shades the analytic slope instead: a specular
       glint on the face turned toward the sun, a cooler trough behind it,
       and a bright core for the first frames of a strike. Fragments the
       field never reaches are discarded, so a still lake costs one branch. */
    const rippleOverlayMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: {
        uRipples,
        uRippleParams,
        uRippleLive,
        uRippleTime,
        uRippleAmbient,
        uOpacity: { value: 1 },
        uSun: { value: new THREE.Vector3(-.55, .72, .34).normalize() },
        uCrest: { value: new THREE.Color('#f4fcff') },
        uTrough: { value: new THREE.Color('#8aa8bd') }
      },
      vertexShader: `
    varying vec3 vWorld;
    void main(){
      vec4 world=modelMatrix*vec4(position,1.);
      vWorld=world.xyz;
      gl_Position=projectionMatrix*viewMatrix*world;
    }
  `,
      fragmentShader: `
    precision highp float;
    ${RIPPLE_GLSL}
    uniform float uOpacity;
    uniform vec3 uSun,uCrest,uTrough;
    varying vec3 vWorld;
    void main(){
      vec4 field=rippleField(vWorld.xz);
      vec3 flow=ambientFlow(vWorld.xz);
      /* Soft clip instead of clamp: the crest rolls over rather than
         hitting a ceiling, which is the whole difference between a
         ripple and a decal stamped on the surface. */
      float raw=(field.x+flow.x)*18.;
      float lift=raw/(1.+abs(raw));
      /* The swell carries almost no height but plenty of tilt, so it is
         exaggerated far harder than the rings to read at all. */
      vec3 n=normalize(vec3(
        -(field.y*2.0+flow.y*16.),
        1.,
        -(field.z*2.0+flow.z*16.)
      ));
      vec3 viewDir=normalize(cameraPosition-vWorld);
      vec3 halfDir=normalize(uSun+viewDir);
      float spec=pow(max(dot(n,halfDir),0.),26.);
      /* Rings shed near the horizon are thinner than a pixel; fade them
         out rather than let them alias into a shimmer. */
      float range=smoothstep(74.,7.,length(cameraPosition-vWorld));
      vec3 col=mix(uTrough,uCrest,clamp(lift*.5+.5,0.,1.));
      col+=vec3(.96,.99,1.)*spec*.42;
      float alpha=(abs(lift)*.22+spec*.30+field.w*.22)*range*uOpacity;
      if(alpha<.0012)discard;
      gl_FragColor=vec4(col,clamp(alpha,0.,.72));
    }
  `
    });
    const rippleOverlay = new THREE.Mesh(
      new THREE.PlaneGeometry(130, 130),
      rippleOverlayMaterial
    );
    rippleOverlay.rotation.x = -Math.PI / 2;
    rippleOverlay.position.set(0, CONFIG.water.y + .06, -13);
    rippleOverlay.renderOrder = 3.6;
    rippleOverlay.frustumCulled = false;
    scene.add(rippleOverlay);
    /* The lake's own layers are off with the lake: the metal carries its
       rings itself, in the surface rather than as a decal over it. */
    waterVeil.visible = false;
    rippleOverlay.visible = false;

    /* Water.js re-renders the scene from the mirrored camera. The overlay
       lies parallel to that mirror, so left visible it would paint a second
       set of rings inside the reflection; hide it for that pass only. */
    const waterReflectionPass = water.onBeforeRender;
    /* Counted by frame() around composer.render(). With the droplet's
       refraction on, three draws the opaque scene twice a frame (into the
       transmission target, then to the screen) and the water would render
       its mirror both times, each with a refraction pass of its own. Both
       draws use the main camera, so the first mirror serves the second. */
    let renderFrame = 0;
    let mirrorFrame = -1;
    water.onBeforeRender = function (renderer, reflectedScene, reflectedCamera) {
      if (mirrorFrame === renderFrame) return;
      mirrorFrame = renderFrame;
      const wasVisible = rippleOverlay.visible;
      rippleOverlay.visible = false;
      /* The droplet marches from whichever camera draws it. In the mirror it
         keeps only what stands above the water, spends fewer steps, and sizes
         its pixels to the 1024 reflection target. */
      const U = dropletUniforms;
      const steps = U.uMaxSteps.value;
      const angle = U.uPixelAngle.value;
      U.uMirrorPass.value = 1;
      U.uWaterY.value = water.position.y;
      U.uMaxSteps.value = Math.max(12, Math.round(steps * .45));
      U.uPixelAngle.value = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) / 1024;
      waterReflectionPass.call(this, renderer, reflectedScene, reflectedCamera);
      U.uMirrorPass.value = 0;
      U.uMaxSteps.value = steps;
      U.uPixelAngle.value = angle;
      rippleOverlay.visible = wasVisible;
    };

    /* ------------------------------------------------------------------
       PROJECT GLTF ASSETS
       The authored terrain, river surface and droplet replace the earlier
       procedural stand-ins. The reflective Water plane remains underneath
       the river mesh so the mountain is still mirrored in the foreground.
       ------------------------------------------------------------------ */
    let assetsReady = false;
    const assetManager = new THREE.LoadingManager();
    assetManager.onProgress = (_url, loaded, total) => {
      loaderNote.textContent = `LOADING SCENE ${Math.round(loaded / total * 100)}%`;
    };
    assetManager.onLoad = () => {
      assetsReady = true;
      loaderNote.textContent = 'SCENE READY';
      /* The film is heavy: only start buffering once the 3D scene is done,
         so it never competes with the GLTF loads for the first paint. */
      warmSectionTwoVideo();
    };
    assetManager.onError = url => {
      loaderNote.textContent = 'ASSET LOAD FAILED';
      console.error('Could not load asset:', url);
    };
    const gltfLoader = new GLTFLoader(assetManager);

    function fitAsset(model, targetSize, grounded = false) {
      model.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);
      const pivot = new THREE.Group();
      model.position.set(-center.x, grounded ? -box.min.y : -center.y, -center.z);
      pivot.scale.setScalar(targetSize / Math.max(size.x, size.z, size.y));
      pivot.add(model);
      return pivot;
    }

    /* The snowy range and its glints are gone with the rest of the valley:
       nothing stands behind the metal now but light. */

    const riverUniforms = {
      uTime: { value: 0 },
      uRipples,
      uRippleParams,
      uRippleLive,
      uRippleTime,
      uRippleAmbient,
      uOpacity: { value: CONFIG.water.opacity },
      uWaveHeight: { value: CONFIG.water.waveHeight },
      uWaveSpeed: { value: CONFIG.water.waveSpeed },
      uImpactAge: { value: 99 },
      uImpactStrength: { value: CONFIG.physics.impact },
      uImpactCenter: { value: new THREE.Vector2(CONFIG.drop.x, CONFIG.drop.z) },
      uRippleSpeed: { value: CONFIG.physics.rippleSpeed },
      uRippleDamping: { value: CONFIG.physics.damping },
      uDeep: { value: new THREE.Color('#b6c9da') },
      uShallow: { value: new THREE.Color('#dfeaf4') },
      uSun: { value: new THREE.Vector3(-.55, .72, .34).normalize() }
    };
    const riverMaterial = new THREE.ShaderMaterial({
      uniforms: riverUniforms,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      vertexShader: `
    uniform float uTime,uWaveHeight,uWaveSpeed;
    uniform float uImpactAge,uImpactStrength,uRippleSpeed,uRippleDamping;
    uniform vec2 uImpactCenter;
    varying vec3 vWorld;
    varying vec3 vNormalW;
    varying float vLift;
    varying float vImpact;
    void main(){
      float phase=mod(uTime*uWaveSpeed*.92,6.2831853);
      vec3 pos=position;
      float a=sin(position.x*.027+phase);
      float b=sin(position.z*.038-phase*2.);
      float c=sin((position.x+position.z)*.016+phase*3.);
      float d=sin((position.x-position.z)*.012-phase*4.);

        * exp(-uImpactAge*3.4)*sin(uImpactAge*12.);

      vWorld=world.xyz;

      /* The shading normal is derived from the wave field rather than
         taken from the mesh: the authored river is coarsely tessellated
         and its face normals tile the reflection into flat polygons. */
      float slopeX=cos(world.x*.42+phase)*.055
        + cos((world.x+world.z)*.19+phase*2.)*.030;
      float slopeZ=cos(world.z*.36-phase*1.4)*.050
