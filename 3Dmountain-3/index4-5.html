    /* ------------------------------------------------------------------
       前散的每一幀。
       整個函數是 (progress) 的純函數：沒有速度、沒有積分、沒有一次性旗
       標，所以往回捲的時候珠子會沿著同一條路倒退回水珠體內。這是這個設
       計最重要的一條規則，也是為什麼不用粒子系統。
       ------------------------------------------------------------------ */
    function updateDispersal(progress, breakUp, flight, hx, hy, hz) {
      const DZ = CONFIG.disperse;
      const n = Math.min(DISPERSE_MAX, Math.max(0, Math.round(DZ.beads)));
      if (breakUp <= .0005 || n === 0) {
        if (disperseMesh.visible) {
          disperseMesh.visible = false;
          disperseMesh.count = 0;
        }
        /* 房間歸位。這兩個 uniform 是 montisEnv 共用的，只有 card>0 的人
           看得到（英雄水珠和珠子），但還是要一格不差地放回去。 */
        montisEnvUniforms.uEnvSquash.value = ENV_SQUASH_BASE;
        montisEnvUniforms.uEnvKey.value.copy(ENV_KEY_BASE);
        return;
      }
      disperseMesh.visible = true;
      disperseMesh.count = n;
      /* currentDropRadius() 本身就已經乘過 CONFIG.drop.scale 了，再乘一次
         整團珠子會大 1.2 倍、體積多七成，近處那幾顆會把畫面糊成一片。 */
      const R = currentDropRadius();
      const extra = disperseMesh.geometry.attributes.instanceExtra;
      const camZ = camera.position.z;
      /* ----------------------------------------------------------------
         真正的彈道，全部是鏡頭時間 t 的閉式函數。
         原本的寫法（z = hz + travel·fi^2.05、側向與 fi 成線性）有四個假：
         每顆走同一條律、沒有重力、沒有阻力、小珠子不會比大珠子快。而且
         它用 progress 當時間——progress 會減速，所以最小的碎片在真實時
         間裡比最大的慢 2.65 倍，整場灑落看起來像是沒力了在爬。
         這裡：每顆有自己的出發速度（小的快、再乘個別抖動）、線性阻力
         （小的拖得重，係數 ∝ (R/r)^sizeDrag）、重力、脫離延遲。線性阻力
         加重力有標準閉式解：
           p(t) = p0 + (v0 − g/k)·(1−e^(−kt))/k + g·t/k
         所以往回捲一格不差。到達時間的散佈是從這些物理量長出來的，不
         是排程出來的。
         ---------------------------------------------------------------- */
      const tShot = shotTime(progress);
      const tBreak = shotTime(.10);
      const lead = DISPERSE_SIZES[0];
      const tanCone = Math.tan(THREE.MathUtils.degToRad(DZ.cone));
      const g = Math.max(DZ.gravity, 0);
      let shown = 0;
      let dNear = Infinity;
      for (let i = 0; i < n; i++) {
        const s = disperseSeeds[i];
        const ratio = lead / s.size;
        /* 這顆自脫離以來的時間。衛星滴晚脫離。 */
        const tl = Math.max(0, tShot - tBreak - s.rel * DZ.release);
        const v0 = DZ.speed * s.jit * Math.pow(ratio, DZ.sizeSpeed);
        const k = Math.max(DZ.drag, .05) * Math.pow(ratio, DZ.sizeDrag);
        const e = 1 - Math.exp(-k * tl);
        /* 出發速度：主要朝鏡頭（+z），錐角內帶側向分量，再加一點上揚。 */
        const vx0 = v0 * tanCone * s.swing * s.dir.x;
        const vy0 = v0 * tanCone * s.swing * s.dir.y + v0 * DZ.loft;
        const vz0 = v0;
        /* 出生位置：塞在英雄水珠體內。 */
        const px = hx + s.dir.x * R * s.pack;
        const py = hy + s.dir.y * R * s.pack;
        const pz = hz + s.packZ * R;
        const x = px + vx0 * e / k;
        const y = py + (vy0 + g / k) * e / k - g * tl / k;
        const z = pz + vz0 * e / k;
        /* 現在的速度向量（同一組閉式解的導數）。 */
        const decay = 1 - e;
        const vx = vx0 * decay;
        const vy = vy0 * decay - (g / k) * e;
        const vz = vz0 * decay;
        const speed = Math.hypot(vx, vy, vz);
        /* 拉長沿著「真正的」速度向量，不是世界 Z：珠子有側向分量，沿 Z
           拉會歪。小珠子變形得多（表面張力對半徑的依賴）。 */
        if (speed > 1e-4) {
          disperseVel.set(vx / speed, vy / speed, vz / speed);
          disperseQuat.setFromUnitVectors(Z_AXIS, disperseVel);
        } else {
          disperseQuat.identity();
        }
        /* 小珠子的相依用 ratio^.25 而不是 √ratio：最小那顆本來就快 2.7
           倍，再乘 3 倍的變形量就成了 6:1 的雪茄。現在主珠全速 1.2:1，
           最小的快珠約 2:1——小而快的液滴的確會拉長，但那是水滴，不是針。 */
        const flightStretch = 1 + Math.min(
          DZ.stretch * (speed / Math.max(DZ.speed, 1)) * Math.pow(ratio, .25) * .35,
          .9
        );
        /* Rayleigh 二階模：斷開之後液滴不是「鬆回圓球」，它會擺——長橢
           →扁橢→長橢，越小擺得越快（ω ∝ r^-1.5），阻尼比 ζ。上限 84
           rad/s，那是 75 毫秒一週期＝4.5 格，再快就在 60 fps 下混疊。
           脫離前 tl=0，所以它天生是朝飛行方向拉長的——那就是細絲。 */
        const omega = Math.min(84, DZ.ringFreq * Math.pow(ratio, 1.5));
        const ring = 1 + DZ.ring * Math.exp(-DZ.ringDamp * omega * tl)
          * Math.cos(omega * tl + s.ringPhase);
        /* 體積守恆：z 軸拉 sz，橫向縮 1/√sz。 */
        const sz = Math.max(flightStretch * ring, .35);
        const sxy = 1 / Math.sqrt(sz);
        /* 過近平面：最後 nearFade 個單位之內化進光裡，不是啪一聲不見。 */
        const dist = camZ - z;
        const near = THREE.MathUtils.clamp(dist / Math.max(DZ.nearFade, .05), 0, 1);
        const born = smooth01((breakUp - s.rel * .35) / .5);
        const fade = born * smooth01(near * 1.6);
        if (fade > .003) {
          shown++;
          if (dist < dNear) dNear = dist;
        }
        const radius = R * s.size * born;
        dispersePos.set(x, y, z);
        disperseScale.set(radius * sxy, radius * sxy, radius * sz);
        disperseMatrix.compose(dispersePos, disperseQuat, disperseScale);
        disperseMesh.setMatrixAt(i, disperseMatrix);
        extra.array[i * 3] = fade;
        /* 球體自轉在解析環境下是看不見的——法線沒變，反射就沒變。所以
           「轉」這件事寫在虹彩遮罩的相位上：色斑會沿著珠子表面爬，那才
           是眼睛真正讀得到的旋轉。轉速隨時間，不隨進度。 */
        extra.array[i * 3 + 1] = s.seed + tl * DZ.spin;
        /* 越靠近鏡頭越自體發光，於是它是「化成光」而不是「淡掉」。 */
        extra.array[i * 3 + 2] = (1 - near) * 1.35;
      }
      disperseMesh.instanceMatrix.needsUpdate = true;
      extra.needsUpdate = true;
      /* 沒有一顆看得見就整個關掉。否則減少動態模式一格跳到終點、或者正
         常轉場走到尾巴之後，十五顆全透明的球會在鏡頭背後永遠畫下去。 */
      disperseMesh.visible = shown > 0;
      if (shown === 0) disperseMesh.count = 0;

      /* 近距離的鉻。球面是無尺度的：把螢幕大小固定住，反射的放大率、
         V 在球面上的擺幅、環境的模糊，在 17、4、0.5 單位外全都一樣。球
         自己的著色說不出它離你多近——所以「扁平的塊」不是著色不夠，是
         反射裡的內容不夠。離鏡頭最近的那顆決定整組的房間：光帶開起來、
         黑卡退開、粗糙度降到近乎鏡面（那才是「濕」）、透光核心放大。
         這些全是珠子材質自己的 uniform；共用的 uEnvSquash / uEnvKey 一
         動，天空和海面會一起被重新打光，所以碰都不碰。 */
      const u = disperseMaterial.uniforms;
      const close = shown > 0
        ? 1 - smooth01((dNear - .40) / 8.60)
        : 0;
      const L = THREE.MathUtils.lerp;
      u.uBeadBand.value = L(.16, .86, close);
      u.uDropCard.value = L(CONFIG.drop.card, .22, close);
      u.uChromeRough.value = L(CONFIG.drop.roughness, .012, close);
      u.uDropLens.value.set(
        L(CONFIG.drop.lens, 1.05, close),
        L(CONFIG.drop.lensEdge, 3.4, close)
      );
      u.uDropRim.value.set(L(CONFIG.drop.rim, 1.0, close), CONFIG.drop.rimEdge);
    }

    function updateDropTransition(dt, time) {
      updateEntry(dt);
      /* While the orb is surfacing it owns its own height, stretch and the
         brightness of everything orbiting it. */
      const heroY = entry.running ? entry.y : CONFIG.drop.y;
      const heroStretch = entry.running ? entry.stretch : 0;
      const heroExtras = entry.running ? entry.extras : 1;
      if (reduceMotion) {
        dropTransition.progress = dropTransition.target;
      } else {
        const follow = 1 - Math.exp(-dt * CONFIG.transition.speed * 2.25);
        dropTransition.progress += (
          dropTransition.target - dropTransition.progress
        ) * follow;
      }
      if (Math.abs(dropTransition.target - dropTransition.progress) < .0005) {
        dropTransition.progress = dropTransition.target;
      }

      const progress = THREE.MathUtils.clamp(dropTransition.progress, 0, 1);
      /* ----------------------------------------------------------------
         重新分節。水珠不再往下掉，它朝鏡頭散開。
           .00-.07  蓄勢：水珠先往後縮一點點、壓扁。沒有這一下，斷裂會
                    像是平白發生的；動畫裡這叫預備動作。
           .07-.26  斷裂：英雄水珠淡出，珠子從它體內長出來。
           .10-.68  飛行：珠子以進度的 2.05 次方加速穿過十七個單位。
           .48-.78  過鏡：珠子陸續掠過近平面，化進光裡。
           .44-.82  光芒：泛光、曝光、面紗一起推到高點再落下。
           .62-.88  第二塊的影片從光底下浮上來。
           .74-.94  畫布淡出。
         每一項都是 progress 的純函數，沒有任何一次性旗標，所以往回捲的
         時候整段會倒著播回來。
         ---------------------------------------------------------------- */
      const DZ = CONFIG.disperse;
      /* 預備動作要是一個真正的脈衝：靜止時必須剛好是 0，否則水珠平常就
         被推到 z=-7.15 而不是 -7。高斯在 p=0 還有 27% 的值，所以改用一
         個兩端都歸零的窗。 */
      const anticip = smooth01(progress / .055)
        * (1 - smooth01((progress - .055) / .06));
      const breakUp = smooth01((progress - .07) / .19);
      const flight = smooth01((progress - .10) / .58);
      /* 光的包絡分成三條，不是一條。
         ATTACK 在珠子還在穿過鏡頭的時候就起，比第一顆抵達鏡頭平面早
         0.03 秒——等珠子走光才亮，那叫剪接，不叫發光。
         CORE 是一顆窄高斯，只有它負責「爆」的那一下。
         RELEASE 慢，因為全畫面的亮度事件要是收得太快，讀起來又是一刀剪
         掉而不是光在衰減。
         門檻另外用一條更快的釋放：它必須比光幕早回到基準，否則最後三分
         之二的收尾會整片糊成牛奶。 */
      const flareAtk = smooth01((progress - .38) / .20);
      const flareRel = 1 - smooth01((progress - .62) / .26);
      const flareCut = 1 - smooth01((progress - .60) / .14);
      const burst = Math.exp(
        -Math.pow((progress - DZ.burstAt) / DZ.burstWidth, 2)
      );
      const flare = flareAtk * flareRel;
      /* 英雄水珠在斷裂期間淡出；珠子接手。 */
      const dissolve = smooth01((progress - .07) / .17);
      const flareExpand = smooth01((progress - .26) / .40);
      const flareIgnition = smooth01((progress - .30) / .16);
      const flareFade = 1 - smooth01((progress - .62) / .24);
      const impactPulse = burst * CONFIG.transition.wobble;
      const overlayAlpha = smooth01((progress - DZ.handoff) / .22)
        * CONFIG.transition.sectionFade;
      const touchFade = 1 - smooth01(progress / .12);
      const dropX = CONFIG.drop.x + dropTouch.offset.x * touchFade;
      const dropY = heroY + dropTouch.offset.y;
      /* 蓄勢時往後縮 .55 個單位——離鏡頭更遠，所以下一刻的衝出來更有落差。 */
      const dropZ = CONFIG.drop.z - anticip * .55;

      dropRoot.visible = dissolve < .992;
      dropMaterial.opacity = 1 - dissolve;
      dropRoot.position.set(
        dropX,
        dropY,
        dropZ
      );
      dropRoot.rotation.set(
        CONFIG.drop.rx,
        CONFIG.drop.ry,
        CONFIG.drop.rz - dropTouch.offset.x * .10 * touchFade
      );
      /* Squash and stretch from the pointer: the bead lengthens along the
         direction it is thrown and thins across it, then the spring pulls
         it back round. */
      const jellyX = THREE.MathUtils.clamp(
        Math.abs(dropTouch.velocity.x) * .075, 0, .20
      ) * touchFade;
      const jellyY = THREE.MathUtils.clamp(
        Math.abs(dropTouch.velocity.y) * .075, 0, .20
      ) * touchFade;
      dropRoot.scale.set(
        CONFIG.drop.scale * (1 - heroStretch * .42 + jellyX - jellyY * .62),
        CONFIG.drop.scale * (1 + heroStretch + jellyY - jellyX * .62),
        CONFIG.drop.scale * (1 - heroStretch * .42 - (jellyX + jellyY) * .34)
      );
      /* After the group has this frame's place and squash, so the cluster
         rides exactly with it. */
      updateGatherLoop(dt, dissolve);
      dropShapeUniforms.uTransitionWobble.value = 0;
      syncDroplet(dt, time);
      updateDispersal(progress, breakUp, flight, dropX, dropY, dropZ);
      dropMotes.material.uniforms.uTime.value = time;
      dropMotes.material.uniforms.uTransition.value = impactPulse * .68;
      dropMotes.material.uniforms.uOpacity.value =
        CONFIG.details.motes * (1 - dissolve) * (1 - overlayAlpha) * heroExtras;
      /* Lights turned to zero are taken out of the frame, not drawn as
         nothing: no draw calls, and the pointer's raycast skips them. */
      dropMotes.visible = CONFIG.details.motes > 0;
      orbHighlights.forEach(highlight => { highlight.visible = CONFIG.details.highlight > 0; });
      dropOrbitGroup.visible = CONFIG.details.satelliteIntensity > 0;
      glowTop.visible = glowFoot.visible = CONFIG.details.glow > 0;
      waterGlints.material.uniforms.uTime.value = time;
      waterGlints.material.uniforms.uTransition.value = impactPulse * .24;

      /* ----------------------------------------------------------------
         光芒。
         原本的「光芒」只是水面上一小團青色光暈：量過整幀的平均亮度，從
         頭到尾只從 166 動到 170（滿格 255），也就是 2%——難怪讀不出來。
         真正的爆光要從畫面本身來，所以這裡推的是泛光和曝光，DOM 的面紗
         只是最後一層收尾。泛光保色，所以亮起來仍然是這一頁的藍白帶虹彩，
         而不是一片死白。
         上限：曝光最多加 55%，泛光加到 1.79，兩者都用同一條高斯線，所以
         起落速率一致，不會出現刺眼的階梯。 */
      /* 光是從畫面本身來的，不是貼上去的。但三條路徑都要有硬上限：調光
         師把滑桿推到底也不能做出頻閃或一片死白。
         門檻的地板是 1.95。這一頁的場域量到約 1.70，海面約 1.80——門檻
         一旦掉到它們底下，整片淡藍紫就進了泛光，出來是牛奶而不是光。
         要更亮就推 strength：它只放大本來就過門檻的東西。
         門檻用的是比光幕更快的那條釋放曲線，所以它會早一步回到基準。 */
      bloom.strength = Math.min(
        1.85,
        CONFIG.scene.bloom + flare * DZ.burst * .42 + burst * DZ.burst * .58
      );
      bloom.radius = .58 + burst * .22;
      bloom.threshold = Math.max(
        1.95,
        CONFIG.scene.bloomCut - flareAtk * flareCut * DZ.cut
      );
      /* 點火前兩格把曝光壓下去 20%。眼睛是比較出來的，不是量出來的：
         先暗一下，同一個峰值讀起來會亮一倍，而量到的亮度一格沒漲。
         純高斯，兩端都歸零，所以往回捲的時候它自己會走回來。 */
      const preDip = 1 - .20 * Math.exp(
        -Math.pow((progress - .395) / .040, 2)
      );
      renderer.toneMappingExposure = Math.min(
        CONFIG.scene.exposure * 1.34,
        CONFIG.scene.exposure * preDip * (1 + burst * DZ.exposure)
      );

      /* The film comes up UNDER the flare and finishes before it clears, so
         the eye never catches the swap; the copy then rides in on top. */
      const mediaReveal = smooth01((progress - DZ.handoff - .02) / .24);
      const settle = smooth01((progress - .60) / .40);
      writeStyle(sectionTwo, 'opacity', overlayAlpha.toFixed(4));
      writeVar(sectionTwo, '--s2-media', mediaReveal.toFixed(4));
      writeVar(sectionTwo, '--s2-scale', (1.075 - settle * .075).toFixed(4));
      sectionTwo.classList.toggle('is-active', overlayAlpha > .001);
      sectionTwo.classList.toggle('is-in', progress > .76);
      sectionTwo.classList.toggle('is-live', progress > .92);
      sectionTwo.setAttribute('aria-hidden', overlayAlpha > .5 ? 'false' : 'true');
      setSectionTwoPlayback(progress > .34);
      writeStyle(canvas, 'opacity', (1 - smooth01((progress - .60) / .14)).toFixed(4));
      document.body.classList.toggle(
        'is-transitioning',
        progress > .035 && progress < .96
      );
      document.body.classList.toggle('is-section-two', progress > .70);

      /* 硬上限 .72，而且是乘過 CONFIG 之後才夾。調光師把「光幕強度」推到
         2.0 也只能更快到頂，不能做出一格死白。峰值 .72 用 screen 疊在平
         均 0.62 的畫面上得到 0.894——留下的那 10% 餘裕，就是珠子剪影在
         最亮的那一格仍然讀得出來的原因。原本這裡算出 1.189，瀏覽器夾到
         1.0，等於整整 160 毫秒的進度是一張全螢幕的白紙。 */
      const flashAlpha = Math.min(
        .72,
        flareIgnition * flareFade * CONFIG.details.transitionFlash * DZ.veil
      );
      transitionFlash.style.opacity = flashAlpha.toFixed(4);
      /* 面紗是圓的、而且是從水珠原本掛著的地方朝四面推開的：光要跟著珠
         子的來向走。原本它壓成 .035 的扁橢圓，是為了貼著水面的濺起——
         那個動作已經不存在了。 */
      transitionFlash.style.transform =
        `scale(${(.14 + flareExpand * 1.55).toFixed(4)},`
        + `${(.12 + Math.pow(flareExpand, 1.25) * 1.48).toFixed(4)})`;
      /* 光源留在水珠原本掛著的位置，不要跟著珠子往前推。
         鉻不會發光，它只會轉述光。珠子自己亮起來的那一刻，這一頁的材質
         身分就死了。光站在它們背後，每一顆飛過去的珠子才會被逆光鑲上一
         圈邊——銀色的身體、燒開的虹彩邊緣、白色的核心。而且它在深度上
         真的在珠子後面，所以珠子會擋住它，剪影是真的。 */
      transitionGlow.position.set(
        CONFIG.drop.x,
        CONFIG.drop.y,
        CONFIG.drop.z
      );
      transitionScreen.copy(transitionGlow.position).project(camera);
      /* 走 writeVar 去重：光源位置現在是常數（只剩指標視差），同一個字串
         每幀重設兩次，等於每秒 120 次讓一張全螢幕 screen 疊層的樣式失效。 */
      writeVar(transitionFlash, '--flare-x',
        `${((transitionScreen.x * .5 + .5) * 100).toFixed(2)}%`);
      writeVar(transitionFlash, '--flare-y',
        `${((-transitionScreen.y * .5 + .5) * 100).toFixed(2)}%`);
      /* 1.30 個畫面高。sprite 的 scale 就是世界單位，而 d=17.12 處的畫面
         高是 2·17.12·tan15° = 9.175 單位，所以 11.93 才是「一盞光」；原本
         的 20.16 是 2.2 個畫面高，落差整個在畫面外，畫面裡只剩一塊均勻
         的加光。 */
      transitionGlow.scale.setScalar(.16 + flareExpand * 11.77);
      transitionGlow.material.opacity = THREE.MathUtils.clamp(
        flashAlpha * (1.24 + impactPulse * .34),
        0,
        1.02
      );

      const glowFade = (1 - dissolve) * (1 - overlayAlpha) * heroExtras * CONFIG.details.glow;
      glowTop.material.opacity = glowFade * (.38 + Math.sin(time * 1.18) * .035);
      glowFoot.material.opacity = glowFade * (.44 + Math.sin(time * .92 + 1.1) * .035);
      waterGlints.material.uniforms.uOpacity.value =
        CONFIG.details.waterGlints * (1 - overlayAlpha);
      orbHighlights.forEach((highlight, index) => {
        const sparkle = .78 + .22 * Math.sin(time * (1.6 + index * .38) + index * 2.1);
        highlight.material.opacity = CONFIG.details.highlight
          * [1, .84, .72, .62][index] * sparkle
          * (1 - dissolve) * (1 - overlayAlpha) * heroExtras;
      });
      dropOrbitGroup.scale.setScalar(1);
      dropOrbitGroup.rotation.y = time * CONFIG.details.orbitSpeed * .16
        + impactPulse * .10;
      dropOrbitGroup.rotation.z = Math.sin(
        time * CONFIG.details.orbitSpeed * .22
      ) * .055;
      orbitSatellites.forEach((satellite, index) => {
        const data = satellite.userData;
        const angle = data.phase + time * CONFIG.details.orbitSpeed * data.speed;
        const x = Math.cos(angle) * data.radius;
        const y = Math.sin(angle) * data.radius * data.flatten;
        const z = Math.sin(angle * 1.7 + index) * .32;
        const cosTilt = Math.cos(data.tilt);
        const sinTilt = Math.sin(data.tilt);
        satellite.position.set(
          x,
          y * cosTilt - z * sinTilt,
          y * sinTilt + z * cosTilt
        );
        satellite.scale.setScalar(
          data.size * CONFIG.details.sparkleSize * (1 + impactPulse * .24)
        );
        satellite.material.opacity = THREE.MathUtils.clamp(
          satellite.material.userData.baseOpacity
          * CONFIG.details.satelliteIntensity
          * (1 - dissolve)
          * (1 - overlayAlpha)
          * heroExtras
          * (.65 + .35 * Math.sin(time * (1.8 + data.speed) + data.phase)),
          0,
          1.5
        );
      });
      glowTop.position.set(
        dropX - .18 * CONFIG.drop.scale,
        dropY + currentDropRadius() * .72,
        CONFIG.drop.z + 1.04
      );
      glowFoot.position.set(
        dropX + .06 * CONFIG.drop.scale,
        dropY - currentDropRadius() * .78,
        CONFIG.drop.z + 1.00
      );

      /* 水珠不再落水，所以沒有濺起。但海面也不能就這樣把英雄的遮蔽「關
         掉」——那會看起來像 bug。真正發生的事是：壓在水面上的那團質量放
         手了，於是海面回彈，送出一圈很輕的漣漪。時機對在斷裂那一刻。 */
      /* 但不能用 splashAt()：它把環推進即時的漣漪陣列，由 updateRipples(dt)
         用真正的時間積分，往下捲過 .12 再立刻往上捲，那圈環會在一片沒事
         的水面上繼續擴散——那就是壞掉的往回捲。這裡改成把保留的最後一
         格每幀整格重寫，年齡是 progress 的閉式函數，所以它跟其他所有東西
         一樣會倒著走。
         年齡用鏡頭時間而不是 progress：progress 對時間是 1-e^(-t/0.4994)，
         用它當年齡，環的速度會在頭 250 毫秒衝出去然後越走越慢。 */
      const ringT = Math.max(0, shotTime(progress) - shotTime(.12));
      const ringLive = progress > .12 && progress < .78;
      const ringSlot = rippleSlots[RIPPLE_SLOTS - 1];
      if (ringLive) {
        ringSlot.set(CONFIG.drop.x, CONFIG.drop.z, ringT, CONFIG.ripple.click * .50);
        uRippleLive.value = 1;
      } else if (ringSlot.w > 0) {
        ringSlot.set(0, 0, 999, 0);
      }

      const rippleAge = ringT * 1.15;
      const rippleFade = progress >= .12 ? 1 - smooth01((progress - .52) / .22) : 0;
      if (rippleFade > .01) {
        applyWaterRipple(rippleAge, rippleFade, 1, 1 + impactPulse * .78, overlayAlpha);
      } else {
        applyWaterRipple(
          entry.rippleAge,
          entry.rippleFade,
          entry.rippleAmount,
          entry.rippleAmount,
          overlayAlpha
        );
      }

      /* Impact energy leaks into the frame: ambient specks get a kick, and
         the camera takes a tiny vertical knock.
         泛光不在這裡設。上面一百多行已經把它交給光芒的包絡了，這一行會在
         同一個函數裡把它蓋掉——峰值從 1.79 被壓回 0.83，等於整段爆光只
         剩四成七的力道。這就是「光芒讀不出來」的頭號原因。 */
      impactKick = impactPulse * .05;
      airMotes.material.uniforms.uTransition.value = impactPulse * .12;
      airMotes.material.uniforms.uOpacity.value = .30 * (1 - overlayAlpha);
      sceneDim = 1 - overlayAlpha;
    }

    /* ------------------------------------------------------------------
       LIVE TUNING
       ------------------------------------------------------------------ */
    function applyConfig() {
      riverRoot.position.set(CONFIG.water.x, CONFIG.water.y, CONFIG.water.z);
      riverRoot.rotation.set(CONFIG.water.rx, CONFIG.water.ry, CONFIG.water.rz);
      riverRoot.scale.set(CONFIG.water.sx, CONFIG.water.sy, CONFIG.water.sz);
      riverUniforms.uOpacity.value = CONFIG.water.opacity;
      riverUniforms.uWaveHeight.value = CONFIG.water.waveHeight;
      riverUniforms.uWaveSpeed.value = CONFIG.water.waveSpeed;
      water.position.set(CONFIG.water.x, CONFIG.water.y - .045, CONFIG.water.z);
      waterVeil.position.set(CONFIG.water.x, CONFIG.water.y - .025, CONFIG.water.z);
      water.material.uniforms.alpha.value = Math.min(.94, CONFIG.water.opacity + .28);

      dropRoot.position.set(CONFIG.drop.x, CONFIG.drop.y, CONFIG.drop.z);
      dropRoot.rotation.set(CONFIG.drop.rx, CONFIG.drop.ry, CONFIG.drop.rz);
      dropRoot.scale.setScalar(CONFIG.drop.scale);
      dropShapeUniforms.uRoundness.value = CONFIG.drop.roundness;
      dropShapeUniforms.uTouchRadius.value = CONFIG.physics.touchRadius;
      dropShapeUniforms.uWaveMorph.value = CONFIG.distortion.waveMorph;
      dropShapeUniforms.uDistortion.value = CONFIG.distortion.amount;
      dropShapeUniforms.uWaveAmplitude.value = CONFIG.distortion.waveAmplitude;
      dropShapeUniforms.uWaveFrequency.value = CONFIG.distortion.waveFrequency;
      dropShapeUniforms.uWaveSpeed.value = CONFIG.distortion.waveSpeed;
      dropShapeUniforms.uTwist.value = CONFIG.distortion.twist;
      dropShapeUniforms.uTwistFrequency.value = CONFIG.distortion.twistFrequency;
      dropShapeUniforms.uBreathing.value = CONFIG.distortion.breathing;
      dropMotes.material.uniforms.uOpacity.value = CONFIG.details.motes;
      dropMotes.material.uniforms.uSize.value = CONFIG.details.moteSize;
      dropMotes.material.uniforms.uSpeed.value = CONFIG.details.moteSpeed;
      waterGlints.material.uniforms.uOpacity.value = CONFIG.details.waterGlints;
      waterGlints.material.uniforms.uSize.value = CONFIG.details.glintSize;
      waterGlints.material.uniforms.uSpeed.value = CONFIG.details.moteSpeed * .72;
      waterGlints.position.y = CONFIG.water.y;
      dropMaterial.roughness = CONFIG.drop.roughness;
      dropMaterial.thickness = CONFIG.drop.thickness;
      dropMaterial.transmission = CONFIG.drop.transmission;
      /* The gather's beads are the same glass as the orb they become. */
      clusterMaterial.roughness = CONFIG.drop.roughness;
      clusterMaterial.thickness = CONFIG.drop.thickness;
      clusterMaterial.transmission = CONFIG.drop.transmission;
      /* The droplet wears the same glass. The glass reaches the screen with
         weight (1-MATCH)*(1-INK) in the older look and MATCH*CLARITY in the
         water; when both are 0 the refraction, and the extra opaque render of
         the scene (and of the mirror) it costs every frame, is switched off.
         Otherwise transmission never reaches 0. */
      dropletMaterial.roughness = CONFIG.drop.roughness;
      {
        const D = CONFIG.droplet;
        const m = THREE.MathUtils.clamp(D.match, 0, 1);
        const glassShows = (1 - m) * (1 - THREE.MathUtils.clamp(D.ink, 0, 1)) > .001
          || m * THREE.MathUtils.clamp(D.clarity, 0, 1) > .001;
        dropletMaterial.transmission = glassShows ? Math.max(.001, CONFIG.drop.transmission) : 0;
        dropletUniforms.uClarity.value = THREE.MathUtils.clamp(D.clarity, 0, 1);

        };

      for (const [label, groupKey, key, min, max, step] of items) {

        row.className = 'tune-row';
        if (key === 'waveMorph') row.classList.add('is-morph');
        const caption = document.createElement('label');
        caption.textContent = label;
        const input = document.createElement('input');
        input.type = 'range';
        input.min = min;
        input.max = max;
        input.step = step;
        input.value = CONFIG[groupKey][key];
        input.setAttribute('aria-label', `${title} ${label}`);
        const value = document.createElement('span');
        value.className = 'tune-value';
        const digits = step < .001 ? 4 : step < .01 ? 3 : 2;
        const refresh = () => { value.textContent = Number(CONFIG[groupKey][key]).toFixed(digits); };
        input.addEventListener('input', () => {
          CONFIG[groupKey][key] = Number(input.value);
          if (key === 'waveMorph') CONFIG.drop.roundness = 1;
          refresh();
          applyConfig();
          if (groupKey === 'gather' && key === 'intro') {
            /* Turned on, the gather plays again from scattered beads; turned
               off, a gather that is running is cut short to the whole drop. */
            if (CONFIG.gather.intro > 0) {
              if (!reduceMotion && !entry.running && dropTransition.target === 0) {
                entry.done = false;
                beginEntry();
              }
            } else if (entry.running) {
              skipEntry();
              collapseGather();
            }
          }
          if (groupKey === 'physics' && ['enabled', 'startY', 'waterY'].includes(key)) {
            resetDropSimulation(false);
          }
        });
        refresh();
        row.append(caption, input, value);
        group.appendChild(row);
        sliderRefs.push({ input, value, groupKey, key, digits });
      }
      tunerBody.appendChild(group);

      Object.assign(CONFIG.droplet, {
        ink: 1, sheen: 1, contrast: 7, match: 1, water: 1, body: DEFAULT_CONFIG.droplet.body,
        clarity: DEFAULT_CONFIG.droplet.clarity,
        bodyColor: DEFAULT_CONFIG.droplet.bodyColor, glowColor: DEFAULT_CONFIG.droplet.glowColor, sheenColor: DEFAULT_CONFIG.droplet.sheenColor
      });
      syncTunerValues();
      applyConfig();
    });
    const clearGlassButton = document.createElement('button');
    clearGlassButton.type = 'button';
    clearGlassButton.textContent = '透明玻璃';
    clearGlassButton.addEventListener('click', () => {
      Object.assign(CONFIG.droplet, { ink: 0, sheen: .4, match: 0 });
      syncTunerValues();
      applyConfig();
    });
    const backButton = document.createElement('button');
    backButton.type = 'button';
    backButton.textContent = '回第一段';
    backButton.addEventListener('click', () => {
      closeSectionTwo(false);
    });
    const resetButton = document.createElement('button');
    resetButton.type = 'button';
    resetButton.textContent = '重設';
    resetButton.addEventListener('click', () => {
      for (const key of Object.keys(DEFAULT_CONFIG)) Object.assign(CONFIG[key], DEFAULT_CONFIG[key]);
      syncTunerValues();
      applyConfig();
      resetDropSimulation(false);
      closeSectionTwo(true);
    });
    const copyButton = document.createElement('button');
    copyButton.type = 'button';
    copyButton.textContent = '複製設定';
    copyButton.addEventListener('click', async () => {
      const json = JSON.stringify(CONFIG, null, 2);
      try {
        await navigator.clipboard.writeText(json);
        copyButton.textContent = '已複製';
      } catch {
        console.info('INDEX 04 CONFIG', json);
        copyButton.textContent = '見主控台';
      }
      setTimeout(() => { copyButton.textContent = '複製設定'; }, 1200);
    });
    actions.append(
      dropNowButton,
      pureSphereButton,
      originalDropButton,
      codropsLookButton,
      waterLookButton,
      clearGlassButton,
      backButton,
      resetButton,
      copyButton
    );
    tunerBody.appendChild(actions);

    /* The panel is a workshop tool, not part of the picture: it opens only
       when someone asks for it. */
    tuner.classList.add('is-folded');
    tunerToggle.textContent = '+';
    tunerToggle.setAttribute('aria-label', 'Expand controls');
    tunerToggle.addEventListener('click', () => {
      const folded = tuner.classList.toggle('is-folded');
      tunerToggle.textContent = folded ? '+' : '−';
      tunerToggle.setAttribute('aria-label', folded ? 'Expand controls' : 'Collapse controls');
    });
    applyConfig();
    resetDropSimulation(false);
    window.index4 = {
      CONFIG,
      applyConfig,
      openSectionTwo,
      closeSectionTwo,
      resetDropSimulation,
      riverRoot,
      dropRoot,
      riverMaterial,
      dropMaterial,
      /* Exposed so a headless/hidden tab can drive and read single frames
         while tuning; the live page never calls these. */
      renderer,
      composer,
      scene,
      camera,
      entry,
      beginEntry,
      skipEntry,
      step: delta => frame(true, delta)
    };

    /* ------------------------------------------------------------------
       MOTION
       ------------------------------------------------------------------ */
    const clock = new THREE.Clock();
    const pointer = new THREE.Vector2();
    const pointerSoft = new THREE.Vector2();
    const rayPointer = new THREE.Vector2();
    const raycaster = new THREE.Raycaster();
    /* The orb mesh and cluster moved to layer 1 for the droplet; the pointer
       still tests them. */
    raycaster.layers.enable(1);
    const touchLocalPoint = new THREE.Vector3();
    /* The pointer is read against mathematical planes rather than scene
       meshes: the lake surface for ripples, and the vertical plane the bead
       hovers in for dragging. One intersection each, cheap enough to run
       every frame while the mesh raycast stays reserved for the bead. */
    const waterPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const dropPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const waterHit = new THREE.Vector3();
    const dropHit = new THREE.Vector3();
    const lastWaterHit = new THREE.Vector3();
    let hasWaterTrail = false;
    let rippleTravel = 0;
    let restingRippleTimer = 0;
    let pointerOnCanvas = false;
    let wheelAccumulator = 0;
    let wheelResetTimer = 0;
    let firstFrame = true;

    addEventListener('pointermove', event => {
      const nextX = (event.clientX / innerWidth - .5) * 2;
      const nextY = (event.clientY / innerHeight - .5) * 2;
      dropTouch.pointerVelocity.x += (nextX - pointer.x) * .82;
      dropTouch.pointerVelocity.y += (nextY - pointer.y) * .82;
      pointer.set(nextX, nextY);
      pointerOnCanvas = event.target === canvas;
      dropletTrail.pointerType = event.pointerType;
    }, { passive: true });
    canvas.addEventListener('pointerleave', () => {
      pointerOnCanvas = false;
      if (!dropTouch.grabbed) dropTouch.hovered = false;
    }, { passive: true });

    function pointerToWater(target) {
      waterPlane.constant = -CONFIG.physics.waterY;
      rayPointer.set(pointer.x, -pointer.y);
      raycaster.setFromCamera(rayPointer, camera);
      if (!raycaster.ray.intersectPlane(waterPlane, target)) return false;
      /* Past the range gate the plane is only ever behind the mountains, so
         a ring spawned there would be occluded anyway. */
      return target.distanceTo(camera.position) < 60;
    }

    function pointerToDropPlane(target) {
      dropPlane.constant = -CONFIG.drop.z;
      rayPointer.set(pointer.x, -pointer.y);
      raycaster.setFromCamera(rayPointer, camera);
      return Boolean(raycaster.ray.intersectPlane(dropPlane, target));
    }

    /* The demo's trail, on the drop's drag plane. It shifts at a fixed 60 Hz
       rather than once a frame, so the tail is the same length on any
       display, and it lives only while the pointer could touch the drop. */
    const _trailHit = new THREE.Vector3();
    function updateDropletTrail(dt) {
      const T = dropletTrail;
      const live = dropSDF
        && assetsReady
        && !reduceMotion
        && !entry.running
        && dropRoot.visible
        && dropTransition.progress < .035
        && (pointerOnCanvas || dropTouch.grabbed)
        && (T.pointerType !== 'touch' || T.touchDown || dropTouch.grabbed)
        && pointerToDropPlane(_trailHit);
      if (live) {
        if (!T.primed) {
          for (const point of T.points) point.copy(_trailHit);
          T.prev.copy(_trailHit);
          T.acc = 0;
          T.primed = true;
        }
        T.acc += dt;
        let ticks = 0;
        while (T.acc >= 1 / 60 && ticks < 4) {
          T.acc -= 1 / 60;
          ticks++;
        }
        if (ticks >= 4) T.acc = 0;
        for (let tick = 1; tick <= ticks; tick++) {
          for (let i = T.points.length - 1; i > 0; i--)T.points[i].copy(T.points[i - 1]);
          T.points[0].lerpVectors(T.prev, _trailHit, tick / ticks);
        }
        T.points[0].copy(_trailHit);
        T.prev.copy(_trailHit);
      } else if (T.amount < .005) {
        T.primed = false;
      }
      const target = live ? 1 : 0;
      T.amount += (target - T.amount) * (1 - Math.exp(-dt * (target > T.amount ? 10 : 4)));
    }

    /* Only what is drawn in the orb's group can be touched. A raycast walks
       into children whatever their parents' flags say, so filtering hits by
       each object's own flag let the hidden sparkle sprites catch the pointer
       in empty air. traverseVisible stops at a hidden parent, and a hidden
       orb or light is then not tested at all. */
    const _dropTargets = [];
    function raycastDrop() {
      _dropTargets.length = 0;
      dropRoot.traverseVisible(object => {
        if (object !== dropRoot) _dropTargets.push(object);
      });
      return raycaster.intersectObjects(_dropTargets, false)[0] || null;
    }

    function pointerHitsDrop() {
      if (!dropRoot.visible) return false;
      rayPointer.set(pointer.x, -pointer.y);
      raycaster.setFromCamera(rayPointer, camera);
      return Boolean(raycastDrop())
        || rayHitsCluster(raycaster.ray, _clusterTouch)
        || rayHitsDropletSphere(raycaster.ray, _clusterTouch);
    }

    function releaseDropGrab() {
      if (!dropTouch.grabbed) return;
      dropTouch.grabbed = false;
      dropTouch.pointerId = -1;
      dropTouch.target.set(0, 0);
      /* Letting go leaves the spring loaded: the bead snaps back and rings
         on its own, carrying whatever speed the throw gave it. */
      dropTouch.wobble = Math.min(
        1,
        dropTouch.wobble + dropTouch.offset.length() * .30
      );
      document.body.classList.remove('is-drop-grabbed');
    }

    /* A press either takes hold of the bead or strikes the water. The
       pointer is captured for a grab so a throw that leaves the canvas — or
       a touch that slides off it — still lands. */
    addEventListener('pointerdown', event => {
      /* Only the canvas: the tuner panel and the section-two overlay sit
         above it and must keep their own presses. */
      if (event.target !== canvas) return;
      /* Touch sends no move before the press: the trail starts here. */
      if (event.pointerType === 'touch') {
        dropletTrail.pointerType = 'touch';
        dropletTrail.touchDown = true;
        dropletTrail.primed = false;
      }
      if (!assetsReady || reduceMotion || entry.running) return;
      if (dropTransition.progress > .05) return;

      pointer.set(
        (event.clientX / innerWidth - .5) * 2,
        (event.clientY / innerHeight - .5) * 2
      );
      pointerOnCanvas = true;

      /* Re-cast rather than trusting the hover flag: on touch there is no
         pointermove before the press, so the flag would still be stale. */
      if (dropState.phase === 'idle' && pointerHitsDrop()) {
        dropTouch.grabbed = true;
        dropTouch.hovered = true;
        dropTouch.pointerId = event.pointerId;
        dropTouch.anchor.set(0, 0);
        if (pointerToDropPlane(dropHit)) {
          dropTouch.anchor.set(
            dropHit.x - CONFIG.drop.x - dropTouch.offset.x,
            dropHit.y - CONFIG.drop.y - dropTouch.offset.y
          );
        }
        dropTouch.wobble = Math.min(1, dropTouch.wobble + .42);
        document.body.classList.add('is-drop-grabbed');
        if (canvas.setPointerCapture) {
          try { canvas.setPointerCapture(event.pointerId); } catch (error) { }
        }
        return;
      }

      if (pointerToWater(waterHit)) splashAt(waterHit.x, waterHit.z, 1);
    }, { passive: true });

    addEventListener('pointerup', releaseDropGrab, { passive: true });
    addEventListener('pointercancel', releaseDropGrab, { passive: true });
    for (const type of ['pointerup', 'pointercancel']) {
      addEventListener(type, event => {
        if (event.pointerType === 'touch') dropletTrail.touchDown = false;
      }, { passive: true });
    }

    /* Rings shed by dragging across the lake. Spacing is measured in world
       units, so the same gesture near the horizon sheds fewer rings than in
       the foreground: the wake stays even on the water, not on the screen. */
    function updateWaterTouch(dt) {
      const live = assetsReady
        && !reduceMotion
        && pointerOnCanvas
        && !entry.running
        && dropTransition.progress < .05;
      if (
        !live ||
        dropTouch.hovered ||
        dropTouch.grabbed ||
        !pointerToWater(waterHit)
      ) {
        hasWaterTrail = false;
        rippleTravel = 0;
        restingRippleTimer = 0;
        return;
      }
      if (hasWaterTrail) {
        const dx = waterHit.x - lastWaterHit.x;
        const dz = waterHit.z - lastWaterHit.z;
        const moved = Math.hypot(dx, dz);
        /* Closer together and weaker than a strike: many faint rings
           overlapping read as a wake, where a few strong ones read as a
           stamped trail. */
        const spacing = .52;
        rippleTravel = Math.min(rippleTravel + moved, spacing * 4);
        const emits = Math.floor(rippleTravel / spacing);
        if (emits > 0) {
          const speed = moved / Math.max(dt, 1e-4);
          const force = THREE.MathUtils.clamp(.13 + speed * .030, .13, .62)
            * CONFIG.ripple.trail;
          for (let i = 0; i < emits; i++) {
            rippleTravel -= spacing;
            const along = (i + 1) / (emits + 1);
            spawnRipple(
              lastWaterHit.x + dx * along,
              lastWaterHit.z + dz * along,
              force
            );
          }
          restingRippleTimer = 0;
        } else {
          /* A pointer held still keeps disturbing the surface, the way a
             fingertip resting on a pool goes on shedding rings. */
          restingRippleTimer += dt;
          if (restingRippleTimer > 1.05) {
            restingRippleTimer = 0;
            spawnRipple(waterHit.x, waterHit.z, .12 * CONFIG.ripple.trail);
          }
        }
      }
      lastWaterHit.copy(waterHit);
      hasWaterTrail = true;
    }

    addEventListener('wheel', event => {
      if (
        tuner.contains(event.target) ||
        !assetsReady ||
        entry.running
      ) return;

      wheelAccumulator += THREE.MathUtils.clamp(event.deltaY, -140, 140);
      clearTimeout(wheelResetTimer);
      wheelResetTimer = setTimeout(() => { wheelAccumulator = 0; }, 520);
      if (wheelAccumulator >= CONFIG.transition.scrollThreshold) {
        wheelAccumulator = 0;
        openSectionTwo();
      } else if (wheelAccumulator <= -CONFIG.transition.scrollThreshold) {
        wheelAccumulator = 0;
        closeSectionTwo(false);
      }
    }, { passive: true });

    function updateDropTouch(dt, time) {
      let hit = null;
      if (
        assetsReady &&
        dropRoot.visible &&
        pointerOnCanvas &&
        dropState.phase === 'idle' &&
        dropTransition.progress < .035 &&
        !entry.running &&
        !reduceMotion
      ) {
        rayPointer.set(pointer.x, -pointer.y);
        raycaster.setFromCamera(rayPointer, camera);
        hit = raycastDrop();
        /* While the loop has the drop the orb is hidden: the beads answer. */
        if (!hit && (
          rayHitsCluster(raycaster.ray, _clusterTouch)
          || rayHitsDropletSphere(raycaster.ray, _clusterTouch)
        )) {
          hit = { point: _clusterTouch, object: dropRoot };
        }
      }

      dropTouch.hovered = dropTouch.grabbed || Boolean(hit);
      document.body.classList.toggle('is-drop-hovered', dropTouch.hovered);

      if (hit) {
        touchLocalPoint.copy(hit.point);
        hit.object.worldToLocal(touchLocalPoint);
        if (touchLocalPoint.lengthSq() > .0001) {
          dropTouch.direction.copy(touchLocalPoint).normalize();
        }
      }

      const targetStrength = dropTouch.hovered ? 1 : 0;
      dropTouch.strength += (
        targetStrength - dropTouch.strength
      ) * (1 - Math.exp(-dt * (dropTouch.hovered ? 13 : 5.2)));
      dropShapeUniforms.uTouchDirection.value.lerp(
        dropTouch.direction,
        1 - Math.exp(-dt * 18)
      ).normalize();
      dropShapeUniforms.uTouchStrength.value =
        dropTouch.strength * CONFIG.physics.touchForce;
      dropShapeUniforms.uTouchRadius.value = CONFIG.physics.touchRadius;
      dropShapeUniforms.uTouchTime.value = time;

      /* ---------------------------------------------------------------
         The bead as a mass on a spring. Brushing it shoves it, holding it
         drags it, letting go throws it: one integrator covers all three and
         only the stiffness changes. Whatever speed is left over feeds the
         membrane wobble in the vertex shader, so the surface goes on
         ringing for as long as the motion lasts. */
      const canPush = assetsReady
        && !reduceMotion
        && dropState.phase === 'idle'
        && dropTransition.progress < .05
        && !entry.running;

      if (dropTouch.grabbed && pointerToDropPlane(dropHit)) {
        dropTouch.target.set(
          dropHit.x - CONFIG.drop.x - dropTouch.anchor.x,
          dropHit.y - CONFIG.drop.y - dropTouch.anchor.y
        );
        const reach = dropTouch.target.length();
        if (reach > 2.3) dropTouch.target.multiplyScalar(2.3 / reach);
      } else {
        dropTouch.target.set(0, 0);
      }

      if (canPush && dropTouch.hovered && !dropTouch.grabbed) {
        dropTouch.velocity.x += dropTouch.pointerVelocity.x
          * CONFIG.physics.touchForce * 18 * dt;
        dropTouch.velocity.y -= dropTouch.pointerVelocity.y
          * CONFIG.physics.touchForce * 18 * dt;
      }

      const stiffness = CONFIG.physics.touchSpring * (dropTouch.grabbed ? 3.6 : 1);
      const drag = CONFIG.physics.touchDamping * (dropTouch.grabbed ? 1.7 : 1);
      dropTouch.velocity.x += (
        -(dropTouch.offset.x - dropTouch.target.x) * stiffness
        - dropTouch.velocity.x * drag
      ) * dt;
      dropTouch.velocity.y += (
        -(dropTouch.offset.y - dropTouch.target.y) * stiffness
        - dropTouch.velocity.y * drag
      ) * dt;
      if (!canPush) dropTouch.velocity.multiplyScalar(Math.exp(-dt * 6));
      dropTouch.offset.addScaledVector(dropTouch.velocity, dt);
      const stray = dropTouch.offset.length();
      if (stray > 2.6) dropTouch.offset.multiplyScalar(2.6 / stray);
      if (!canPush && stray < .002) {
        dropTouch.offset.set(0, 0);
        dropTouch.velocity.set(0, 0);
      }

      const shove = dropTouch.velocity.length();
      dropTouch.wobble = Math.max(
        dropTouch.wobble * Math.exp(-dt * 2.6),
        Math.min(1, shove * .42)
      );
      dropShapeUniforms.uTouchWobble.value =
        dropTouch.wobble * CONFIG.physics.touchWobble;

      /* Pushed far enough down the bead reaches the lake. It strikes once
         on the way in and then keeps shedding rings for as long as it is
         held under, which is what sells the two as the same substance. */
      const bottom = CONFIG.drop.y + dropTouch.offset.y - currentDropRadius();
      if (canPush && bottom < CONFIG.physics.waterY) {
        const centreX = CONFIG.drop.x + dropTouch.offset.x;
        if (!dropTouch.submerged) {
          dropTouch.submerged = true;
          dropTouch.dipTimer = .14;
          splashAt(centreX, CONFIG.drop.z, .9);
        }
        dropTouch.dipTimer -= dt;
        if (dropTouch.dipTimer <= 0) {
          dropTouch.dipTimer = .10;
          spawnRipple(
            centreX,
            CONFIG.drop.z,
            THREE.MathUtils.clamp(
              (CONFIG.physics.waterY - bottom) * .70 + .20,
              .20,
              1.0
            ) * CONFIG.ripple.trail
          );
        }
      } else {
        dropTouch.submerged = false;
      }

      dropTouch.pointerVelocity.multiplyScalar(Math.exp(-dt * 13));
    }

    /* Scene time is accumulated from clamped deltas rather than read off the
       clock, so a caller can hand in a fixed step and replay the timeline
       deterministically. */
    let sceneTime = 0;
    function frame(manual, fixedDelta) {
      const realDelta = clock.getDelta();
      const dt = Math.min(fixedDelta === undefined ? realDelta : fixedDelta, .04);
      sceneTime += dt;
      const time = sceneTime;
      const motion = reduceMotion ? 0 : 1;
      /* Freeze the parallax input while the drop transition runs: the camera
         holds perfectly still, so the falling sphere traces a vertical line. */
      const transitionActive = dropTransition.target > 0 || dropTransition.progress > .001;
      if (!transitionActive) pointerSoft.lerp(pointer, 1 - Math.exp(-dt * 2.4));

      /* The sea keeps its own clock, so TIME SCALE changes the pace and not
         the place, and the drop's shadow of occlusion follows the bead. */
      grainPass.uniforms.uTime.value = time;
      seaUniforms.uSeaTime.value = time * CONFIG.sea.timeScale * motion;
      /* 水珠碎掉之後它的 visible 就關了，但位置每一幀還是照寫，所以海面
         會繼續倒映、繼續遮蔽一顆已經不存在的球——整段飛行途中水面上都
         掛著一塊暗斑和一顆鏡像。這條斜坡把它們跟著碎裂一起收掉。 */
      const heroGone = smooth01((dropTransition.progress - .07) / .23);
      seaUniforms.uDropXZ.value.set(dropRoot.position.x, dropRoot.position.z);
      seaUniforms.uDropRad.value = currentDropRadius() * (1 - heroGone * .92);
      seaUniforms.uDropOcclude.value = CONFIG.chrome.occlude * (1 - heroGone);
      /* 扇形網格原本繞著世界原點建，而相機站在原點後方十個單位，所以網格最近
         的邊緣落在十四單位外，畫面下緣卻切在七單位處 —— 底下那一片「海」其實
         是背景球從破洞露出來的。把扇形移到相機底下，海才真的是海。浪的相位是
         用世界座標算的，所以移動網格不會讓浪跟著滑。 */
      sea.position.set(camera.position.x, 0, camera.position.z);
      sea.updateMatrixWorld();
      /* 水珠進了海面反射的房間；貼到水面時關掉，免得它倒映自己。 */
      seaUniforms.uEnvHero.value.set(
        dropRoot.position.x, dropRoot.position.y, dropRoot.position.z,
        currentDropRadius() * (1 - heroGone)
      );
      seaUniforms.uHeroOn.value =
        THREE.MathUtils.clamp(dropRoot.position.y / .6, 0, 1) * (1 - heroGone);
      /* Which way the bead is travelling: its reflected bands stretch along
         it and settle back to screen right when it rests. */
      dropletUniforms.uDropFlow.value.set(
        .35 + dropTouch.velocity.x * .6,
        -dropTouch.velocity.y * .6
      );
      /* Thrown, the mirror draws out into filaments along the travel and snaps
         back as it settles: one uniform, and the motion is in the material. */
      const sp = Math.min(dropTouch.velocity.length() * .9, .54);
      dropChromeUniforms.uChromeSpec.value.set(
        .006, CONFIG.drop.aniso + sp, .30 + sp * .5, CONFIG.drop.streak
      );
      water.material.uniforms.time.value += dt * .22 * motion;
      waterVeilMaterial.uniforms.uTime.value = time * motion;
      uRippleTime.value = time * motion;
      riverUniforms.uTime.value = time * motion;
      waterNormal.offset.x = (time * .012 * motion) % 1;
      waterNormal.offset.y = (time * .006 * motion) % 1;

      airMotes.material.uniforms.uTime.value = time * motion;

      orbGroup.position.y = 4.22 + Math.sin(time * .46) * .022 * motion;
      orb.rotation.y += dt * .035 * motion;
      rim.rotation.y -= dt * .018 * motion;
      refractedDuneMaterial.uniforms.uTime.value = time;
      updateDropTouch(dt, time);
      updateDropletTrail(dt);
      updateWaterTouch(dt);
      updateRipples(dt);
      updatePointerSpray(dt);
      if (assetsReady) {
        updateDropTransition(dt, time);
      } else {
        dropRoot.position.set(CONFIG.drop.x, CONFIG.drop.y, CONFIG.drop.z);
        syncDroplet(dt, time);
      }

      const camX = CONFIG.camera.x + pointerSoft.x * .18 * motion;
      const camY = CONFIG.camera.y - pointerSoft.y * .07 * motion;
      /* The impact knock is a display-only offset: undo last frame's kick
         before easing so it never accumulates into the camera state. */
      camera.position.y += appliedKick;
      camera.position.x += (camX - camera.position.x) * Math.min(1, dt * 1.8);
      camera.position.y += (camY - camera.position.y) * Math.min(1, dt * 1.8);
      camera.position.z += (CONFIG.camera.z - camera.position.z) * Math.min(1, dt * 1.8);
      appliedKick = impactKick * motion;
      camera.position.y -= appliedKick;
      camera.lookAt(
        cameraLook.x + pointerSoft.x * .08 * motion,
        cameraLook.y - pointerSoft.y * .04 * motion,
        cameraLook.z
      );
      /* The droplet's highlights are laid out in this camera's axes. */
      if (dropSDF) {
        camera.updateMatrixWorld();
        dropletUniforms.uNoiseView.value.setFromMatrix4(camera.matrixWorldInverse);
      }

      /* Once the film covers the frame the 3D pass is invisible: hand the
         GPU to the video instead of compositing a hidden canvas. */
      if (!(dropTransition.progress > .94 && dropTransition.target > 0)) {
        renderFrame++;
        composer.render();
      }
      if (firstFrame && assetsReady) {
        firstFrame = false;
        requestAnimationFrame(() => {
          document.body.classList.add('is-ready');
          loader.classList.add('is-done');
          /* The hero surfaces as the loader clears; with reduced motion, or
             with INTRO off, it is simply already there, whole. */
          if (reduceMotion || !(CONFIG.gather.intro > 0)) skipEntry();
          else beginEntry();
          if (!reduceMotion && !(CONFIG.gather.intro > 0)) {
            /* 1.15 s is the loader's fade. */
            gatherState.resumeAfter = gatherState.time + 1.15 + CONFIG.gather.hold;
          }
        });
      }
      /* Wrapped, not passed directly: rAF hands its callback a timestamp,
         which would arrive here as `manual` and stop the loop. */
      if (!manual) requestAnimationFrame(() => frame());
    }
