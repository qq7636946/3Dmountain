<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dceaf1">
  <title>恒灝創新 Finnovation — 科技賦能，金融加值</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&family=Noto+Sans+TC:wght@200;300;400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #2f5f8a;
      --ink-dim: rgba(47, 95, 138, .48);
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden
    }

    body {
      background:
        linear-gradient(180deg, #c9dfe9 0%, #e9eef1 48%, #f6e9e6 61%, #b7dce9 100%);
      color: var(--ink);
      /* 西文走 Jost，中文走 Noto Sans TC。順序就是分工：瀏覽器拿不到的字
     才往後找，所以拉丁字母一定是 Jost，漢字一定是 Noto Sans TC。 */
      font-family: "Jost", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    #gl {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      touch-action: none;
      cursor: default;
    }

    body.is-drop-hovered #gl {
      cursor: grab
    }

    body.is-drop-grabbed #gl {
      cursor: grabbing
    }

    .wash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(68% 38% at 50% 54%, rgba(255, 233, 226, .10), transparent 58%),
        radial-gradient(120% 90% at 50% 44%, transparent 58%, rgba(74, 111, 133, .16) 100%);
      mix-blend-mode: soft-light;
    }

    .grain {
      position: fixed;
      inset: -60%;
      pointer-events: none;
      z-index: 3;
      opacity: .04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
      animation: grain .24s steps(2) infinite;
    }

    @keyframes grain {
      0% {
        transform: translate3d(-2%, -1%, 0)
      }

      25% {
        transform: translate3d(1%, 2%, 0)
      }

      50% {
        transform: translate3d(2%, -2%, 0)
      }

      75% {
        transform: translate3d(-1%, 1%, 0)
      }

      100% {
        transform: translate3d(0, 0, 0)
      }
    }

    .chrome {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.8s var(--ease) .5s;
    }

    body.is-ready .chrome {
      opacity: 1
    }

    .brand,
    .study {
      position: absolute;
      top: clamp(20px, 2.4vw, 38px);
      font-size: .62rem;
      letter-spacing: .34em;
      line-height: 1;
      color: var(--ink-dim);
      text-transform: uppercase;
    }

    .brand {
      left: clamp(20px, 3.2vw, 54px);
      font-weight: 400
    }

    .brand, .study { transition: color .8s ease; }
    body.is-watershed .brand, body.is-watershed .study { color: rgba(204,229,255,.70); }

    .study {
      right: clamp(20px, 3.2vw, 54px);
      letter-spacing: .24em
    }

    .hair {
      position: absolute;
      left: 50%;
      bottom: clamp(18px, 2.6vw, 34px);
      width: 38px;
      height: 1px;
      transform: translateX(-50%);
      background: rgba(47, 95, 138, .28);
    }

    /* ------------------------------------------------------------------
   主標：水珠從字後面浮出來。
   字級用 vw 而不是 rem，因為這一行的重點是「橫跨整個畫面」——它必須在
   任何寬度下都幾乎碰到左右邊，字距才撐得開。水珠中心在畫面 43% 高，字
   壓在 50%，於是球體剛好從字腰穿過去，這是參考圖的關係。
   ------------------------------------------------------------------ */
    .hero {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      padding: 0 clamp(16px, 3vw, 48px);
    }

    .hero-title {
      font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      /* 這個係數是量出來的，不是挑出來的：這一行在 Jost、字距 .012em 下
         的寬度剛好是字級的 13.7 倍，所以 6.4vw 讓整行佔滿視窗寬度的
         88%——參考圖裡它幾乎碰到左右兩邊，那正是這個排版的氣勢來源。
         字重或字距一改，這個係數就要重新量一次。 */
      font-size: clamp(1.9rem, 5.2vw, 8.4rem);
      line-height: .96;
      letter-spacing: .012em;
      color: #fff;
      white-space: nowrap;
      /* 白字壓在亮海面上會糊掉，所以給它一點自己的陰影當底，而不是加一層
     暗板——參考圖裡字是直接站在光上的。 */
      text-shadow: 0 .04em .28em rgba(35, 62, 96, .26);
    }

    .hero-sub {
      margin-top: clamp(.5rem, 1.1vw, 1.1rem);
      font-family: "Noto Sans TC", "Jost", sans-serif;
      font-weight: 300;
      font-size: clamp(.72rem, 1.12vw, 1.08rem);
      letter-spacing: .42em;
      text-indent: .42em;
      /* 這一行正好壓在水珠最亮的地方，白字配淡陰影會直接消失。改成全白
         加一層收得很緊的深藍暈——不是加暗板，字仍然站在光上，只是自己
         帶了一圈邊，這樣它在球上、在天空上、在海面上都讀得到。 */
      color: #fff;
      text-shadow:
        0 0 .10em rgba(30, 54, 86, .55),
        0 .04em .30em rgba(30, 54, 86, .42);
    }

    /* 進場：標題比水珠晚一步，字要等場景站穩才浮上來。 */
    .hero-title,
    .hero-sub {
      opacity: 0;
      transform: translateY(.42em);
      transition: opacity 1.6s var(--ease), transform 1.6s var(--ease);
    }

    body.is-ready .hero-title {
      opacity: 1;
      transform: none;
      transition-delay: .9s
    }

    body.is-ready .hero-sub {
      opacity: 1;
      transform: none;
      transition-delay: 1.25s
    }

    /* 標題必須在珠子到達之前就讓開，而且要快：進場用的 1.6 秒在這裡會
       讓字和珠子擠在一起。0.42 秒離場，副標比主標早一步走。
       往上推而不是往下：珠子是朝觀眾來的，字讓路的方向要和它相反。 */
    body.is-transitioning .hero-title,
    body.is-section-two .hero-title,
    body.is-transitioning .hero-sub,
    body.is-section-two .hero-sub {
      opacity: 0;
      transform: translateY(-.58em);
      transition: opacity .42s var(--ease), transform .52s var(--ease);
      transition-delay: 0s
    }

    body.is-transitioning .hero-sub,
    body.is-section-two .hero-sub {
      transition-delay: 0s;
      transition-duration: .3s, .4s
    }

    @media (max-width:680px) {
      .hero-title {
        white-space: normal;
        font-size: clamp(2rem, 10.5vw, 3.4rem);
        letter-spacing: .005em
      }

      .hero-sub {
        letter-spacing: .26em;
        text-indent: .26em
      }
    }

    .hair:before,
    .hair:after {
      content: "";
      position: absolute;
      top: 0;
      width: 3px;
      height: 3px;
      margin-top: -1px;
      border-radius: 50%;
      background: rgba(47, 95, 138, .36);
    }

    .hair:before {
      left: -8px
    }

    .hair:after {
      right: -8px
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: #e4edf1;
      transition: opacity 1.15s var(--ease), visibility 1.15s;
    }

    .loader.is-done {
      opacity: 0;
      visibility: hidden
    }

    .loader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .loader-logo {
      font-size: .78rem;
      letter-spacing: .48em;
      text-indent: .48em;
      color: var(--ink);
    }

    .loader-line {
      width: min(210px, 46vw);
      height: 1px;
      overflow: hidden;
      background: rgba(47, 95, 138, .16);
    }

    .loader-line i {
      display: block;
      width: 100%;
      height: 100%;
      background: #4a86bb;
      transform: scaleX(0);
      transform-origin: left center;
      animation: load 1.25s var(--ease) forwards;
    }

    .loader-note {
      color: var(--ink-dim);
      font-size: .52rem;
      letter-spacing: .24em;
    }

    @keyframes load {
      to {
        transform: scaleX(1)
      }
    }

    .fallback {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 30px;
      color: var(--ink);
      text-align: center;
      background: #e4edf1;
      font-size: .78rem;
      letter-spacing: .14em;
    }

    .section-two {
      /* Media reveal and settle are both keyed off the scroll progress from
     JS, so the hand-off stays locked to the drop instead of racing it. */
      --s2-media: 0;
      --s2-scale: 1.075;
      position: fixed;
      inset: 0;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      background:
        radial-gradient(70% 52% at 50% 62%, rgba(255, 239, 234, .48), transparent 64%),
        radial-gradient(92% 72% at 50% 0%, rgba(156, 204, 222, .34), transparent 72%),
        linear-gradient(180deg, #c6dce6 0%, #e8eef1 49%, #eee9e7 64%, #b8d8e5 100%);
      will-change: opacity;
    }

    .section-two.is-active {
      visibility: visible
    }

    .section-two.is-live {
      pointer-events: auto
    }

    /* Deep plate beneath the film: the swap never shows a black frame even
   if the video is still buffering when the flare clears. */
    .s2-plate {
      position: absolute;
      inset: 0;
      opacity: var(--s2-media);
      background:
        radial-gradient(118% 88% at 50% 40%, #26414f 0%, #162834 62%, #0e1c26 100%);
    }

    .s2-media {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: var(--s2-media);
      transform: scale(var(--s2-scale));
      transform-origin: 50% 54%;
      will-change: transform, opacity;
    }

    .s2-media video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.25s var(--ease);
    }

    .section-two.is-video-ready .s2-media video {
      opacity: 1
    }

    .s2-clouds {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none
    }

    .s2-clouds i {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(ellipse at 40% 45%,
          rgba(245, 248, 252, .72) 0%,
          rgba(232, 239, 246, .40) 30%,
          rgba(212, 221, 229, .13) 58%,
          transparent 76%);
      filter: blur(var(--pcb, 18px));
      will-change: transform;
      animation: var(--pca) linear infinite;
    }

    @keyframes pcA {
      from {
        transform: translateX(-22vw)
      }

      to {
        transform: translateX(122vw)
      }
    }

    @keyframes pcB {
      from {
        transform: translateX(122vw)
      }

      to {
        transform: translateX(-22vw)
      }
    }

    /* Reading shade: keeps the type legible over any frame of the film. */
    .s2-shade {
      position: absolute;
      inset: 0;
      opacity: var(--s2-media);
      background:
        linear-gradient(100deg, rgba(9, 20, 28, .72) 0%, rgba(9, 20, 28, .38) 38%, transparent 68%),
        linear-gradient(0deg, rgba(9, 20, 28, .46) 0%, transparent 42%),
        radial-gradient(122% 88% at 50% 46%, transparent 40%, rgba(8, 18, 26, .46) 100%);
    }

    /* ---------- section two type (copy ported from the chapter build) ---- */
    .s2-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding-left: clamp(64px, 15vw, 300px);
      padding-right: clamp(24px, 6vw, 80px);
      color: #fff;
    }

    .s2-block {
      max-width: min(760px, 64vw)
    }

    .mask {
      display: block;
      overflow: hidden
    }

    .mask>i {
      display: block;
      font-style: normal;
      transform: translateY(112%);
      opacity: 0;
      transition: transform 1.05s var(--ease), opacity .8s var(--ease);
      transition-delay: var(--d, 0s);
    }

    .section-two.is-in .mask>i {
      transform: none;
      opacity: 1
    }

    /* Leaving is not the entrance played backwards: no stagger, and quick,
   so scrolling back up never feels like it drags the type with it. */
    .section-two:not(.is-in) .mask>i {
      transition-duration: .5s, .34s;
      transition-delay: 0s;
    }

    .s2-eyebrow {
      font-size: clamp(.86rem, 1.1vw, 1.05rem);
      letter-spacing: .02em;
      opacity: .92;
      margin-bottom: clamp(22px, 3vw, 44px);
    }

    .s2-title {
      font-weight: 200;
      font-size: clamp(2rem, 4.6vw, 4.5rem);
      line-height: 1.12;
      letter-spacing: .005em;
      text-transform: uppercase;
      margin-bottom: clamp(30px, 4vw, 58px);
    }

    .s2-cta {
      display: inline-flex;
      align-items: center;
      gap: clamp(18px, 2vw, 34px);
      text-decoration: none;
      color: #fff;
    }

    .s2-cta .txt {
      font-size: .72rem;
      letter-spacing: .24em;
      font-weight: 500;
      text-transform: uppercase
    }

    .s2-cta .circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .45);
      display: grid;
      place-items: center;
      font-size: .8rem;
      opacity: 0;
      transform: scale(.76);
      transition: background .5s var(--ease), color .5s var(--ease),
        border-color .5s var(--ease),
        transform .72s var(--ease) .30s, opacity .55s var(--ease) .30s;
    }

    .section-two.is-in .s2-cta .circle {
      opacity: 1;
      transform: none
    }

    .s2-cta:hover .circle {
      background: #fff;
      color: #12222c;
      border-color: #fff;
      transform: translateX(4px)
    }

    .s2-rule {
      height: 1px;
      width: min(300px, 34vw);
      margin-top: clamp(22px, 2.4vw, 38px);
      background: rgba(255, 255, 255, .38);
      transform: scaleX(0);
      transform-origin: 0 50%;
      transition: transform 1.2s var(--ease) .42s;
    }

    .section-two.is-in .s2-rule {
      transform: scaleX(1)
    }

    .section-two:not(.is-in) .s2-rule {
      transform-origin: 100% 50%;
      transition-duration: .42s;
      transition-delay: 0s;
    }

    .section-two:not(.is-in) .s2-cta .circle {
      transition-duration: .3s, .3s, .3s, .34s, .26s;
      transition-delay: 0s;
    }

    .section-two:not(.is-in) .s2-back {
      transition-delay: 0s;
      transition-duration: .35s
    }

    .s2-back {
      position: absolute;
      right: clamp(20px, 3.2vw, 54px);
      bottom: clamp(22px, 3vw, 46px);
      font-size: .54rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .46);
      opacity: 0;
      transition: opacity .9s var(--ease) .5s;
    }

    .section-two.is-in .s2-back {
      opacity: 1
    }

    .transition-flash {
      --flare-x: 50%;
      --flare-y: 62%;
      position: fixed;
      inset: -18%;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      background:
        /* 白 → 淡藍紫 → 紫 → 洋紅 → 青：這是薄膜色散的順序。夾在紫和青
           之間那個非光譜色的洋紅，就是讓這條漸層讀成「干涉」而不是「彩
           虹」的關鍵。原本的漸層只有青色，紫和洋紅完全沒有。虹彩放在
           20–42%、alpha ≥ .32，再往外或再淡在這麼淡的場域上就看不見。 */
        radial-gradient(ellipse at var(--flare-x) var(--flare-y),
          rgba(255, 255, 255, 1) 0 1.2%,
          rgba(246, 243, 255, .97) 4.5%,
          rgba(214, 206, 255, .80) 11%,
          rgba(188, 168, 248, .56) 20%,
          rgba(222, 152, 232, .40) 30%,
          rgba(132, 206, 246, .32) 42%,
          rgba(108, 146, 208, .12) 54%,
          transparent 72%);
      mix-blend-mode: screen;
      will-change: opacity, transform;
      transform-origin: var(--flare-x) var(--flare-y);
      transform: scale(.08, .035);
    }

    .transition-flash:before {
      content: "";
      position: absolute;
      left: 5%;
      right: 5%;
      top: var(--flare-y);
      height: 2px;
      transform: translateY(-50%);
      /* 一條對稱的白線橫過畫面正中央，是最公式化的鏡頭光暈符號。兩端
         不對稱（一邊偏紫、一邊偏洋紅），整條降到三分之一。 */
      background: linear-gradient(90deg,
          transparent,
          rgba(196, 176, 250, .26) 20%,
          rgba(255, 255, 255, .92) 48%,
          rgba(224, 156, 234, .26) 80%,
          transparent);
      opacity: .34;
      filter: blur(.4px);
      box-shadow:
        0 0 10px rgba(226, 214, 255, .70),
        0 0 34px rgba(150, 120, 230, .40);
    }

    .section-two-index {
      position: absolute;
      left: clamp(20px, 3.2vw, 54px);
      bottom: clamp(22px, 3vw, 46px);
      color: rgba(255, 255, 255, .54);
      font-size: .58rem;
      letter-spacing: .30em;
      text-transform: uppercase;
    }

    body.is-ready.is-transitioning .chrome {
      opacity: .24
    }

    body.is-ready.is-section-two .chrome {
      opacity: 0
    }

    .tuner {
      position: fixed;
      top: 74px;
      right: 18px;
      z-index: 12;
      width: min(330px, calc(100vw - 36px));
      max-height: calc(100vh - 96px);
      color: #dcebf3;
      border: 1px solid rgba(196, 226, 240, .22);
      background: rgba(23, 45, 58, .76);
      box-shadow: 0 18px 55px rgba(26, 56, 73, .22);
      backdrop-filter: blur(18px) saturate(118%);
      -webkit-backdrop-filter: blur(18px) saturate(118%);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .8s var(--ease) .65s, transform .8s var(--ease) .65s;
    }

    body.is-ready .tuner {
      opacity: 1;
      transform: none
    }

    .tuner.is-folded .tuner-body {
      display: none
    }

    .tuner-head {
      height: 43px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 13px 0 15px;
      border-bottom: 1px solid rgba(196, 226, 240, .14);
    }

    .tuner-title {
      font-size: .58rem;
      letter-spacing: .27em;
      text-transform: uppercase;
    }

    .tuner-toggle {
      width: 25px;
      height: 25px;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      font: 300 .9rem/1 "Jost", sans-serif;
    }

    .tuner-body {
      max-height: calc(100vh - 140px);
      overflow: auto;
      padding: 5px 14px 14px;
      scrollbar-width: thin;
      scrollbar-color: rgba(205, 230, 242, .28) transparent;
    }

    .tune-group {
      padding: 12px 0 8px;
      border-bottom: 1px solid rgba(196, 226, 240, .11)
    }

    .tune-group:last-of-type {
      border-bottom: 0
    }

    .tune-group h3 {
      margin-bottom: 9px;
      color: rgba(222, 239, 247, .58);
      font-size: .48rem;
      font-weight: 400;
      letter-spacing: .28em;
    }

    .tune-row {
      min-height: 25px;
      display: grid;
      grid-template-columns: 64px 1fr 45px;
      align-items: center;
      gap: 8px;
    }

    .tune-row.is-morph {
      min-height: 45px;
      padding-top: 2px;
    }

    .tune-row.is-morph:after {
      content: "圓球  ◀────────▶  液態波";
      grid-column: 2/4;
      margin-top: -5px;
      color: rgba(218, 239, 248, .48);
      font: 400 .42rem/1 Consolas, monospace;
      letter-spacing: .04em;
      text-align: center;
    }

    .tune-row label {
      color: rgba(226, 240, 247, .72);
      font-size: .5rem;
      letter-spacing: .08em;
    }

    .tune-row input[type="range"] {

uniform vec3 uEnvZenith,uEnvUpper,uEnvField,uEnvHorizon,uEnvLower,uEnvFloor,uEnvInk,uEnvGlow;

uniform vec4 uEnvCore;

   backdrop draws it and the probe bakes it, so the plate and the drop are
   the same substance rather than two materials tuned to look alike.
   BLUR is surface roughness: it widens every edge and blunts every lobe,
   an analytic stand-in for a mip chain, which costs nothing and is why the
   far field does not crawl.

   elevations from well below the horizon to well above it, while the
   visible backdrop spans only the lower part of that, so a band stack

     elevation, and every function of elevation is a RING on a sphere. That
     is the whole of the dark planet with a belt: the rail became a
     latitude, the band stack became eight concentric rings, and even the
     step from floor to horizon became a bright band across the equator.
     Only the drop passes card>0, and for it the elevation is squashed so
     the last of those rings flattens out. */

  /* 模糊＝把房間用一個高斯核抹開。餘弦被高斯抹開後的衰減有解析解：

     DIRECTION into a ring. A black card falling away to the lower right, a
     stretched key from the upper left, and the sea's bounce underneath —
     which is how a photographer lights a chrome subject, and the only way
     to give a mirror ball a light direction instead of a set of latitudes.

     light in air from a sprite, and the haze is why this scene needs no

  float k=max(dot(d,uEnvCoreDir),0.);

    +uEnvCore.y*pow(k,150.*sharp)
    +uEnvCore.z*pow(k,16.)

vec3 montisChrome(vec3 N,vec3 V,vec2 flow,float curv,float rough,float irisMask,float bandGain,float card){

     reflected bands draw out into long filaments along it. One normalize,

     stripe. */

uniform vec4 uVeil;
uniform vec2 uVeilEll;
uniform vec3 uVeilTint;

     surface approaches the limit and never reaches it — no second crease
     where the rounding begins. The slope it returns is the derivative of
     that same curve, which is all the normal needs: the horizontal

         the longest carries twenty-five times the shortest — which is what
         makes a single slow fold cross the whole frame with nothing on it.
         Raising the short components against the long one, by their
         wavenumber ratio to a power, is the one change that puts structure
         inside a fold rather than more folds beside it. It is also the
         expensive direction: steepness goes as A*k, so a component lifted

         and the panel pays for it out of the chop budget. */

         mirror's whole character — is untouched; the frequency drops by the

         反而最吵。這裡把三道短浪在 9.5→19 之間才放進來，最近的水面就只

         against how far it rises. It is the whole difference between a
         swell and a sea — at 1 the crests are round, and as it climbs
         water is drawn out of the troughs and piled into the crests until
         they stand up as ridges with flats between them. It sharpens
         without raising, which is why it reads as detail rather than as
         weather. Beyond Q*A*k = 1 the surface folds through itself; the
         panel clamps the product well under that. */
      float Q=W.w*uSeaChop;
      float ph=W.x*dot(D.xy,q)-W.y*uSeaTime+D.z;

         its mean as below, which is why a swell reads as a dune however
         high it is driven; a ridge does not — it is drawn to a line at the
         top and lies broad and flat between. Raising the profile to a power
         is exactly that reshaping, and because the power is taken on the
         half-cycle (sin+1)/2 rather than on the sine, the crest sharpens
         while the trough opens out instead of both of them peaking. The

         另外兩層的斜率變異數不是丟掉，而是併進 lost，由粗糙度轉成較寬的
         高光，那才是它們真正的物理意義。 */
      /* 這一層也要跟著拉長 4.2 倍。原本的波長是 0.86 個世界單位，在浪身
         都拉長之後它成了畫面上唯一的高頻，於是整片近海看起來像瓦楞紙。
         時間項同樣依 √λ 放慢，它才跟海是同一種流體。 */
      float f,a,ph;
      f=1.-smoothstep(24.0,46.0,vDist);
      a=.016*uDetail.x*f; ph=1.740*(.16*q.x+.987*q.y)-.659*uSeaTime;
      nrm.x-=.16*a*cos(ph); nrm.z-=.987*a*cos(ph);
      lost+=(1.-f*f)*.5*.016*.016*uDetail.x*uDetail.x;
      lost+=uDetail.x*uDetail.x*(1.-smoothstep(9.,22.,vDist))*.00129;

      /* TEXTURE: two more capillary layers, off by default on the old
         build and restored here as a dial of their own. The note above is
         still the law — three layers within a few degrees of each other
         comb the reflection into corduroy — so these cross the first at
         35 and 24 degrees rather than running beside it, each is shorter
         and dies nearer the lens than the one before, and each is kept
         under a fiftieth of a radian of slope, which is a quarter of what
         it takes to sweep a light band. They are what turns a clean fold
         into water that has a surface. */
      if(uTexture>.001){
        f=1.-smoothstep(13.0,27.0,vDist);
        a=.0125*uTexture*f; ph=2.512*(-.438*q.x+.899*q.y)+.786*uSeaTime;
        nrm.x+=.438*a*cos(ph); nrm.z-=.899*a*cos(ph);
        lost+=(1.-f*f)*.5*.0125*.0125*uTexture*uTexture;

        f=1.-smoothstep(7.5,16.0,vDist);
        a=.0092*uTexture*f; ph=3.874*(.545*q.x+.839*q.y)-1.207*uSeaTime;
        nrm.x-=.545*a*cos(ph); nrm.z-=.839*a*cos(ph);
        lost+=(1.-f*f)*.5*.0092*.0092*uTexture*uTexture;
      }

      /* The ring is re-evaluated here rather than interpolated: the mesh
         cannot resolve a packet this narrow at the drop's distance, but a
         fragment can, and both carry the same scale so they agree
         wherever both resolve it. */
      vec4 rip=rippleField(vWorld.xz);
      nrm.xz-=rip.yz*uRippleLift*.7647*uRippleMirror;
      nrm=normalize(nrm);

      /* What distance took from the detail comes back as a wider specular
         lobe. Without this the far sea is a perfect mirror and reads as
         plastic; with it, satin. */
      /* 還要再加一項，而這一項才是鋁箔感的真正解藥：lost 只記了「網格」
         丟掉的斜率，完全沒有人管「一個像素」丟掉的斜率。在十四單位外，
         一個像素橫跨的反射仰角是 0.1，那裡面塞著三分之一條光帶、好幾條
         軌道和好幾條細絲，而它們全都以六七成的對比被畫出來——那不是細
         節，那是混疊。fwidth 量的就是這個像素足跡，把它折進粗糙度，雜訊
         就變回色調，鏡面也不會再隨著鏡頭爬動。 */
      /* ------------------------------------------------------------
         FOAM AND SPRAY
         Hung on the fold measure the swell hands over, so froth appears
         where the crest is pinching and nowhere else — it travels with the
         wave, thickens as the wave stands up and is gone in the troughs,
         without a single extra wave being evaluated.
         On a metal sea foam cannot be white paint. What it does is stop
         the surface being a mirror: the fold is broken into a thousand
         faces pointing every way, which is a rough surface, so the froth
         is put in as roughness first and only then as a lift toward the
         room's own light. That way it is still the same metal — just metal
         that has lost its polish exactly where it is tearing.
         The speckle fades out with distance on purpose: past forty units a
         froth cell is smaller than a pixel, and drawn there it would only
         crawl.
         ------------------------------------------------------------ */
      float foam=0.,froth=1.;
      if(uFoam.x>.001){
        /* Two conditions, not one. The fold alone is satisfied over the
           whole rising half of every wave — half the sea — and foam spread
           over that is not foam, it is a haze. A whitecap needs the water
           to be pinching AND to be near the top of its own travel, so the
           height above the mean, measured against what the swell can
           actually reach, gates it down to the crest lines. */
        float lift=clamp(vWorld.y/uWaveTop,0.,1.);
        foam=uFoam.x*smoothstep(uFoam.y,uFoam.z,1.-vFold)
          *smoothstep(.14,.62,lift);
        if(foam>.002&&uSpray.x>.001){
          float near=1.-smoothstep(14.,42.,vDist);
          vec2 fp=vWorld.xz*uSpray.y+vec2(uSeaTime*.11,-uSeaTime*.07);
          float mottle=seaNoise(fp)*.66+seaNoise(fp*2.37+vec2(19.,7.))*.34;
          froth=1.+(mottle-.5)*2.*uSpray.x*near;
          foam*=clamp(froth,.2,1.8);
        }
        foam=clamp(foam,0.,1.);
      }

      float foot=2.*fwidth(nrm.z)+.6*fwidth(nrm.x);
      float rough=sqrt(uRough*uRough+2.*lost+.25*foot*foot+foam*foam*.55);

      vec3 V=normalize(cameraPosition-vWorld);
      /* Signed curvature from the swell's own second difference, cheaply:
         negative in a crease. */
      float curv=clamp((nrm.y-1.)*9.-rip.x*2.4,-1.,1.);
      /* A low-frequency gate on which folds may flash at all: widen this
         smoothstep before ever touching the amount. */
      /* 原本這個 mask 是一條波長 25 單位的正弦，橫過整片海慢慢飄——那不是
         遮罩，那是一條會移動的大條紋，而且在掠射角下整條同時全亮，就成了
         那些淡紫色的斑塊。鉻的色散只出現在兩道摺相接的細絲上，所以改成綁
         在摺本身：只有較陡的側坡才配帶色。 */
      float fold=clamp((1.-nrm.y)*260.,0.,1.);
      float mask=smoothstep(.45,.95,fold);
      vec3 col=montisChrome(nrm,V,vFlow+uSeaCurrent*.35,curv,rough,mask,1.,0.);
      /* The lift. Toward white rather than to it, and modulated by the same
         speckle that roughened it, so the froth keeps the plate's blue and
         never punches a flat sheet out of the picture. */
      if(foam>.002)col=mix(col,mix(col,vec3(1.),.58)*froth,foam);

      /* Contact, not a shadow. A mirror has nothing to shade, so the drop
         reads as reflection occlusion: the metal under it returns less of
         the room. The bright column welding the bead to the sea is not
         drawn here — it is already there, because the core's broad lobes
         stand behind the drop and the sea mirrors them. */
      /* 但它必須跟著水面走，否則就是一塊漂在畫面上、和底下的波紋毫無關
         係的圓斑——客戶說的「像污漬」就是它。往鏡頭方向拉長，因為這是反
         射的遮蔽而不是影子；再用 nrm.y 開關，讓波峰可以直接穿過去。 */
      vec2 off=vWorld.xz-uDropXZ;
      off.y*=.42;
      float r2=dot(off,off)/max(uDropRad*uDropRad*4.2,1e-4);
      col*=1.-uDropOcclude*exp(-r2)*(.30+.70*smoothstep(.34,-.26,vWorld.y));

      /* No fog and no horizon line: the sea dissolves into the exact
         direction it is mirroring, which is exposure-correct by
         construction and leaves no seam where the fan ends. */
      vec3 view=normalize(vWorld-cameraPosition);
      /* The near edge: the closest metal looks almost straight down into
         itself, and in a real pour that is the inkiest part of the plate.
         A multiply, never a lerp to a colour, so it takes the value down
         and the blue up without touching a single specular. */
      col=mix(col,col*uEnvInk*1.05,smoothstep(uSeaEdge.y,uSeaEdge.x,vDist)*uSeaEdge.z);
      /* 用背景自己的光帶量去溶解，兩邊才會等亮；原本海的外緣比它上面一像
         素的天空亮 0.254，那就是海上緣那條硬邊。順便用分支省掉九成像素的
         一次環境取樣。 */
      float hz=smoothstep(uHaze.x,uHaze.y,vDist);
      if(hz>.001)col=mix(col,montisEnv(view,.05,uBandGain,0.),hz);
      col=montisVeil(col,view);
      // Only the late watershed chapter changes the shared water's palette.
      // Silver reflections share the ice-blue mountain palette.
      float waterLuma=dot(max(col,vec3(0.)),vec3(.2126,.7152,.0722));
      float silver=.52+(pow(clamp(waterLuma*.82,0.,1.),.75)-.5)*.10;
      vec3 mountainWater=mix(uWatershedBase,uWatershedHighlight,clamp(.10+silver*uWatershedReflection,0.,1.));
      // Water shares the same aerial perspective as the surrounding terrain.
      // Grading after the opening veil must not erase the river's distance haze.
      float riverDepth=max(0.,-(viewMatrix*vec4(vWorld,1.)).z);
      float dayFog=1.-exp(-pow(uRiverFogParams.x*riverDepth,2.));
      float valleyFog=smoothstep(4300.,12500.,vDist)*.68+smoothstep(1800.,7200.,vDist)*.12;
      float riverFog=mix(dayFog,clamp(valleyFog*uRiverFogParams.z,0.,.68),uRiverFogParams.y);
      mountainWater=mix(mountainWater,uRiverFogColor,riverFog);
      col=mix(col,mountainWater,uJourneyNight);
      /* 河與岸的交界（只在河流上）：淺水變亮變清、近岸映出岸壁、貼著岸的浪花蕾絲。
         vShore = (河床高度, 離岸距離, 岸壁高度)，由場景依同一份岸線幾何烘進每個頂點。 */
      if(uRiverSurface>.5&&uShore.w>.5){
        float bed=vShore.x,inward=vShore.y,wallH=max(vShore.z,0.);
        float px=fwidth(vWorld.x)+fwidth(vWorld.z)+1e-3;
        float vis=(1.-hz)*(1.-riverFog*uJourneyNight);
        float depth=max(-bed,0.);
        float aer=smoothstep(.6,3.,px);
        float edge=max(inward,0.);
        float shallow=max(1.-smoothstep(0.,2.6,depth),1.-smoothstep(0.,7.5,edge))*uShore.y*(1.-.55*aer);
        vec3 bedTint=mix(uShoreBedColor,uWatershedHighlight,.30);
        col=mix(col,mix(col,bedTint,.62)+.035,shallow*.55*vis);
        float wob=(nrm.x*1.6+nrm.z*.7)*7.;
        float reach=wallH*.5+5.;
        float bank=1.-smoothstep(0.,reach,edge+wob);
        float grazing=pow(1.-clamp(dot(nrm,V),0.,1.),2.);
        col=mix(col,uShoreWallColor,bank*uShore.z*(.30+.70*grazing)*.62*vis);
        vec2 fq=vWorld.xz*.55+vec2(uSeaTime*.035,-uSeaTime*.05);
        float n1=seaNoise(fq),n2=seaNoise(fq*2.3+vec2(7.,3.)-uSeaTime*.06);
        float laceDetail=1.-smoothstep(.35,1.2,px*.55);
        float hug=max(smoothstep(-1.15,-.08,bed)*(1.-smoothstep(.05,.45,bed)),1.-smoothstep(.2+px,2.4+px*2.,inward+(n1-.5)*1.6));
        float lace=mix(.60,smoothstep(.40,.68,n1*.62+n2*.38+hug*.2),laceDetail);
        float trail=smoothstep(-3.,-.9,bed-edge*.25)*(1.-hug)*smoothstep(.60,.74,n1*.5+n2*.5)*laceDetail*.45*(1.-smoothstep(3.,9.,edge));
        float foamAmt=uShore.x*vis*(hug*lace+trail)*(1.-.88*aer);
        col=mix(col,uShoreFoamColor,clamp(foamAmt,0.,.82));
      }
      col+=montisDither(gl_FragCoord.xy)*mix(.004,.0006,uJourneyNight);
      gl_FragColor=vec4(max(col,vec3(0.)),1.);
    }
  `
    });

    // CSS-pixel framing belongs only to the opening sea, not the canyon material.
    const surfaceScreenOffset={value:2*CONFIG.sea.screenDown/Math.max(1,innerHeight)};
    function lowerSurfaceMaterial(material){
      if(material.isShaderMaterial){
        material.uniforms.uSurfaceScreenOffset=surfaceScreenOffset;
        material.vertexShader='uniform float uSurfaceScreenOffset;\n'+material.vertexShader.replace(/}\s*$/, 'gl_Position.y-=uSurfaceScreenOffset*gl_Position.w;\n}');
      }else{
        material.onBeforeCompile=shader=>{
          shader.uniforms.uSurfaceScreenOffset=surfaceScreenOffset;
          shader.vertexShader='uniform float uSurfaceScreenOffset;\n'+shader.vertexShader.replace('#include <project_vertex>','#include <project_vertex>\ngl_Position.y-=uSurfaceScreenOffset*gl_Position.w;');
        };
        material.customProgramCacheKey=()=> 'opening-water-framing';
      }
      material.needsUpdate=true;
      return material;
    }
    const openingSeaMaterial=lowerSurfaceMaterial(new THREE.ShaderMaterial({
      uniforms:{...seaUniforms,uRiverSurface:{value:0}},fog:false,defines:{...seaMaterial.defines},
      vertexShader:seaMaterial.vertexShader,fragmentShader:seaMaterial.fragmentShader
    }));
    const sea = new THREE.Mesh(createSeaGeometry(), openingSeaMaterial);
    sea.name = 'montis-sea';
    /* The bounds are wrong the moment the waves displace it. */
    sea.frustumCulled = false;
    sea.receiveShadow = false;
    sea.castShadow = false;
    sea.renderOrder = 1;
    scene.add(sea);

    /* Fine horizontal caustics keep the reflection from reading as a flat
       mirror. Their frequencies are deliberately stretched like calm water
       viewed from a camera only a little above the surface. */
    const waterVeilMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime: { value: 0 },
        uBlue: { value: new THREE.Color('#8fb6cc') },
        uWhite: { value: new THREE.Color('#eef7fb') }
      },
      vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
    }
  `,
      fragmentShader: `
    uniform float uTime;
    uniform vec3 uBlue,uWhite;
    varying vec2 vUv;
    void main(){
      float bend=sin(vUv.x*42.+uTime*.18)*.010
        + sin(vUv.x*17.-uTime*.11)*.006;
      float a=abs(sin((vUv.y+bend)*26.-uTime*.18));
      float b=abs(sin((vUv.y-bend*.7)*13.+uTime*.12));
      float fine=pow(1.-a,14.);
      float broad=pow(1.-b,16.);
      float horizon=smoothstep(.05,.58,vUv.y);
      vec3 col=mix(uBlue,uWhite,clamp(fine+broad*.65,0.,1.));
      float alpha=(.008+fine*.030+broad*.022)*horizon;
      gl_FragColor=vec4(col,alpha);
    }
  `
    });
    const waterVeil = new THREE.Mesh(
      new THREE.PlaneGeometry(130, 130),
      waterVeilMaterial
    );
    waterVeil.rotation.x = -Math.PI / 2;
    waterVeil.position.set(0, .018, -13);
    waterVeil.renderOrder = 2;
    scene.add(waterVeil);

    /* The crests themselves. Height alone is invisible on a plane seen this
       flat, so the overlay shades the analytic slope instead: a specular
       glint on the face turned toward the sun, a cooler trough behind it,
       and a bright core for the first frames of a strike. Fragments the
       field never reaches are discarded, so a still lake costs one branch. */
    const rippleOverlayMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      uniforms: {
        uRipples,
        uRippleParams,
        uRippleLive,
        uRippleTime,
        uRippleAmbient,
        uOpacity: { value: 1 },
        uSun: { value: new THREE.Vector3(-.55, .72, .34).normalize() },
        uCrest: { value: new THREE.Color('#f4fcff') },
        uTrough: { value: new THREE.Color('#8aa8bd') }
      },
      vertexShader: `
    varying vec3 vWorld;
    void main(){
      vec4 world=modelMatrix*vec4(position,1.);
      vWorld=world.xyz;
      gl_Position=projectionMatrix*viewMatrix*world;
    }
  `,
      fragmentShader: `
    precision highp float;
    ${RIPPLE_GLSL}
    uniform float uOpacity;
    uniform vec3 uSun,uCrest,uTrough;
    varying vec3 vWorld;
    void main(){
      vec4 field=rippleField(vWorld.xz);
      vec3 flow=ambientFlow(vWorld.xz);
      /* Soft clip instead of clamp: the crest rolls over rather than
         hitting a ceiling, which is the whole difference between a
         ripple and a decal stamped on the surface. */
      float raw=(field.x+flow.x)*18.;
      float lift=raw/(1.+abs(raw));
      /* The swell carries almost no height but plenty of tilt, so it is
         exaggerated far harder than the rings to read at all. */
      vec3 n=normalize(vec3(
        -(field.y*2.0+flow.y*16.),
        1.,
        -(field.z*2.0+flow.z*16.)
      ));
      vec3 viewDir=normalize(cameraPosition-vWorld);
      vec3 halfDir=normalize(uSun+viewDir);
      float spec=pow(max(dot(n,halfDir),0.),26.);
      /* Rings shed near the horizon are thinner than a pixel; fade them
         out rather than let them alias into a shimmer. */
      float range=smoothstep(74.,7.,length(cameraPosition-vWorld));
      vec3 col=mix(uTrough,uCrest,clamp(lift*.5+.5,0.,1.));
      col+=vec3(.96,.99,1.)*spec*.42;
      float alpha=(abs(lift)*.22+spec*.30+field.w*.22)*range*uOpacity;
      if(alpha<.0012)discard;
      gl_FragColor=vec4(col,clamp(alpha,0.,.72));
    }
  `
    });
    const rippleOverlay = new THREE.Mesh(
      new THREE.PlaneGeometry(130, 130),
      rippleOverlayMaterial
    );
    rippleOverlay.rotation.x = -Math.PI / 2;
    rippleOverlay.position.set(0, CONFIG.water.y + .06, -13);
    rippleOverlay.renderOrder = 3.6;
    rippleOverlay.frustumCulled = false;
    scene.add(rippleOverlay);
    /* The lake's own layers are off with the lake: the metal carries its
       rings itself, in the surface rather than as a decal over it. */
    waterVeil.visible = false;
    rippleOverlay.visible = false;

    /* Water.js re-renders the scene from the mirrored camera. The overlay
       lies parallel to that mirror, so left visible it would paint a second
       set of rings inside the reflection; hide it for that pass only. */
    const waterReflectionPass = water.onBeforeRender;
    /* Counted by frame() around composer.render(). With the droplet's
       refraction on, three draws the opaque scene twice a frame (into the
       transmission target, then to the screen) and the water would render
       its mirror both times, each with a refraction pass of its own. Both
       draws use the main camera, so the first mirror serves the second. */
    let renderFrame = 0;
    let mirrorFrame = -1;
    water.onBeforeRender = function (renderer, reflectedScene, reflectedCamera) {
      if (mirrorFrame === renderFrame) return;
      mirrorFrame = renderFrame;
      const wasVisible = rippleOverlay.visible;
      rippleOverlay.visible = false;
      /* The droplet marches from whichever camera draws it. In the mirror it
         keeps only what stands above the water, spends fewer steps, and sizes
         its pixels to the 1024 reflection target. */
      const U = dropletUniforms;
      const steps = U.uMaxSteps.value;
      const angle = U.uPixelAngle.value;
      U.uMirrorPass.value = 1;
      U.uWaterY.value = water.position.y;
      U.uMaxSteps.value = Math.max(12, Math.round(steps * .45));
      U.uPixelAngle.value = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) / 1024;
      waterReflectionPass.call(this, renderer, reflectedScene, reflectedCamera);
      U.uMirrorPass.value = 0;
      U.uMaxSteps.value = steps;
      U.uPixelAngle.value = angle;
      rippleOverlay.visible = wasVisible;
    };

    /* ------------------------------------------------------------------
       PROJECT GLTF ASSETS
       The authored terrain, river surface and droplet replace the earlier
       procedural stand-ins. The reflective Water plane remains underneath
       the river mesh so the mountain is still mirrored in the foreground.
       ------------------------------------------------------------------ */
    let assetsReady = false;
    const assetManager = new THREE.LoadingManager();
    assetManager.onProgress = (_url, loaded, total) => {
      loaderNote.textContent = `LOADING SCENE ${Math.round(loaded / total * 100)}%`;
    };
    assetManager.onLoad = () => {
      assetsReady = true;
      loaderNote.textContent = 'SCENE READY';
      /* The film is heavy: only start buffering once the 3D scene is done,
         so it never competes with the GLTF loads for the first paint. */
    };
    assetManager.onError = url => {
      loaderNote.textContent = 'ASSET LOAD FAILED';
      console.error('Could not load asset:', url);
    };
    const gltfLoader = new GLTFLoader(assetManager);

    function fitAsset(model, targetSize, grounded = false) {
      model.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size);
      box.getCenter(center);
      const pivot = new THREE.Group();
      model.position.set(-center.x, grounded ? -box.min.y : -center.y, -center.z);
      pivot.scale.setScalar(targetSize / Math.max(size.x, size.z, size.y));
      pivot.add(model);
      return pivot;
    }

    /* The snowy range and its glints are gone with the rest of the valley:
       nothing stands behind the metal now but light. */

    const riverUniforms = {
      uTime: { value: 0 },
      uRipples,
      uRippleParams,
      uRippleLive,
      uRippleTime,
      uRippleAmbient,
      uOpacity: { value: CONFIG.water.opacity },
      uWaveHeight: { value: CONFIG.water.waveHeight },
      uWaveSpeed: { value: CONFIG.water.waveSpeed },
      uImpactAge: { value: 99 },
      uImpactStrength: { value: CONFIG.physics.impact },
      uImpactCenter: { value: new THREE.Vector2(CONFIG.drop.x, CONFIG.drop.z) },
      uRippleSpeed: { value: CONFIG.physics.rippleSpeed },
      uRippleDamping: { value: CONFIG.physics.damping },
      uDeep: { value: new THREE.Color('#b6c9da') },
      uShallow: { value: new THREE.Color('#dfeaf4') },
      uSun: { value: new THREE.Vector3(-.55, .72, .34).normalize() }
    };
    const riverMaterial = new THREE.ShaderMaterial({
      uniforms: riverUniforms,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      vertexShader: `
    uniform float uTime,uWaveHeight,uWaveSpeed;
    uniform float uImpactAge,uImpactStrength,uRippleSpeed,uRippleDamping;
    uniform vec2 uImpactCenter;
    varying vec3 vWorld;
    varying vec3 vNormalW;
    varying float vLift;
    varying float vImpact;
    void main(){
      float phase=mod(uTime*uWaveSpeed*.92,6.2831853);
      vec3 pos=position;
      float a=sin(position.x*.027+phase);
      float b=sin(position.z*.038-phase*2.);
      float c=sin((position.x+position.z)*.016+phase*3.);
      float d=sin((position.x-position.z)*.012-phase*4.);
      pos.y+=(a*.38+b*.28+c*.20+d*.14)*uWaveHeight*18.;
      vec4 world=modelMatrix*vec4(pos,1.);
      vec2 toImpact=world.xz-uImpactCenter;
      float impactDistance=length(toImpact);
      float front=uImpactAge*uRippleSpeed;
      float envelope=exp(-pow((impactDistance-front)*1.42,2.))
        * exp(-uImpactAge*uRippleDamping);
      float centrePulse=exp(-impactDistance*impactDistance*1.35)
        * exp(-uImpactAge*3.4)*sin(uImpactAge*12.);
      vImpact=sin((impactDistance-front)*8.)*envelope;
      world.y+=(vImpact*.34+centrePulse*.22)*uImpactStrength;
      vWorld=world.xyz;

      /* The shading normal is derived from the wave field rather than
         taken from the mesh: the authored river is coarsely tessellated
         and its face normals tile the reflection into flat polygons. */
      float slopeX=cos(world.x*.42+phase)*.055
        + cos((world.x+world.z)*.19+phase*2.)*.030;
      float slopeZ=cos(world.z*.36-phase*1.4)*.050
        + cos((world.x-world.z)*.15-phase*2.4)*.028;
      vec3 n=vec3(
        -slopeX*uWaveHeight*3.4,
        1.,
        -slopeZ*uWaveHeight*3.4
      );
      /* Ripple rings tilt the surface too, so the impact reads in the
         reflection and not only in the silhouette. */
      float ringSlope=cos((impactDistance-front)*8.)*envelope
        *uImpactStrength*.28;
      n.xz-=normalize(toImpact+vec2(1e-4))*ringSlope;
      vNormalW=normalize(n);
      vLift=a*.5+b*.3+c*.2;
      gl_Position=projectionMatrix*viewMatrix*world;
    }
  `,
      fragmentShader: `
    precision highp float;
    ${RIPPLE_GLSL}
    uniform float uTime,uOpacity,uWaveSpeed;
    uniform vec3 uDeep,uShallow,uSun;
    varying vec3 vWorld;
    varying vec3 vNormalW;
    varying float vLift;
    varying float vImpact;
    void main(){
      float phase=mod(uTime*uWaveSpeed*.92,6.2831853);
      vec3 viewDir=normalize(cameraPosition-vWorld);
      vec3 n=normalize(vNormalW+vec3(
        sin(vWorld.z*1.8+phase)*.045,
        0.,
        sin(vWorld.x*1.5-phase*2.)*.04
      ));
      /* The authored river is coarsely tessellated, so the pointer rings
         live entirely in the shading normal here rather than in the
         silhouette — the mesh could not carry them. */
      vec4 pointerRipple=rippleField(vWorld.xz);
      n=normalize(n-vec3(pointerRipple.y,0.,pointerRipple.z)*1.7);
      float fres=pow(1.-clamp(dot(n,viewDir),0.,1.),2.35);
      /* Wide, low-contrast streaks: calm water seen from just above the
         surface, not the tight caustic net of a shallow pool. */
      float lines=pow(.5+.5*sin(
        vWorld.z*2.1+sin(vWorld.x*.30)*1.5+phase
      ),11.);
      float threads=pow(.5+.5*sin(
        vWorld.z*4.4-sin(vWorld.x*.18)*1.8-phase*2.
      ),17.);
      vec3 halfDir=normalize(uSun+viewDir);
      float spec=pow(max(dot(n,halfDir),0.),72.);
      vec3 col=mix(uDeep,uShallow,.42+.30*fres+.08*vLift);
      col+=vec3(.72,.86,.98)*(lines*.085+threads*.055)
        +vec3(.92,.96,1.)*spec*.20;
      col+=vec3(.75,.94,1.)*abs(vImpact)*.42;
      float ringLift=pointerRipple.x*15.;
      col+=vec3(.80,.92,1.)*(ringLift/(1.+abs(ringLift)))*.20
        +vec3(.90,.96,1.)*pointerRipple.w*.24;
      /* Thickest under the camera and thinnest at the horizon, so the
         planar mirror below stays crisp where the eye reads it and
         dissolves into flat water as it runs toward the foreground. */
      gl_FragColor=vec4(col,uOpacity*(.50+.42*(1.-fres)));
    }
  `
    });
    const riverRoot = new THREE.Group();
    riverRoot.name = 'river-controls';
    /* The authored river belonged to the valley. It is off with it. */
    riverRoot.visible = false;
    scene.add(riverRoot);
    gltfLoader.load('river_water_runtime/scene.gltf', gltf => {
      const model = gltf.scene;

        child.receiveShadow = true;

    const dropMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xf4fbff,
      metalness: 0,
      roughness: CONFIG.drop.roughness,
      transmission: CONFIG.drop.transmission,

      attenuationDistance: 8.5,

      envMapIntensity: 1.08,

    const dropShapeUniforms = {
      uRoundness: { value: CONFIG.drop.roundness },
      uSphereRadius: { value: 1.045 },
      uTouchDirection: { value: new THREE.Vector3(0, 0, 1) },
      uTouchStrength: { value: 0 },
      uTouchRadius: { value: CONFIG.physics.touchRadius },

      uTouchWobble: { value: 0 },
      uWaveMorph: { value: CONFIG.distortion.waveMorph },
      uDistortion: { value: CONFIG.distortion.amount },

      uWaveFrequency: { value: CONFIG.distortion.waveFrequency },
      uWaveSpeed: { value: CONFIG.distortion.waveSpeed },
      uTwist: { value: CONFIG.distortion.twist },
      uTwistFrequency: { value: CONFIG.distortion.twistFrequency },
      uBreathing: { value: CONFIG.distortion.breathing },
      uTransitionWobble: { value: 0 }
    };
    dropMaterial.onBeforeCompile = shader => {
      shader.uniforms.uRoundness = dropShapeUniforms.uRoundness;
      shader.uniforms.uSphereRadius = dropShapeUniforms.uSphereRadius;
      shader.uniforms.uTouchDirection = dropShapeUniforms.uTouchDirection;
      shader.uniforms.uTouchStrength = dropShapeUniforms.uTouchStrength;
      shader.uniforms.uTouchRadius = dropShapeUniforms.uTouchRadius;
      shader.uniforms.uTouchTime = dropShapeUniforms.uTouchTime;
      shader.uniforms.uTouchWobble = dropShapeUniforms.uTouchWobble;
      shader.uniforms.uWaveMorph = dropShapeUniforms.uWaveMorph;
      shader.uniforms.uDistortion = dropShapeUniforms.uDistortion;
      shader.uniforms.uWaveAmplitude = dropShapeUniforms.uWaveAmplitude;
      shader.uniforms.uWaveFrequency = dropShapeUniforms.uWaveFrequency;
      shader.uniforms.uWaveSpeed = dropShapeUniforms.uWaveSpeed;
      shader.uniforms.uTwist = dropShapeUniforms.uTwist;
      shader.uniforms.uTwistFrequency = dropShapeUniforms.uTwistFrequency;
      shader.uniforms.uBreathing = dropShapeUniforms.uBreathing;
      shader.uniforms.uTransitionWobble = dropShapeUniforms.uTransitionWobble;
      shader.vertexShader = shader.vertexShader
        .replace(
          '#include <common>',
          `#include <common>
       uniform float uRoundness;
       uniform float uSphereRadius;
       uniform vec3 uTouchDirection;
       uniform float uTouchStrength;
       uniform float uTouchRadius;
       uniform float uTouchTime;
       uniform float uTouchWobble;
       uniform float uWaveMorph;
       uniform float uDistortion;
       uniform float uWaveAmplitude;
       uniform float uWaveFrequency;
       uniform float uWaveSpeed;
       uniform float uTwist;
       uniform float uTwistFrequency;
       uniform float uBreathing;
       uniform float uTransitionWobble;`
        )
        .replace(
          '#include <beginnormal_vertex>',
          `#include <beginnormal_vertex>
       objectNormal=normalize(mix(
         objectNormal,
         normalize(position),
         mix(1.,uRoundness,uWaveMorph)
       ));`
        )
        .replace(
          '#include <begin_vertex>',
          `#include <begin_vertex>
       float activeMorph=max(
         uWaveMorph,
         clamp(uTransitionWobble*.55,0.,1.)
       );
       float shapeRoundness=mix(1.,uRoundness,activeMorph);
       transformed=mix(
         transformed,
         normalize(position)*uSphereRadius,
         shapeRoundness
       );
       vec3 touchNormal=normalize(transformed);
       float waveTime=uTouchTime*uWaveSpeed;
       float waveA=sin(
         (touchNormal.x+touchNormal.y*.72+touchNormal.z*.36)
         *uWaveFrequency*3.14159+waveTime
       );
       float waveB=sin(
         (touchNormal.z-touchNormal.y*.54-touchNormal.x*.28)
         *uWaveFrequency*4.72-waveTime*1.31
       );
       float transitionGain=1.+uTransitionWobble*3.2;
       float radialWave=(waveA*.64+waveB*.36)
         *uWaveAmplitude*uDistortion*activeMorph*transitionGain;
       radialWave+=sin(waveTime*.72)
         *uBreathing*uDistortion*activeMorph;
       vec3 twistTangent=normalize(vec3(
         -touchNormal.z,
         sin(touchNormal.x*uTwistFrequency*5.+waveTime)*.28,
         touchNormal.x
       ));
       float twistWave=sin(
         touchNormal.y*uTwistFrequency*4.2+waveTime*.86
       )*uTwist*uDistortion*activeMorph*transitionGain;
       transformed+=touchNormal*radialWave*uSphereRadius;
       transformed+=twistTangent*twistWave*uSphereRadius;
       touchNormal=normalize(transformed);
       float touchDistance=length(touchNormal-normalize(uTouchDirection));
       float touchWidth=max(uTouchRadius,.04);
       float touchMask=exp(-(touchDistance*touchDistance)/(touchWidth*touchWidth));
       float touchRing=sin(touchDistance*17.-uTouchTime*7.5)
         * exp(-touchDistance*3.1);
       float touchDisplacement=(-touchMask*.31+touchRing*.048)
         * uTouchStrength*uSphereRadius;
       transformed+=touchNormal*touchDisplacement;
       /* Energy left in the bead after a shove. The membrane rings on
          three crossed axes and settles, which is what reads as water
          rather than as rubber. */
       float wobble=sin(dot(touchNormal,normalize(uTouchDirection))*4.6
           -uTouchTime*9.4)
         +.58*sin(touchNormal.y*6.8+uTouchTime*7.1)
         +.42*sin(touchNormal.x*5.4-uTouchTime*11.3);
       transformed+=touchNormal*wobble*uTouchWobble*.048*uSphereRadius;`
        );
    };
    dropMaterial.customProgramCacheKey = () => `drop-distortion-transition-v4`;
    const dropRoot = new THREE.Group();
    dropRoot.name = 'drop-controls';
    scene.add(dropRoot);
    gltfLoader.load('drop_of_water/scene.gltf', gltf => {
      const meshes = [];
      gltf.scene.traverse(child => { if (child.isMesh) meshes.push(child); });
      const sourceMesh = meshes[0];
      if (!sourceMesh) return;

      /* Bake the visible mesh's complete GLTF transform into its geometry.
         The asset also contains two offset satellite meshes; fitting the
         whole scene made those hidden objects shift the apparent pivot. */
      gltf.scene.updateMatrixWorld(true);
      const centredGeometry = sourceMesh.geometry.clone();
      centredGeometry.applyMatrix4(sourceMesh.matrixWorld);
      centredGeometry.computeBoundingBox();
      const geometryCenter = new THREE.Vector3();
      centredGeometry.boundingBox.getCenter(geometryCenter);
      centredGeometry.translate(
        -geometryCenter.x,
        -geometryCenter.y,
        -geometryCenter.z
      );
      centredGeometry.computeBoundingBox();
      centredGeometry.computeBoundingSphere();
      centredGeometry.computeVertexNormals();

      const centredDrop = new THREE.Mesh(centredGeometry, dropMaterial);
      centredDrop.name = 'centred-water-drop';
      centredDrop.castShadow = true;
      centredDrop.renderOrder = 6;
      /* Drawn by the droplet now: kept on layer 1, where no camera or shadow
         pass looks, but still visible to the pointer's raycast. */
      if (dropSDF) centredDrop.layers.set(1);
      dropRoot.add(fitAsset(centredDrop, 2.72, false));
      /* The gather draws the cluster in this mesh's place and hands over to
         it once there is one drop left, so it needs to be able to hide it
         without hiding the motes and glows that share the group. */
      dropRoot.userData.orbMesh = centredDrop;
      syncOrbVisibility();
    }, undefined, error => console.error('Droplet model:', error));

    /* ------------------------------------------------------------------
       LIGHTING
       ------------------------------------------------------------------ */
    const hemiLight = new THREE.HemisphereLight(0xeaf7ff, 0x566f7e, .54);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffede7, 2.75);
    keyLight.position.set(-10, 9, -3);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -28;
    keyLight.shadow.camera.right = 28;
    keyLight.shadow.camera.top = 22;
    keyLight.shadow.camera.bottom = -12;
    keyLight.shadow.camera.near = .5;
    keyLight.shadow.camera.far = 72;
    keyLight.shadow.bias = -.00015;
    keyLight.shadow.normalBias = .025;
    scene.add(keyLight);

    const coolFill = new THREE.DirectionalLight(0xbde6f7, .58);
    coolFill.position.set(13, 8, 5);
    scene.add(coolFill);

    const backLight = new THREE.PointLight(0xffd8cf, 2.6, 22, 1.9);
    backLight.position.set(.3, 5.2, -11);
    scene.add(backLight);

    /* ------------------------------------------------------------------
       GLASS ORB
       ------------------------------------------------------------------ */
    const orbGroup = new THREE.Group();
    orbGroup.position.set(0, 4.22, -7.0);
    orbGroup.visible = false;
    scene.add(orbGroup);

    const orbMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xf8fdff,
      metalness: 0,
      roughness: .006,
      transmission: 1,
      ior: 1.49,
      thickness: 1.95,
      attenuationColor: new THREE.Color('#d6edf6'),
      attenuationDistance: 10.5,
      specularIntensity: 1,
      specularColor: new THREE.Color('#ffffff'),
      envMapIntensity: 1.08,
      clearcoat: 1,
      clearcoatRoughness: .025,
      iridescence: .08,
      iridescenceIOR: 1.28,
      transparent: true,
      opacity: 1,
      side: THREE.DoubleSide
    });
    const orb = new THREE.Mesh(new THREE.SphereGeometry(1.36, 128, 96), orbMaterial);
    orb.castShadow = true;
    orb.renderOrder = 4;
    orbGroup.add(orb);

    /* The reference has a distinct inverted dune mass inside the upper half
       of the glass. This interior layer is deliberately subtle: the physical
       sphere still supplies the refraction, while this shape gives the bent
       landscape enough tonal separation to remain visible in a pale scene. */
    const refractedDuneMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.FrontSide,
      uniforms: {
        uTime: { value: 0 },
        uDeep: { value: new THREE.Color('#244e64') },
        uPale: { value: new THREE.Color('#557f90') }
      },
      vertexShader: `
    varying vec3 vLocal;
    varying vec3 vNormalW;
    void main(){
      vLocal=position;
      vNormalW=normalize(mat3(modelMatrix)*normal);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
    }
  `,
      fragmentShader: `
    uniform float uTime;
    uniform vec3 uDeep,uPale;
    varying vec3 vLocal,vNormalW;
    void main(){
      vec3 p=normalize(vLocal);
      float edge=.08
        + sin(p.x*5.2+uTime*.10)*.070
        + sin(p.x*10.4-uTime*.07)*.022;
      float cap=smoothstep(edge-.035,edge+.045,p.y);
      float crown=1.-smoothstep(.90,1.0,p.y);
      float fold=.5+.5*sin(p.x*7.0+p.y*4.0);
      float fres=pow(1.-abs(dot(normalize(vNormalW),normalize(cameraPosition))),2.);
      vec3 col=mix(uDeep,uPale,.30+fold*.24);
      float edgeLight=(1.-smoothstep(.0,.045,abs(p.y-edge)))*.36;
      float alpha=cap*crown*(.68+fold*.14)+edgeLight;
      gl_FragColor=vec4(col+vec3(.12,.20,.24)*fres,alpha);
    }
  `
    });
    const refractedDune = new THREE.Mesh(
      new THREE.SphereGeometry(1.325, 96, 72),
      refractedDuneMaterial
    );
    refractedDune.material.depthTest = false;
    refractedDune.renderOrder = 5;
    orbGroup.add(refractedDune);

    /* A thin fresnel shell adds the cyan edge visible in the reference while
       leaving the physically refracted centre untouched. */
    const rimMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uColor: { value: new THREE.Color('#9bd9ef') },
        uWarm: { value: new THREE.Color('#ffd8d0') },
        uOpacity: { value: .44 }
      },
      vertexShader: `
    varying vec3 vN;
    varying vec3 vW;
    void main(){
      vN=normalize(mat3(modelMatrix)*normal);
      vec4 world=modelMatrix*vec4(position,1.);
      vW=world.xyz;
      gl_Position=projectionMatrix*viewMatrix*world;
    }
  `,
      fragmentShader: `
    uniform vec3 uColor,uWarm;
    uniform float uOpacity;
    varying vec3 vN,vW;
    void main(){
      vec3 V=normalize(cameraPosition-vW);
      float f=pow(1.-max(dot(normalize(vN),V),0.),3.1);
      float warm=smoothstep(.40,1.,normalize(vN).y);
      vec3 col=mix(uColor,uWarm,warm*.55);
      gl_FragColor=vec4(col,f*uOpacity);
    }
  `
    });
    const rim = new THREE.Mesh(new THREE.SphereGeometry(1.375, 96, 72), rimMaterial);
    rim.renderOrder = 6;
    orbGroup.add(rim);

    function glowTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(.035, 'rgba(255,248,246,.98)');
      g.addColorStop(.12, 'rgba(255,214,204,.48)');
      g.addColorStop(.38, 'rgba(166,220,242,.13)');
      g.addColorStop(1, 'rgba(155,216,238,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 256);
      const texture = new THREE.CanvasTexture(c);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }
    const glowMap = glowTexture();
    function addGlow(position, scale, opacity) {
      const material = new THREE.SpriteMaterial({

        color: new THREE.Color().setRGB(2.15, 1.82, 1.68),
        transparent: true,
        opacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        toneMapped: false
      });

      sprite.position.copy(position);
      sprite.scale.setScalar(scale);
      sprite.renderOrder = 8;
      scene.add(sprite);
      return sprite;
    }
    const glowTop = addGlow(new THREE.Vector3(-.23, 5.43, -5.72), .38, .46);
    const glowFoot = addGlow(new THREE.Vector3(.08, 2.91, -5.82), .44, .52);
    const transitionGlow = addGlow(
      new THREE.Vector3(CONFIG.drop.x, CONFIG.physics.waterY + .08, CONFIG.drop.z + .16),
      .16,
      0
    );
    /* 比例 1 : 0.982 : 1.079，色度大約 (x .309, y .318)，比 D65 冷一點點
       ——是「帶藍的白」。原本的 1 : 1.209 : 1.349 太藍，穿過 Neutral 色調
       映射之後會落成青灰色，那正是這一頁最不能出現的顏色。 */
    /* 再修正一次：2.28/2.24/2.46 這個量級穿過 Neutral 色調映射之後仍是純
       白。1.88/1.70/2.16 是一個真正的紫，而且給色調映射留了餘裕；它在深
       度上站在珠子後面，所以珠子會擋住它、得到真正的逆光剪影。 */
    transitionGlow.material.color.setRGB(1.88, 1.70, 2.16);
    transitionGlow.renderOrder = 13;
    const transitionScreen = new THREE.Vector3();

    function seeded(index, salt = 0) {
      return Math.abs(Math.sin(index * 91.731 + salt * 47.117) * 43758.5453) % 1;
    }

    function makeLightPointMaterial(color, depthTest = false) {
      return new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        depthTest,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uTime: { value: 0 },
          uOpacity: { value: 1 },
          uSize: { value: 1 },
          uSpeed: { value: 1 },
          uTransition: { value: 0 },
          uColor: { value: new THREE.Color(color) }
        },
        vertexShader: `
      attribute float aSeed;
      attribute vec3 aDrift;
      uniform float uTime,uSize,uSpeed,uTransition;
      varying float vTwinkle;
      void main(){
        float t=uTime*uSpeed;
        vec3 pos=position;
        pos+=aDrift*sin(t*(.46+aSeed*.7)+aSeed*18.)*.085;
        pos+=aDrift*uTransition*(.45+aSeed*2.8);
        vec4 mv=modelViewMatrix*vec4(pos,1.);
        vTwinkle=.26+.74*pow(
          .5+.5*sin(t*(1.4+aSeed*2.1)+aSeed*32.),
          4.
        );
        gl_PointSize=clamp(
          uSize*mix(1.1,4.4,aSeed)*vTwinkle*(36./max(1.,-mv.z)),
          .8,
          10.
        );
        gl_Position=projectionMatrix*mv;
      }
    `,
        fragmentShader: `
      precision highp float;
      uniform float uOpacity;
      uniform vec3 uColor;
      varying float vTwinkle;
      void main(){
        float d=length(gl_PointCoord-.5);
        float halo=smoothstep(.5,.08,d)*.24;
        float core=smoothstep(.18,.0,d);
        gl_FragColor=vec4(uColor,(core+halo)*vTwinkle*uOpacity);
      }
    `
      });
    }

    function makePointCloud(count, positionFactory, color, depthTest = false) {
      const positions = new Float32Array(count * 3);
      const seeds = new Float32Array(count);
      const drifts = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const position = positionFactory(i);
        positions.set([position.x, position.y, position.z], i * 3);
        seeds[i] = seeded(i, 7);
        const drift = new THREE.Vector3(
          seeded(i, 2) - .5,
          seeded(i, 3) - .5,
          seeded(i, 5) - .5
        ).normalize();
        drifts.set([drift.x, drift.y, drift.z], i * 3);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
      geometry.setAttribute('aDrift', new THREE.BufferAttribute(drifts, 3));
      const material = makeLightPointMaterial(color, depthTest);
      const points = new THREE.Points(geometry, material);
      points.frustumCulled = false;
      points.renderOrder = 9;
      return points;
    }

    const dropMotes = makePointCloud(
      190,
      index => {
        const theta = seeded(index, 11) * Math.PI * 2;
        const y = (seeded(index, 13) - .5) * 3.8;
        const radius = 1.7 + seeded(index, 17) * 1.9;
        return new THREE.Vector3(
          Math.cos(theta) * radius,
          y,
          Math.sin(theta) * radius
