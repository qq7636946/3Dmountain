      logoRoot.updateWorldMatrix(true,true);
      // Dolly along the emblem centre, without the previous lateral sweep.
      logoFocus.copy(logoRoot.position);
      const flight=reduceMotion?0:logoFlight.t;
      const fly=easeJourney(flight);
      const aim=easeJourney(flight/.25);
      camera.position.set(
        THREE.MathUtils.lerp(CONFIG.camera.x,logoFocus.x,aim)+pointerSoft.x*.18*parallax,
        THREE.MathUtils.lerp(CONFIG.camera.y,logoFocus.y,aim)-pointerSoft.y*.07*parallax,
        THREE.MathUtils.lerp(CONFIG.camera.z,CONFIG.drop.z+1.25,fly));
      camera.up.set(0,1,0);
      // Keep the optical axis facing forward during enlargement.
      camera.lookAt(
        THREE.MathUtils.lerp(cameraLook.x,logoFocus.x,aim)+pointerSoft.x*.08*parallax,
        THREE.MathUtils.lerp(cameraLook.y,logoFocus.y,aim)-pointerSoft.y*.04*parallax,
        THREE.MathUtils.lerp(cameraLook.z,logoFocus.z-30,aim));
      camera.fov=CONFIG.camera.fov+(innerWidth<760?8:0)+CONFIG.forwardTransition.fov*easeJourney(flight);
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld();
      // The water fan follows the final camera, without a one-frame gap.
      sea.position.set(camera.position.x,0,camera.position.z);
      sea.updateMatrixWorld();
      // Apply CSS-pixel offsets to the emblem alone, in the final camera plane.
      // Positive X moves right; positive Y moves down. Water and UI do not move.
      if(logoRoot.visible){
        logoFocusNDC.copy(logoRoot.position).applyMatrix4(camera.matrixWorldInverse);
        const unitsPerPixel=2*Math.max(.1,-logoFocusNDC.z)*Math.tan(THREE.MathUtils.degToRad(camera.fov*.5))/Math.max(1,innerHeight);
        logoScreenRight.setFromMatrixColumn(camera.matrixWorld,0);
        logoScreenUp.setFromMatrixColumn(camera.matrixWorld,1);
        logoRoot.position.addScaledVector(logoScreenRight,CONFIG.logoFraming.x*unitsPerPixel)
          .addScaledVector(logoScreenUp,-CONFIG.logoFraming.y*unitsPerPixel);
        logoRoot.updateWorldMatrix(true,true);
      }
      logoFocus.copy(logoRoot.position);
      logoFocusNDC.copy(logoFocus).project(camera);
      logoFlight.cx=logoFocusNDC.x*.5+.5;logoFlight.cy=logoFocusNDC.y*.5+.5;
      sea.visible=true;
      canyon.update(THREE.MathUtils.clamp((p-1.404)/(8-1.404),0,1),time,reduceMotion,THREE.MathUtils.clamp((p-6.4)/(11.8-6.4),0,1),THREE.MathUtils.clamp((p-11.8)/2,0,1));
      // The blur follows the river's forward view, not the opening scene camera.
      const flowAmount=journey.mix*(1-easeJourney((p-6.1)/.7));
      /* 速度量測用 canyon.update() 放好的鏡頭位置（還沒加下面的傾身），之後的一切都跟著它停。 */
      const CM=CONFIG.canyonMotion;
      const speedCue=canyonMotion.measure({camera:canyon.camera,amount:flowAmount,dt:flightDelta,reducedMotion:reduceMotion});
      if(!reduceMotion&&speedCue.envelope>0){
        /* 鏡頭語言：快時視角略為張開（≤ 2–3°）、機頭朝前進方向微微壓低、貼水的細微震動。
           都只是顯示用的偏移：canyon.update() 每一幀重設 fov 與朝向，所以不會累積。 */
        const env=speedCue.envelope*flowAmount;
        const arcS=THREE.MathUtils.clamp((p-1.404)/(8-1.404),0,1)*.865*canyon.stats.pathLength;
        canyon.camera.fov+=CM.fovBreath*env;
        canyon.camera.rotateX(THREE.MathUtils.degToRad(-CM.pitch*speedCue.lean*flowAmount+CM.chatter*env*(Math.sin(arcS*.045)*.6+Math.sin(arcS*.11+1.3)*.4)));
        canyon.camera.rotateZ(THREE.MathUtils.degToRad(CM.chatter*env*.8*Math.sin(arcS*.07+.4)));
        canyon.camera.updateProjectionMatrix();
      }
      /* 河水跟著滾動加速：海的時鐘多走「滾過的距離 × 水流加速」，是 progress 的純函數，
         往回滾就倒回去、停下就回到原本流速；mix = 0（開場海面）時為 0。 */
      if(!reduceMotion)seaUniforms.uSeaTime.value+=CM.flowBoost*(THREE.MathUtils.clamp(p,1.404,6.8)-1.404)*journey.mix;
      const route=THREE.MathUtils.clamp((p-1.404)/(8-1.404),0,1)*.865;
      canyon.curve.getPointAt(Math.min(1,route+80/canyon.stats.pathLength),flowFocus);
      flowFocus.y=2.9;
      canyon.camera.updateMatrixWorld();
      flowFocus.project(canyon.camera);
      const clockT=THREE.MathUtils.clamp((journey.progress-logoChapterEnd())/forwardLength(),0,1);
      const clockSlope=forwardLength()/.572;
      const clockDerivative=clockT>=1?1:clockT<=0?0:.572/forwardLength()*(3*(clockSlope-2)*clockT*clockT+2*(3-clockSlope)*clockT);
      forwardTransition.update({progress:logoFlight.t,velocity:journey.velocity,
        centerX:logoFlight.cx,centerY:logoFlight.cy,mix:journey.mix,
        flowAmount,flowVelocity:journey.velocity*clockDerivative,
        flowCenterX:THREE.MathUtils.clamp(flowFocus.x*.5+.5,.25,.75),
        flowCenterY:THREE.MathUtils.clamp(flowFocus.y*.5+.5,.30,.70),
        aspect:innerWidth/Math.max(1,innerHeight),dt:flightDelta,
        reducedMotion:reduceMotion,enabled:CONFIG.logo.dolly>.5||journey.mix>0});
      // The opening water's 55–150 unit horizon is a close-up range. Extend
      // that same haze with altitude, so distant rivers retain moving reflections.
      const waterHazeScale=1+Math.max(0,canyon.camera.position.y-2.5)/32*easeJourney((p-6.4)/1.1);
      seaUniforms.uHaze.value.set(CONFIG.sea.haze*waterHazeScale,CONFIG.sea.hazeFar*waterHazeScale);
      /* The banner's sea and the river chapters are the same metal and,
         deliberately, the same material — which means the same waves. They
         do not want the same ones. A swell tuned to fill a horizon has a
         wavelength longer than the canyon is wide, so on the river it stops
         being water and becomes one smooth pale sheet running through the
         gorge. RIVER is how much of the banner's swell is given back as the
         canyon takes over: at 1 the river keeps the sea it was authored
         with, at 0 it inherits the banner's. Driven off `mix`, which is
         already 0 wherever only the banner is drawn and 1 wherever only the
         canyon is, so the hero is never touched by it. */
      const SEA=CONFIG.sea;
      const toRiver=THREE.MathUtils.clamp(journey.mix,0,1)*SEA.river;
      writeSeaWaves(
        THREE.MathUtils.lerp(SEA.swell,2.6,toRiver),
        THREE.MathUtils.lerp(SEA.scale,1,toRiver),
        THREE.MathUtils.lerp(SEA.chop,1,toRiver),
        THREE.MathUtils.lerp(SEA.tilt,0,toRiver),
        THREE.MathUtils.lerp(SEA.crest,1,toRiver),
        SEA.round
      );
      /* A river running between rock does not throw the froth an open sea
         does, and the canyon has its own spray effects already. */
      seaUniforms.uFoam.value.x=SEA.foam*(1-toRiver);
      // The close canyon retains its mirror waves. During the aerial reveal,
      // displacement, normal contrast and the silver grade settle on one clock.
      seaUniforms.uRiverAerial.value=easeJourney((p-6.8)/2.0);
      seaUniforms.uRiverPixelAngle.value=2*Math.tan(THREE.MathUtils.degToRad(canyon.camera.fov*.5))/Math.max(1,innerHeight);
      const watershedNight=easeJourney((p-6.95)/1.95);
      seaUniforms.uJourneyNight.value=watershedNight;
      seaUniforms.uRiverFogColor.value.copy(canyon.scene.fog.color);
      seaUniforms.uRiverFogParams.value.set(canyon.scene.fog.density,easeJourney(((p-6.4)/5.4-.25)/.65),CONFIG.watershedStyle.haze);
      seaUniforms.uWatershedBase.value.set(CONFIG.watershedWater.base);
      seaUniforms.uWatershedHighlight.value.set(CONFIG.watershedWater.highlight);
      seaUniforms.uWatershedReflection.value=CONFIG.watershedWater.reflection;
      {const S=CONFIG.shoreline;seaUniforms.uShore.value.set(+S.foam||0,+S.shallow||0,+S.reflect||0,1);
       seaUniforms.uShoreFoamColor.value.set(S.foamColor);
       seaUniforms.uShoreBedColor.value.set(CONFIG.watershedStyle.rockColor).lerp(seaUniforms.uWatershedHighlight.value,.45);
       seaUniforms.uShoreWallColor.value.set(CONFIG.watershedStyle.rockColor).multiplyScalar(.62).lerp(canyon.scene.fog.color,.22);}
      bloom.strength=THREE.MathUtils.lerp(bloom.strength,.30,watershedNight);
      bloom.radius=THREE.MathUtils.lerp(bloom.radius,.48,watershedNight);
      bloom.threshold=THREE.MathUtils.lerp(bloom.threshold,1.12,watershedNight);
      grainPass.uniforms.uAmount.value=CONFIG.scene.grain*(1-watershedNight*.88);
      const mix=journey.mix;
      canyon.scene.environment=scene.environment;
      mainRenderPass.scene=mix>=.999?canyon.scene:scene;
      mainRenderPass.camera=mix>=.999?canyon.camera:camera;
      journeyBlend.enabled=mix>.001&&mix<.999;
      journeyBlend.uniforms.uMix.value=mix;
      if(mix>.001){seaUniforms.uHeroOn.value=0;seaUniforms.uDropOcclude.value=0;}
      canyonMotion.apply({camera:canyon.camera,renderer});
      canyonMotes.update({arc:route,shiftWorld:canyonMotion.shiftWorld,envelope:speedCue.envelope,amount:flowAmount,gain:CM.motes,trail:CM.moteTrail,renderer,reducedMotion:reduceMotion});
      if(journeyBlend.enabled){const target=renderer.getRenderTarget();renderer.setRenderTarget(canyonTarget);renderer.render(canyon.scene,canyon.camera);renderer.setRenderTarget(target);}


    }

    for(const material of [waterGlints.material,sprayMaterial,pointerSprayMaterial,impactRingMaterial])lowerSurfaceMaterial(material);

    /* ------------------------------------------------------------------
       LIVE TUNING
       ------------------------------------------------------------------ */
    /* 介面毛玻璃：只在數值真的變了才寫 :root 變數（自訂屬性會讓全頁重算樣式，但不重排）。 */
    const uiGlassWritten = {};
    function applyUiGlass() {
      const G = CONFIG.uiGlass, s = document.documentElement.style;
      const vars = {
        '--uig-blur': G.blur + 'px', '--uig-sat': G.saturate, '--uig-bright': G.brightness,
        '--uig-tint': G.tint, '--uig-fill': G.fill, '--uig-hi': G.highlight, '--uig-shade': G.shade,
        '--uig-sheen': G.sheen, '--uig-border': G.border, '--uig-shadow': G.shadow,
        '--uig-menu-blur': G.menuBlur + 'px', '--uig-menu-fill': G.menuFill,
        '--uig-veil': G.veil, '--uig-veil-blur': G.veilBlur + 'px'
      };
      for (const k in vars) {
        const v = String(vars[k]);
        if (uiGlassWritten[k] !== v) { s.setProperty(k, v); uiGlassWritten[k] = v; }
      }
    }
    function applyConfig() {
      applyUiGlass();
      riverRoot.position.set(CONFIG.water.x, CONFIG.water.y, CONFIG.water.z);
      riverRoot.rotation.set(CONFIG.water.rx, CONFIG.water.ry, CONFIG.water.rz);
      riverRoot.scale.set(CONFIG.water.sx, CONFIG.water.sy, CONFIG.water.sz);
      riverUniforms.uOpacity.value = CONFIG.water.opacity;
      riverUniforms.uWaveHeight.value = CONFIG.water.waveHeight;
      riverUniforms.uWaveSpeed.value = CONFIG.water.waveSpeed;
      water.position.set(CONFIG.water.x, CONFIG.water.y - .045, CONFIG.water.z);
      waterVeil.position.set(CONFIG.water.x, CONFIG.water.y - .025, CONFIG.water.z);
      water.material.uniforms.alpha.value = Math.min(.94, CONFIG.water.opacity + .28);

      dropRoot.position.set(CONFIG.drop.x, CONFIG.drop.y, CONFIG.drop.z);
      dropRoot.rotation.set(CONFIG.drop.rx, CONFIG.drop.ry, CONFIG.drop.rz);
      dropRoot.scale.setScalar(CONFIG.drop.scale);
      dropShapeUniforms.uRoundness.value = CONFIG.drop.roundness;
      dropShapeUniforms.uTouchRadius.value = CONFIG.physics.touchRadius;
      dropShapeUniforms.uWaveMorph.value = CONFIG.distortion.waveMorph;
      dropShapeUniforms.uDistortion.value = CONFIG.distortion.amount;
      dropShapeUniforms.uWaveAmplitude.value = CONFIG.distortion.waveAmplitude;
      dropShapeUniforms.uWaveFrequency.value = CONFIG.distortion.waveFrequency;
      dropShapeUniforms.uWaveSpeed.value = CONFIG.distortion.waveSpeed;
      dropShapeUniforms.uTwist.value = CONFIG.distortion.twist;
      dropShapeUniforms.uTwistFrequency.value = CONFIG.distortion.twistFrequency;
      dropShapeUniforms.uBreathing.value = CONFIG.distortion.breathing;
      dropMotes.material.uniforms.uOpacity.value = CONFIG.details.motes;
      dropMotes.material.uniforms.uSize.value = CONFIG.details.moteSize;
      dropMotes.material.uniforms.uSpeed.value = CONFIG.details.moteSpeed;
      waterGlints.material.uniforms.uOpacity.value = CONFIG.details.waterGlints;
      waterGlints.material.uniforms.uSize.value = CONFIG.details.glintSize;
      waterGlints.material.uniforms.uSpeed.value = CONFIG.details.moteSpeed * .72;
      waterGlints.position.y = CONFIG.water.y;
      dropMaterial.roughness = CONFIG.drop.roughness;
      dropMaterial.thickness = CONFIG.drop.thickness;
      dropMaterial.transmission = CONFIG.drop.transmission;
      /* The gather's beads are the same glass as the orb they become. */
      clusterMaterial.roughness = CONFIG.drop.roughness;
      clusterMaterial.thickness = CONFIG.drop.thickness;
      clusterMaterial.transmission = CONFIG.drop.transmission;
      /* The droplet wears the same glass. The glass reaches the screen with
         weight (1-MATCH)*(1-INK) in the older look and MATCH*CLARITY in the
         water; when both are 0 the refraction, and the extra opaque render of
         the scene (and of the mirror) it costs every frame, is switched off.
         Otherwise transmission never reaches 0. */
      dropletMaterial.roughness = CONFIG.drop.roughness;
      {
        const D = CONFIG.droplet;
        const m = THREE.MathUtils.clamp(D.match, 0, 1);
        const glassShows = (1 - m) * (1 - THREE.MathUtils.clamp(D.ink, 0, 1)) > .001
          || m * THREE.MathUtils.clamp(D.clarity, 0, 1) > .001;
        dropletMaterial.transmission = glassShows ? Math.max(.001, CONFIG.drop.transmission) : 0;
        dropletUniforms.uClarity.value = THREE.MathUtils.clamp(D.clarity, 0, 1);
      }
      dropletUniforms.uMatch.value = CONFIG.droplet.match;
      dropletUniforms.uExposure.value = CONFIG.scene.exposure;
      {
        /* WATER blends the demo's palette into the lake's; the hex colours are
           read as display values, as the demo's own numbers are. */
        const D = CONFIG.droplet;
        const water = THREE.MathUtils.clamp(D.water, 0, 1);
        const rgb = hex => {
          const n = parseInt(String(hex).replace('#', ''), 16) || 0;
          return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
        };
        const glow = rgb(D.glowColor), sheen = rgb(D.sheenColor), body = rgb(D.bodyColor);
        const bodyAmount = water * THREE.MathUtils.clamp(D.body, 0, 1);
        dropletUniforms.uTint0.value.set(
          .1765 + (glow[0] - .1765) * water, .1255 + (glow[1] - .1255) * water, .2275 + (glow[2] - .2275) * water);
        dropletUniforms.uTint1.value.set(
          .4118 + (sheen[0] - .4118) * water, .4118 + (sheen[1] - .4118) * water, .4157 + (sheen[2] - .4157) * water);
        dropletUniforms.uBody.value.set(body[0] * bodyAmount, body[1] * bodyAmount, body[2] * bodyAmount);
      }
      dropletUniforms.uInk.value = CONFIG.droplet.ink;
      dropletUniforms.uSheen.value = CONFIG.droplet.sheen;
      dropletUniforms.uContrast.value = CONFIG.droplet.contrast;
      dropletUniforms.uNoiseScale.value = CONFIG.droplet.noiseScale;
      dropletUniforms.uSheenGain.value = 1 / Math.max(.2, CONFIG.scene.exposure);
      riverUniforms.uImpactStrength.value = CONFIG.physics.impact;
      riverUniforms.uRippleSpeed.value = CONFIG.physics.rippleSpeed;
      riverUniforms.uRippleDamping.value = CONFIG.physics.damping;

      uRippleParams.value.set(
        CONFIG.ripple.speed,
        CONFIG.ripple.damping,
        CONFIG.ripple.strength,
        Math.PI * 2 / Math.max(.08, CONFIG.ripple.wavelength)
      );
      uRippleMirror.value = CONFIG.ripple.mirror;
      uRippleAmbient.value.set(
        CONFIG.ripple.ambient,
        CONFIG.ripple.ambientSpeed
      );
      rippleOverlay.position.set(
        CONFIG.water.x,
        CONFIG.water.y + .06,
        CONFIG.water.z
      );

      /* THE ROOM AND THE METAL
         Every colour is written as the hex it should reach the screen as and
         converted here, so the tuner reads in display values. The probe is
         rebaked on a timer, never on the slider event itself. */
      const F = CONFIG.field;
      const M = CONFIG.chrome;
      paletteLinear(F.zenith, montisEnvUniforms.uEnvZenith.value);
      paletteLinear(F.upper, montisEnvUniforms.uEnvUpper.value);
      paletteLinear(F.top, montisEnvUniforms.uEnvField.value);
      paletteLinear(F.horizon, montisEnvUniforms.uEnvHorizon.value);
      paletteLinear(F.lower, montisEnvUniforms.uEnvLower.value);
      paletteLinear(F.floor, montisEnvUniforms.uEnvFloor.value);
      paletteLinear(F.ink, montisEnvUniforms.uEnvInk.value);
      montisEnvUniforms.uEnvCore.value.set(F.core, .30 * F.coreSpread, .115 * F.coreSpread, .030 * F.coreSpread);
      montisEnvUniforms.uEnvBands.value.set(M.bands, M.bandPhase, M.bandLight, M.bandInk);
      montisEnvUniforms.uEnvRail.value.set(M.railY, M.rail);
      backdropUniforms.uBandGain.value = F.bandGain;
      backdropUniforms.uDither.value = F.dither;
      const SEA = CONFIG.sea;
      writeSeaWaves(SEA.swell, SEA.scale, SEA.chop, SEA.tilt, SEA.crest, SEA.round);
      seaUniforms.uSeaCalm.value = SEA.calm;
      seaUniforms.uTexture.value = SEA.texture;
      /* FOAM EDGE walks the whole band rather than one end of it, so the
         froth can be moved from the very tip of a breaking crest down onto
         the shoulder with one hand. */
      const foamStart = THREE.MathUtils.lerp(.58, .22, SEA.foamEdge);
      seaUniforms.uFoam.value.set(SEA.foam, foamStart, foamStart + .17);
      seaUniforms.uSpray.value.set(SEA.spray, Math.max(.05, SEA.sprayScale));
      applySeaDirs();
      seaUniforms.uDetail.value.set(SEA.detail, SEA.filament);
      seaUniforms.uRippleLift.value = SEA.lift;
      seaUniforms.uHaze.value.set(SEA.haze, SEA.hazeFar);
      seaUniforms.uRough.value = M.rough;
      seaUniforms.uDropOcclude.value = M.occlude;
      montisChromeUniforms.uChromeF0.value.set(M.f0, M.f0 * 1.036, M.f0 * 1.099);
      montisChromeUniforms.uChromeSpec.value.set(.008, M.aniso, .86, M.streak);
      montisChromeUniforms.uChromeIris.value.set(M.iris, M.irisPhase, M.irisEdge, .55);
      montisChromeUniforms.uChromeInk.value.set(M.contour, .34);
      seaUniforms.uSeaEdge.value.set(7.5, 15.0, SEA.edge);
      seaUniforms.uBandGain.value = F.bandGain;
      /* The veil is measured in frame half-heights, so it follows the lens. */
      montisVeilUniforms.uVeilHalf.value = Math.tan(CONFIG.camera.fov * .5 * Math.PI / 180);
      /* The hero's own metal. Neutral silver rather than the sea's blue one,
         a sharper mirror, and the iridescence spread into the body instead of
         ringing the silhouette. */
      const D = CONFIG.drop;
      dropChromeUniforms.uChromeF0.value.set(D.f0, D.f0 * 1.012, D.f0 * 1.036);
      dropChromeUniforms.uChromeIris.value.set(D.iris, 2.4, D.irisEdge, .55);
      dropChromeUniforms.uChromeInk.value.set(D.contour, .34);
      dropletUniforms.uChromeRough.value = D.roughness;
      dropletUniforms.uDropBand.value = D.band;
      dropletUniforms.uDropCard.value = D.card;
      dropletUniforms.uDropRim.value.set(D.rim, D.rimEdge);
      dropletUniforms.uDropLens.value.set(D.lens, D.lensEdge);
      queueEnvBake();

      cameraLook.set(CONFIG.camera.tx, CONFIG.camera.ty, CONFIG.camera.tz);
      camera.fov = CONFIG.camera.fov;
      camera.updateProjectionMatrix();
      renderer.toneMappingExposure = CONFIG.scene.exposure;
      bloom.strength = CONFIG.scene.bloom;
      bloom.threshold = CONFIG.scene.bloomCut;
      grainPass.uniforms.uAmount.value = CONFIG.scene.grain;
      grainPass.uniforms.uSize.value = CONFIG.scene.grainSize;
      grainPass.uniforms.uSpeed.value = CONFIG.scene.grainSpeed;
      keyLight.intensity = CONFIG.scene.keyLight;
      coolFill.intensity = CONFIG.scene.fillLight;

      glowTop.position.set(CONFIG.drop.x - .23, CONFIG.drop.y + 1.21, CONFIG.drop.z + 1.28);
      glowFoot.position.set(CONFIG.drop.x + .08, CONFIG.drop.y - 1.31, CONFIG.drop.z + 1.18);
    }

    /* 面板以中文標示。每一列是 [名稱, 設定群組, 鍵名, 最小, 最大, 每step]，

    const tuningGroups = [

        ['山脊起伏','watershedTerrain','ridge',0,2,.01],
        ['岩壁細節','watershedTerrain','relief',0,2,.01],
        ['岩面紋理','shoreline','micro',0,2.5,.05],
        ['岩層層理','shoreline','strata',0,2.5,.05]
      ]],
      ['河流光線', [
        ['每河光線條數','watershedFlow','count',0,5,1],
        ['光線寬度','watershedFlow','width',.01,.14,.005],
        ['光線亮度','watershedFlow','brightness',0,2,.05],
        ['流動速度','watershedFlow','speed',0,2.5,.05],
        ['柔和光暈','watershedFlow','glow',0,1.5,.05],
        ['光線色彩','watershedFlow','color'],

       指標停住（>40 ms 沒事件）由 updateDropTouch 歸零。按下那一刻 seed 一
       次：觸控在按下前沒有 move，否則第一段位移會被除以一個很小的 dt。 */
    const _pointerHit = new THREE.Vector3();
    function samplePointerVelocity(stamp, seed) {
      const P = dropTouch;
      if (!pointerToDropPlane(_pointerHit)) return;
      if (seed || P.pointerStamp < 0) {
        P.lastPointer.set(_pointerHit.x, _pointerHit.y);
        P.pointerVelocity.set(0, 0);
        P.pointerStamp = stamp;
        return;
      }
      const dtEvent = Math.max(.004, (stamp - P.pointerStamp) / 1000);
      P.pointerStamp = stamp;
      const vx = (_pointerHit.x - P.lastPointer.x) / dtEvent;
      const vy = (_pointerHit.y - P.lastPointer.y) / dtEvent;
      P.lastPointer.set(_pointerHit.x, _pointerHit.y);
      const blend = 1 - Math.exp(-dtEvent / .008);
      P.pointerVelocity.x += (vx - P.pointerVelocity.x) * blend;
      P.pointerVelocity.y += (vy - P.pointerVelocity.y) * blend;
      const speed = P.pointerVelocity.length();
      if (speed > 40) P.pointerVelocity.multiplyScalar(40 / speed);

      waterPlane.constant = -CONFIG.physics.waterY;
      rayPointer.set(pointer.x, -pointer.y+surfaceScreenOffset.value);
      raycaster.setFromCamera(rayPointer, camera);
      if (!raycaster.ray.intersectPlane(waterPlane, target)) return false;
      /* Past the range gate the plane is only ever behind the mountains, so

    function pointerToDropPlane(target) {

    const _trailHit = new THREE.Vector3();
    function updateDropletTrail(dt) {
      const T = dropletTrail;
      if (journey.progress > .03) { T.amount=0; return; }
      const live = dropSDF
        && assetsReady
        && !reduceMotion
        && !entry.running
        && dropRoot.visible
        && dropTransition.progress < .035
        && (pointerOnCanvas || dropTouch.grabbed)
        && (T.pointerType !== 'touch' || T.touchDown || dropTouch.grabbed)
        && pointerToDropPlane(_trailHit);

        if (!T.primed) {
          for (const point of T.points) point.copy(_trailHit);
          T.prev.copy(_trailHit);
          T.acc = 0;
          T.primed = true;
        }
        T.acc += dt;
        let ticks = 0;
        while (T.acc >= 1 / 60 && ticks < 4) {
          T.acc -= 1 / 60;
          ticks++;
        }
        if (ticks >= 4) T.acc = 0;
        for (let tick = 1; tick <= ticks; tick++) {
          for (let i = T.points.length - 1; i > 0; i--)T.points[i].copy(T.points[i - 1]);
          T.points[0].lerpVectors(T.prev, _trailHit, tick / ticks);
        }
        T.points[0].copy(_trailHit);
        T.prev.copy(_trailHit);
      } else if (T.amount < .005) {
        T.primed = false;
      }
      const target = live ? 1 : 0;
      T.amount += (target - T.amount) * (1 - Math.exp(-dt * (target > T.amount ? 10 : 4)));
    }

       into children whatever their parents' flags say, so filtering hits by
       each object's own flag let the hidden sparkle sprites catch the pointer

       orb or light is then not tested at all. */
    const _dropTargets = [];
    function raycastDrop() {
      _dropTargets.length = 0;
      dropRoot.traverseVisible(object => {
        if (object !== dropRoot) _dropTargets.push(object);
      });
      return raycaster.intersectObjects(_dropTargets, false)[0] || null;
    }

    function pointerHitsDrop() {

    window.__MONTIS_STUDY__ = { canyonMotion, canyonMotes, sceneCursor, forwardTransition, logoFlight, journeyClock, logoChapterEnd, forwardLength, brandMark:{root:logoRoot,spin:logoSpin,glass:logoGlass,cards:logoCards,variants:logoVariants,get activeVariant(){return activeLogoVariant;},get mesh(){return logoMesh;}}, journey, journeyUI, brandStory, canyon, mainRenderPass, CONFIG, entry, cluster, disperseMesh, disperseSeeds, DISPERSE_SIZES, disperseMaterial, shotTime, updateDispersal, clusterMaterial, gatherState, clusterBeads, gatherCycle, dropTransition, camera, cameraLook, renderer, dropRoot, dropTouch, currentDropRadius, openSectionTwo, closeSectionTwo, skipEntry, rayHitsCluster, addFieldBall, clearField, dropSDF, dropletProxy, dropletMaterial, dropletUniforms, dropletTrail, dropletShadow, replayGather: () => { entry.running = false; entry.done = false; beginEntry(); }, step: (n = 1, dt = 1 / 60) => { for (let i = 0; i < n; i++)frame(true, dt); } };

    function resize() {
      const width = innerWidth;
      const height = innerHeight;
      const dpr = Math.min(devicePixelRatio, 1.65);
      renderer.setPixelRatio(dpr);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.fov = CONFIG.camera.fov + (width < 760 ? 8 : 0);
      camera.updateProjectionMatrix();
      logoGlass.resize(width,height,dpr);
      sceneCursor.resize(width,height);
      composer.setPixelRatio(dpr);
      composer.setSize(width, height);
      bloom.resolution.set(width * dpr, height * dpr);
      canyon.resize(width,height);
      canyonTarget.setSize(Math.round(width*Math.min(dpr,1.3)),Math.round(height*Math.min(dpr,1.3)));
    }
    addEventListener('resize', resize, { passive: true });
    resize();
    warmJourney().catch(error=>console.warn('Scene warmup failed',error));
