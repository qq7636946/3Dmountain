      },
      '#d9f6ff',
      false
    );
    dropMotes.material.uniforms.uOpacity.value = CONFIG.details.motes;
    dropMotes.material.uniforms.uSize.value = CONFIG.details.moteSize;
    dropRoot.add(dropMotes);

    const waterGlints = makePointCloud(
      250,
      index => new THREE.Vector3(
        (seeded(index, 21) - .5) * 58,
        .055 + seeded(index, 23) * .16,
        3 - seeded(index, 29) * 37
      ),
      '#b9ebff',
      true
    );
    waterGlints.material.uniforms.uOpacity.value = CONFIG.details.waterGlints;
    waterGlints.material.uniforms.uSize.value = CONFIG.details.glintSize;
    waterGlints.renderOrder = 4;
    scene.add(waterGlints);

    /* Scene-wide drifting specks, ported from the chapter build: fine dust
       catching the light across the whole valley, not only around the drop. */
    const airMotes = makePointCloud(
      420,
      index => new THREE.Vector3(
        (seeded(index, 101) - .5) * 52,
        .4 + seeded(index, 103) * 13.5,
        6 - seeded(index, 107) * 40
      ),
      '#eafaff',
      true
    );
    airMotes.material.uniforms.uOpacity.value = .30;
    airMotes.material.uniforms.uSize.value = .62;
    airMotes.material.uniforms.uSpeed.value = .5;
    airMotes.renderOrder = 4;
    scene.add(airMotes);

    function addOrbHighlight(position, scale, opacity) {
      const material = new THREE.SpriteMaterial({
        map: glowMap,
        color: 0xe9fbff,
        transparent: true,
        opacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: false,
        toneMapped: false
      });
      const sprite = new THREE.Sprite(material);
      sprite.position.copy(position);
      sprite.scale.setScalar(scale);
      sprite.renderOrder = 10;
      dropRoot.add(sprite);
      return sprite;
    }
    const orbHighlights = [
      addOrbHighlight(new THREE.Vector3(-.34, .74, 1.02), .36, .92),
      addOrbHighlight(new THREE.Vector3(.58, .18, .96), .25, .76),
      addOrbHighlight(new THREE.Vector3(-.08, -.72, .98), .20, .68),
      addOrbHighlight(new THREE.Vector3(.16, .42, 1.08), .14, .58)
    ];

    const dropOrbitGroup = new THREE.Group();
    dropOrbitGroup.name = 'drop-sparkle-details';
    dropRoot.add(dropOrbitGroup);

    const orbitSatellites = [];
    for (let i = 0; i < 18; i++) {
      const material = new THREE.SpriteMaterial({
        map: glowMap,
        color: i % 5 === 0 ? 0xc9ffcf : 0xc6f3ff,
        transparent: true,
        opacity: .72,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: false,
        toneMapped: false
      });
      material.userData.baseOpacity = .72 + seeded(i, 41) * .46;
      const satellite = new THREE.Sprite(material);
      const size = .105 + seeded(i, 43) * .155;
      satellite.scale.setScalar(size);
      satellite.userData = {
        phase: seeded(i, 47) * Math.PI * 2,
        speed: .38 + seeded(i, 53) * .74,
        radius: 1.58 + seeded(i, 59) * .88,
        flatten: .34 + seeded(i, 61) * .48,
        tilt: (seeded(i, 67) - .5) * 1.35,
        size
      };
      satellite.renderOrder = 12;
      orbitSatellites.push(satellite);
      dropOrbitGroup.add(satellite);
    }

    const impactRingMaterial = new THREE.MeshBasicMaterial({
      color: 0xc9f0ff,
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const impactRing = new THREE.Mesh(
      new THREE.RingGeometry(.86, 1.0, 96),
      impactRingMaterial
    );
    impactRing.rotation.x = -Math.PI / 2;
    impactRing.renderOrder = 7;
    impactRing.visible = false;
    scene.add(impactRing);
    const impactRingSecondaryMaterial = impactRingMaterial.clone();
    const impactRingSecondary = new THREE.Mesh(
      impactRing.geometry,
      impactRingSecondaryMaterial
    );
    impactRingSecondary.rotation.x = -Math.PI / 2;
    impactRingSecondary.renderOrder = 7;
    impactRingSecondary.visible = false;
    scene.add(impactRingSecondary);

    const splashMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xc9effb,
      roughness: .045,
      transmission: .88,
      thickness: .18,
      ior: 1.33,
      transparent: true,
      opacity: 0,
      depthWrite: false
    });
    const splashGroup = new THREE.Group();
    const splashParticles = [];
    const splashGeometry = new THREE.SphereGeometry(.075, 12, 8);
    /* Two tiers, following the chapter build's burst: a main crown of
       droplets plus a second wave of finer, faster shards flung higher. */
    for (let i = 0; i < 30; i++) {
      const fine = i >= 16;
      const particle = new THREE.Mesh(splashGeometry, splashMaterial);
      particle.visible = false;
      particle.userData.velocity = new THREE.Vector3();
      particle.userData.seed = i / 30;
      particle.userData.transitionAngle =
        ((i % 16) / 16) * Math.PI * 2 + seeded(i, 73) * (fine ? .9 : .32);
      particle.userData.transitionSpeed =
        (.72 + seeded(i, 79) * 1.12) * (fine ? 1.65 : 1);
      particle.userData.transitionLift =
        (1.18 + seeded(i, 83) * 1.34) * (fine ? 1.42 : 1);
      particle.userData.transitionDelay =
        seeded(i, 89) * .10 + (fine ? .045 : 0);
      particle.userData.transitionScale =
        (.54 + seeded(i, 97) * .72) * (fine ? .38 : 1);
      splashParticles.push(particle);
      splashGroup.add(particle);
    }
    scene.add(splashGroup);

    /* One-shot radial spray: a cloud of additive micro-droplets that
       explodes outward on impact and falls back under gravity. */
    const sprayCount = 120;
    const sprayMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uAge: { value: 99 },
        uOpacity: { value: 0 },
        uCenter: {
          value: new THREE.Vector3(
            CONFIG.drop.x, CONFIG.physics.waterY + .05, CONFIG.drop.z
          )
        },
        uGravity: { value: CONFIG.physics.gravity },
        uColor: { value: new THREE.Color('#dff7ff') }
      },
      vertexShader: `
    attribute vec3 aDir;
    attribute float aSpeed;
    attribute float aSeed;
    uniform float uAge;
    uniform vec3 uCenter;
    uniform float uGravity;
    varying float vLife;
    void main(){
      float age=max(uAge-aSeed*.16,0.);
      float life=(1.-smoothstep(.5,1.2,age))*step(.0001,age);
      vLife=life;
      vec3 pos=uCenter+aDir*aSpeed*age;
      pos.y-=uGravity*.52*age*age;
      vec4 mv=modelViewMatrix*vec4(pos,1.);
      gl_PointSize=clamp(
        (1.5+aSeed*3.6)*(30./max(1.,-mv.z))*(1.-age*.32),
        .6,
        9.
      );
      gl_Position=projectionMatrix*mv;
    }
  `,
      fragmentShader: `
    precision highp float;
    uniform vec3 uColor;
    uniform float uOpacity;
    varying float vLife;
    void main(){
      float d=length(gl_PointCoord-.5);
      float a=smoothstep(.5,.06,d)*vLife*uOpacity;
      gl_FragColor=vec4(uColor,a);
    }
  `
    });
    {
      const positions = new Float32Array(sprayCount * 3);
      const dirs = new Float32Array(sprayCount * 3);
      const speeds = new Float32Array(sprayCount);
      const seeds = new Float32Array(sprayCount);
      for (let i = 0; i < sprayCount; i++) {
        const theta = seeded(i, 301) * Math.PI * 2;
        const radial = .35 + seeded(i, 307) * .65;
        const dir = new THREE.Vector3(
          Math.cos(theta) * radial,
          .6 + seeded(i, 311) * 1.25,
          Math.sin(theta) * radial
        ).normalize();
        dirs.set([dir.x, dir.y, dir.z], i * 3);
        speeds[i] = 1.1 + seeded(i, 313) * 2.3;
        seeds[i] = seeded(i, 317);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('aDir', new THREE.BufferAttribute(dirs, 3));
      geometry.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));
      geometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
      const spray = new THREE.Points(geometry, sprayMaterial);
      spray.frustumCulled = false;
      spray.renderOrder = 9;
      scene.add(spray);
    }

    /* A low, wide mist puff that blooms at the waterline on impact. */
    const mistPuff = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowMap,
      color: 0xdcf4ff,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      toneMapped: false
    }));
    mistPuff.position.set(
      CONFIG.drop.x,
      CONFIG.physics.waterY + .30,
      CONFIG.drop.z + .30
    );
    mistPuff.renderOrder = 9;
    scene.add(mistPuff);

    /* The valley's weather went with the valley: no light shafts, no mist
       banks, no birds. What moves in the air now is sparkle, built with the
       luminous field below. */

    /* ------------------------------------------------------------------
       POST PROCESSING
       ------------------------------------------------------------------ */
    const renderTarget = new THREE.WebGLRenderTarget(innerWidth, innerHeight, {
      type: THREE.HalfFloatType,
      format: THREE.RGBAFormat,
      depthBuffer: true,
      stencilBuffer: false,
      samples: 4
    });
    const composer = new EffectComposer(renderer, renderTarget);
    const mainRenderPass = new RenderPass(scene, camera);
    composer.addPass(mainRenderPass);
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(innerWidth, innerHeight),
      .20,
      .40,
      1.08
    );
    /* Wider, because the hero's rim and the light just outside its silhouette
       land within a hundredth of each other: bloom spill is the only thing
       that separates the edge of the ball from the lamp behind it. */
    bloom.radius = .58;
    /* Measured against this plate: the field peaks near 1.7 and the broad sea
       near 1.8, the razor crests reach about 2.5 and the core sits far above
       them. A cut at 2.25 lets the crests and the core glow and leaves the
       field alone; at the old 1.08 the whole plate blooms into milk. */
    bloom.threshold = CONFIG.scene.bloomCut;
    bloom.strength = CONFIG.scene.bloom;
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    /* ------------------------------------------------------------------
       螢幕雜訊
       放在色調映射之後，所以顆粒是加在「看到的值」上，而不是加在光上。
       兩次取樣相加是三角分布，那才是底片顆粒的樣子；單次取樣會變成鹽粒。
       亮部把它收掉：真實顆粒本來就住在中間調，而這張畫面幾乎全是亮部。
       ------------------------------------------------------------------ */
    const grainPass = new ShaderPass({
      uniforms: {
        tDiffuse: { value: null },
        uAmount: { value: CONFIG.scene.grain },
        uSize: { value: CONFIG.scene.grainSize },
        uSpeed: { value: CONFIG.scene.grainSpeed },
        uTime: { value: 0 }
      },
      vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
    }
  `,
      fragmentShader: `
    precision highp float;
    uniform sampler2D tDiffuse;
    uniform float uAmount,uSize,uSpeed,uTime;
    varying vec2 vUv;
    float grainHash(vec2 p){
      return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453123);
    }
    void main(){
      vec4 c=texture2D(tDiffuse,vUv);
      vec2 p=floor(gl_FragCoord.xy/max(uSize,.35));
      float t=fract(uTime*uSpeed*24.)*57.13;
      float a=grainHash(p+t);
      float b=grainHash(p+vec2(37.7,11.3)+t*1.37);
      float g=a+b-1.;
      float luma=dot(c.rgb,vec3(.2126,.7152,.0722));
      c.rgb+=g*uAmount*mix(1.,.28,smoothstep(.55,1.,luma));
      gl_FragColor=c;
    }
  `
    });
    composer.addPass(grainPass);

    /* ------------------------------------------------------------------
       DROP / WATER PHYSICS
       A compact deterministic simulation keeps tuning reproducible: the
       authored droplet falls under gravity, merges at the water surface,
       transfers energy into a radial vertex wave, and ejects small drops.
       ------------------------------------------------------------------ */
    const dropState = {
      phase: 'idle',
      timer: 0,
      y: CONFIG.physics.startY,
      velocity: 0,
      impactAge: 99,
      impactSpeed: 0
    };
    const dropTouch = {
      hovered: false,
      grabbed: false,
      pointerId: -1,
      strength: 0,
      direction: new THREE.Vector3(0, 0, 1),
      offset: new THREE.Vector2(),
      /* Where on the bead the grab landed, so a drag does not snap its
         centre to the cursor. */
      anchor: new THREE.Vector2(),
      target: new THREE.Vector2(),
      velocity: new THREE.Vector2(),
      pointerVelocity: new THREE.Vector2(),
      lastPointer: new THREE.Vector2(),
      /* 指標速度的取樣時間戳；游標離珠心幾個半徑（凹陷深度用）；果凍長軸
         的倍角平均與角度。 */
      pointerStamp: -1,
      leanU: 9,
      jellyC: 0, jellyS: 0, jellyAngle: 0,
      wobble: 0,
      submerged: false,
      dipTimer: 0
    };
    const smooth01 = value => {
      const t = THREE.MathUtils.clamp(value, 0, 1);
      return t * t * (3 - 2 * t);
    };
    /* 鏡頭時間。dropTransition.progress 對時間不是線性的：它以
       1-exp(-t/τ) 逼近目標，τ = 1/(speed·2.25)，所以 progress 0→.39 是
       頭四分之一、.80→1.00 卻佔一大半。任何要「等速」的東西（環的擴散、
       珠子的飛行）都必須拿這個反函數當時鐘。它對 progress 單調，所以往回
       捲仍然是純函數。
       這個時鐘固定用「名義」速率 .89（τ = .4994 秒），不跟著 CONFIG 的
       SPEED 走：於是 SPEED 變成純粹的慢動作旋鈕——調低它，斷裂、飛行、光
       芒全部一起放慢，彼此的相位一格不差。SPEED .55 時真實時間是名義的
       1.6 倍：斷裂那段（p .06→.16）從 3 格變 6 格，眼睛才讀得到頸縮。 */
    const shotTime = progress => -Math.log(
      1 - Math.min(Math.max(progress, 0), .9995)
    ) / 2.0025;
    const currentDropRadius = () => THREE.MathUtils.lerp(
      1.36,
      1.20,
      CONFIG.drop.roundness
    ) * CONFIG.drop.scale;

    function clearSplash() {
      impactRing.visible = false;
      impactRingMaterial.opacity = 0;
      impactRingSecondary.visible = false;
      impactRingSecondaryMaterial.opacity = 0;
      splashMaterial.opacity = 0;
      for (const particle of splashParticles) particle.visible = false;
      sprayMaterial.uniforms.uAge.value = 99;
      sprayMaterial.uniforms.uOpacity.value = 0;
      mistPuff.material.opacity = 0;
    }

    function resetDropSimulation(startFalling = false) {
      dropState.phase = startFalling ? 'fall' : 'idle';
      dropState.timer = 0;
      dropState.y = CONFIG.physics.startY;
      dropState.velocity = 0;
      dropState.impactAge = 99;
      dropState.impactSpeed = 0;
      riverUniforms.uImpactAge.value = 99;
      dropRoot.visible = true;
      dropMaterial.opacity = 1;
      dropRoot.scale.setScalar(CONFIG.drop.scale);
      dropTouch.offset.set(0, 0);
      dropTouch.velocity.set(0, 0);
      clearSplash();
    }

    function launchDrop() {
      CONFIG.physics.enabled = 1;
      dropTouch.hovered = false;
      document.body.classList.remove('is-drop-hovered');
      resetDropSimulation(true);
    }

    function triggerWaterImpact(speed) {
      dropState.phase = 'merge';
      dropState.timer = 0;
      dropState.impactAge = 0;
      dropState.impactSpeed = THREE.MathUtils.clamp(speed / 7.5, .35, 1.45);
      dropState.velocity = 0;
      riverUniforms.uImpactAge.value = 0;
      riverUniforms.uImpactCenter.value.set(CONFIG.drop.x, CONFIG.drop.z);
      /* Share the pointer's ring field so a fall and a touch disturb the
         surface in exactly the same language. */
      spawnRipple(CONFIG.drop.x, CONFIG.drop.z, 1.15 * CONFIG.physics.impact);
      queueRipple(CONFIG.drop.x, CONFIG.drop.z, .70 * CONFIG.physics.impact, .13);

      impactRing.visible = true;
      impactRing.position.set(CONFIG.drop.x, CONFIG.physics.waterY + .035, CONFIG.drop.z);
      impactRing.scale.setScalar(.12);
      impactRingMaterial.opacity = .72 * CONFIG.physics.impact;

      splashMaterial.opacity = .82;
      splashParticles.forEach((particle, index) => {
        const angle = (index / splashParticles.length) * Math.PI * 2 + .37;
        const stagger = .72 + (index % 5) * .075;
        const speed = (1.05 + ((index * 7) % 11) / 11) * CONFIG.physics.splash;
        particle.visible = true;
        particle.position.set(
          CONFIG.drop.x + Math.cos(angle) * .10,
          CONFIG.physics.waterY + .08,
          CONFIG.drop.z + Math.sin(angle) * .10
        );
        particle.scale.setScalar(.62 + ((index * 3) % 7) / 12);
        particle.userData.velocity.set(
          Math.cos(angle) * speed * stagger,
          (1.45 + ((index * 5) % 9) / 8) * CONFIG.physics.splash,
          Math.sin(angle) * speed * stagger
        );
      });
    }

    function updateImpact(dt) {
      if (dropState.impactAge >= 12) return;
      dropState.impactAge += dt;
      const age = dropState.impactAge;
      riverUniforms.uImpactAge.value = age;

      const ringScale = .12 + age * CONFIG.physics.rippleSpeed * .78;
      impactRing.scale.setScalar(ringScale);
      impactRingMaterial.opacity = Math.max(0, .68 * Math.exp(-age * CONFIG.physics.damping));
      impactRing.visible = impactRingMaterial.opacity > .012;

      splashMaterial.opacity = Math.max(0, .80 * Math.exp(-age * 2.15));
      for (const particle of splashParticles) {
        if (!particle.visible) continue;
        particle.position.addScaledVector(particle.userData.velocity, dt);
        particle.userData.velocity.y -= CONFIG.physics.gravity * .78 * dt;
        particle.userData.velocity.x *= Math.exp(-dt * .82);
        particle.userData.velocity.z *= Math.exp(-dt * .82);
        if (particle.position.y < CONFIG.physics.waterY - .04 || age > 1.45) particle.visible = false;
      }
    }

    function updateDropPhysics(dt, time) {
      if (reduceMotion || CONFIG.physics.enabled < .5) {
        dropRoot.visible = true;
        dropMaterial.opacity = 1;
        dropRoot.position.set(
          CONFIG.drop.x + dropTouch.offset.x,
          CONFIG.drop.y + Math.sin(time * .46) * .022 + dropTouch.offset.y,
          CONFIG.drop.z
        );
        dropRoot.scale.setScalar(CONFIG.drop.scale);
        dropRoot.rotation.set(CONFIG.drop.rx, CONFIG.drop.ry, CONFIG.drop.rz);
        riverUniforms.uImpactAge.value = 99;
        clearSplash();
        return;
      }

      updateImpact(dt);
      const touchHold = dropTouch.hovered && dropState.phase === 'idle';
      if (!touchHold) dropState.timer += dt;
      const contactY = CONFIG.physics.waterY + currentDropRadius();
      let fallStretch = 0;
      let fallSway = 0;
      let fluidPulse = 0;
      let fade = 1;

      if (dropState.phase === 'idle') {
        dropState.y = CONFIG.physics.startY;
        dropState.velocity = 0;
        dropState.timer = 0;
      }

      if (touchHold) {
        dropState.velocity *= Math.exp(-dt * 10.);
      } else if (dropState.phase === 'fall') {
        dropState.velocity -= CONFIG.physics.gravity * dt;
        dropState.velocity *= Math.exp(-CONFIG.physics.airDrag * dt);
        dropState.y += dropState.velocity * dt;
        const speedRatio = THREE.MathUtils.clamp(
          Math.abs(dropState.velocity) / 8.5,
          0,
          1.35
        );
        fallStretch = speedRatio * CONFIG.physics.fallStretch
          * (.88 + .12 * Math.sin(time * 8.4));
        fallSway = Math.sin(time * 7.1) * speedRatio
          * CONFIG.physics.fluidity * .028;
        if (dropState.y <= contactY) {
          dropState.y = contactY;
          triggerWaterImpact(Math.abs(dropState.velocity));
        }
      } else if (dropState.phase === 'merge') {
        const age = dropState.timer;
        const softness = CONFIG.physics.impactSoftness;
        const decay = THREE.MathUtils.lerp(5.2, 2.25, softness);
        fluidPulse = Math.sin(age * 10.8) * Math.exp(-age * decay)
          * CONFIG.physics.fluidity * dropState.impactSpeed
          * CONFIG.physics.impact;
        const mergeDuration = THREE.MathUtils.lerp(.56, 1.02, softness);
        const merge = smooth01((age - .10) / mergeDuration);
        dropState.y = contactY - merge * currentDropRadius() * .70
          - Math.max(0, fluidPulse) * .055;
        fade = 1 - smooth01(
          (age - mergeDuration * .38) / (mergeDuration * .67)
        );
        if (age > mergeDuration * 1.08) {
          dropRoot.visible = false;
          if (age > CONFIG.physics.loopDelay) {
            resetDropSimulation(false);
            return;
          }
        }
      }

      dropRoot.visible = dropRoot.visible && fade > .015;
      dropRoot.position.set(
        CONFIG.drop.x + dropTouch.offset.x + fallSway,
        dropState.y + dropTouch.offset.y,
        CONFIG.drop.z
      );
      dropRoot.rotation.set(
        CONFIG.drop.rx,
        CONFIG.drop.ry + Math.sin(time * .18) * .035,
        CONFIG.drop.rz - dropTouch.offset.x * .12 - fallSway * 2.8
      );
      const scaleX = 1 - fallStretch * .24 + fluidPulse * .28;
      const scaleY = 1 + fallStretch - fluidPulse * .52;
      const scaleZ = 1 - fallStretch * .18 + fluidPulse * .28;
      dropRoot.scale.set(
        CONFIG.drop.scale * Math.max(.3, scaleX),
        CONFIG.drop.scale * Math.max(.24, scaleY),
        CONFIG.drop.scale * Math.max(.3, scaleZ)
      );
      dropMaterial.opacity = fade;

      glowTop.position.set(
        CONFIG.drop.x + dropTouch.offset.x + fallSway - .18 * CONFIG.drop.scale,
        dropState.y + dropTouch.offset.y + currentDropRadius() * .72,
        CONFIG.drop.z + 1.04
      );
      glowFoot.position.set(
        CONFIG.drop.x + dropTouch.offset.x + fallSway + .06 * CONFIG.drop.scale,
        dropState.y + dropTouch.offset.y - currentDropRadius() * .78,
        CONFIG.drop.z + 1.00
      );
      glowTop.material.opacity = fade * (.38 + Math.sin(time * 1.18) * .035);
      glowFoot.material.opacity = fade * (.44 + Math.sin(time * .92 + 1.1) * .035);
    }

    /* ------------------------------------------------------------------
       WATERLINE RIPPLE
       Two moments on this page break the surface: the orb rising out of the
       river on entry, and the orb plunging back into it at the hand-off to
       section two. They share one applier so both read as the same water.
       `age` is seconds since the break, `amount` scales the whole burst and
       `riverStrength` drives the vertex wave in the river shader.
       ------------------------------------------------------------------ */
    function applyWaterRipple(age, fade, amount, riverStrength, overlayAlpha) {
      const live = age >= 0 && fade > .01 && amount > .004;
      const rippleAge = Math.max(0, age);

      impactRing.position.set(
        CONFIG.drop.x,
        CONFIG.physics.waterY + .035,
        CONFIG.drop.z
      );
      impactRing.scale.setScalar(
        .12 + rippleAge * CONFIG.physics.rippleSpeed * .68
      );
      impactRingMaterial.opacity = live
        ? .62 * amount * Math.exp(-rippleAge * CONFIG.physics.damping * .64) * fade
        : 0;
      impactRing.visible = impactRingMaterial.opacity > .01;

      const secondaryAge = Math.max(0, rippleAge - .24);
      impactRingSecondary.position.copy(impactRing.position);
      impactRingSecondary.scale.setScalar(
        .08 + secondaryAge * CONFIG.physics.rippleSpeed * .58
      );
      impactRingSecondaryMaterial.opacity =
        live && rippleAge > .24
          ? .34 * amount * Math.exp(-secondaryAge * CONFIG.physics.damping * .78) * fade
          : 0;
      impactRingSecondary.visible = impactRingSecondaryMaterial.opacity > .01;

      const splashAge = rippleAge * 1.095;
      const splashFade = (1 - smooth01(splashAge / 1.12)) * amount;
      splashMaterial.opacity = .86 * CONFIG.physics.splash * splashFade;
      splashParticles.forEach(particle => {
        const data = particle.userData;
        const particleAge = splashAge - data.transitionDelay;
        const visible = live
          && particleAge >= 0
          && particleAge < 1.16
          && splashMaterial.opacity > .012;
        particle.visible = visible;
        if (!visible) return;
        const radialSpeed = data.transitionSpeed * CONFIG.physics.splash;
        const radial = .08 + radialSpeed * particleAge;
        const lift = data.transitionLift * CONFIG.physics.splash;
        particle.position.set(
          CONFIG.drop.x + Math.cos(data.transitionAngle) * radial,
          CONFIG.physics.waterY + .07
          + lift * particleAge
          - CONFIG.physics.gravity * .48 * particleAge * particleAge,
          CONFIG.drop.z + Math.sin(data.transitionAngle) * radial
        );
        const width = data.transitionScale * Math.max(.28, 1 - particleAge * .42);
        particle.scale.set(
          width,
          data.transitionScale * (.82 + particleAge * .72),
          width
        );
      });

      /* One-shot radial spray shares the splash clock. */
      sprayMaterial.uniforms.uAge.value = live ? splashAge : 99;
      sprayMaterial.uniforms.uOpacity.value =
        .85 * CONFIG.physics.splash * splashFade * (1 - overlayAlpha);
      sprayMaterial.uniforms.uGravity.value = CONFIG.physics.gravity;
      sprayMaterial.uniforms.uCenter.value.set(
        CONFIG.drop.x, CONFIG.physics.waterY + .05, CONFIG.drop.z
      );

      /* Waterline mist puff blooming with the ripple. */
      mistPuff.position.set(
        CONFIG.drop.x,
        CONFIG.physics.waterY + .30 + rippleAge * .24,
        CONFIG.drop.z + .30
      );
      mistPuff.scale.set(
        1.1 + rippleAge * 3.4,
        .42 + rippleAge * 1.35,
        1
      );
      mistPuff.material.opacity = live
        ? .46 * CONFIG.physics.impact * amount
        * Math.exp(-rippleAge * 1.85) * fade
        : 0;

      riverUniforms.uImpactCenter.value.set(CONFIG.drop.x, CONFIG.drop.z);
      riverUniforms.uImpactStrength.value = CONFIG.physics.impact * riverStrength;
      riverUniforms.uImpactAge.value = live ? rippleAge : 99;
    }

    /* ------------------------------------------------------------------
       POINTER WATER INTERACTION
       Ring sources are spawned by hand — a wake while the pointer drags
       across the lake, a burst when it strikes — and retired here. Slots
       are recycled weakest-first, so a fast drag never cuts a ring that is
       still bright.
       ------------------------------------------------------------------ */
    const rippleQueue = [];

    function spawnRipple(x, z, strength) {
      const amount = THREE.MathUtils.clamp(strength, 0, 2.4);
      if (amount <= .004) return;
      let slot = 0;
      let weakest = Infinity;
      /* 最後一格保留給捲動轉場：它的環是 progress 的閉式函數，每幀整格重
         寫，所以指標的環永遠不會搶到它、它也永遠不會被指標的環蓋掉。 */
      for (let i = 0; i < RIPPLE_SLOTS - 1; i++) {
        const source = rippleSlots[i];
        const energy = source.w <= .001
          ? -1
          : source.w * Math.exp(-source.z * CONFIG.ripple.damping);
        if (energy < weakest) {
          weakest = energy;
          slot = i;
          if (energy < 0) break;
        }
      }
      rippleSlots[slot].set(x, z, 0, amount);
      uRippleLive.value = 1;
    }

    /* The rebound of a splash and the rings its thrown drops make when they
       land are queued rather than spawned, so one call describes the whole
       event instead of leaving timers scattered through the loop. */
    function queueRipple(x, z, strength, delay) {
      rippleQueue.push({ x, z, strength, delay });
    }

    function updateRipples(dt) {
      for (let i = rippleQueue.length - 1; i >= 0; i--) {
        const pending = rippleQueue[i];
        pending.delay -= dt;
        if (pending.delay <= 0) {
          spawnRipple(pending.x, pending.z, pending.strength);
          rippleQueue.splice(i, 1);
        }
      }
      let live = 0;
      for (let i = 0; i < RIPPLE_SLOTS; i++) {
        const source = rippleSlots[i];
        if (source.w <= .001) continue;
        source.z += dt;
        /* Retire a ring once its envelope is below what a pixel can show:
           the shaders skip the whole field while every slot is free. */
        if (source.w * Math.exp(-source.z * CONFIG.ripple.damping) < .004) {
          source.w = 0;
          source.z = 999;
          continue;
        }
        live++;
      }
      uRippleLive.value = live > 0 ? 1 : 0;
      rippleOverlayMaterial.uniforms.uOpacity.value = sceneDim;
    }

    /* A one-shot micro-spray for pointer strikes. It shares the droplet
       spray's shader but carries its own clock, so the two can overlap. */
    const pointerSprayMaterial = sprayMaterial.clone();
    pointerSprayMaterial.uniforms.uAge.value = 99;
    pointerSprayMaterial.uniforms.uOpacity.value = 0;
    const pointerSpray = (() => {
      const count = 90;
      const positions = new Float32Array(count * 3);
      const dirs = new Float32Array(count * 3);
      const speeds = new Float32Array(count);
      const seeds = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        const theta = seeded(i, 401) * Math.PI * 2;
        const radial = .55 + seeded(i, 409) * .75;
        const dir = new THREE.Vector3(
          Math.cos(theta) * radial,
          .55 + seeded(i, 419) * 1.05,
          Math.sin(theta) * radial
        ).normalize();
        dirs.set([dir.x, dir.y, dir.z], i * 3);
        speeds[i] = .85 + seeded(i, 421) * 1.75;
        seeds[i] = seeded(i, 431);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('aDir', new THREE.BufferAttribute(dirs, 3));
      geometry.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));
      geometry.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
      const points = new THREE.Points(geometry, pointerSprayMaterial);
      points.frustumCulled = false;
      points.renderOrder = 9;
      points.visible = false;
      scene.add(points);
      return points;
    })();
    let pointerSprayAge = 99;
    let pointerSprayPower = 0;

    function splashAt(x, z, power = 1) {
      const gain = CONFIG.ripple.click * power;
      spawnRipple(x, z, 1.10 * gain);
      queueRipple(x, z, .66 * gain, .13);
      queueRipple(x, z, .38 * gain, .27);
      /* The drops a strike throws come back down around the crown and ring
         the surface again — the detail that separates a splash from a ring
         stamped into the water. */
      for (let i = 0; i < 5; i++) {
        const angle = seeded(i, 443) * Math.PI * 2;
        const radius = .55 + seeded(i, 449) * 1.05;
        queueRipple(
          x + Math.cos(angle) * radius,
          z + Math.sin(angle) * radius,
          .20 * gain,
          .40 + seeded(i, 457) * .26
        );
      }
      pointerSprayAge = 0;
      pointerSprayPower = THREE.MathUtils.clamp(power, 0, 1.4);
      pointerSprayMaterial.uniforms.uAge.value = 0;
      pointerSprayMaterial.uniforms.uGravity.value = CONFIG.physics.gravity;
      pointerSprayMaterial.uniforms.uCenter.value.set(
        x, CONFIG.physics.waterY + .04, z
      );
    }

    function updatePointerSpray(dt) {
      if (pointerSprayAge > 1.35) {
        if (pointerSpray.visible) pointerSpray.visible = false;
        return;
      }
      pointerSprayAge += dt;
      pointerSpray.visible = true;
      pointerSprayMaterial.uniforms.uAge.value = pointerSprayAge;
      pointerSprayMaterial.uniforms.uOpacity.value =
        .85 * pointerSprayPower * sceneDim;
    }

    /* ------------------------------------------------------------------
       ENTRY
       The hero is not simply there once the loader clears: the orb surfaces
       out of the river. It starts a couple of body-lengths under the
       waterline — the reflective water plane is opaque, so it is genuinely
       hidden, not faded out — swells the surface, tears through it with a
       ring, then buoys up to the hover height the page is composed around.
       ------------------------------------------------------------------ */
    /* ------------------------------------------------------------------
       THE GATHER
       A metaball field (three's MarchingCubes) wearing the same physical
       glass as the orb, so the two are one substance and the hand-off from
       the last fused bead to the interactive orb is invisible. The field is
       a cube of 2 units a side scaled by `spread`; a bead of world radius
       r is a ball of strength r_cube² · (isolation + subtract), because the
       isosurface sits where strength / d² - subtract == isolation.
       ------------------------------------------------------------------ */
    const clusterMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xf4fbff,
      metalness: 0,
      roughness: CONFIG.drop.roughness,
      transmission: CONFIG.drop.transmission,
      ior: 1.49,
      thickness: CONFIG.drop.thickness,
      attenuationColor: new THREE.Color('#d5ecf6'),
      attenuationDistance: 8.5,
      specularIntensity: 1,
      specularColor: new THREE.Color('#ffffff'),
      envMapIntensity: 1.08,
      clearcoat: 1,
      clearcoatRoughness: .025,
      iridescence: .07,
      iridescenceIOR: 1.28,
      transparent: true,
      side: THREE.DoubleSide
    });
    const CLUSTER_RES = matchMedia('(max-width: 720px)').matches ? 40 : 56;
    const CLUSTER_SUBTRACT = 12;
    /* A replay of the default gather peaks near 12.3k triangles at res 56
       and 6.2k at 40; this leaves room for the tuner's 24 largest beads. */
    const cluster = new MarchingCubes(CLUSTER_RES, clusterMaterial, false, false, CLUSTER_RES > 40 ? 32000 : 16000);
    cluster.name = 'drop-gather-cluster';
    cluster.isolation = 80;
    cluster.castShadow = true;
    /* After the orb, always. Both are transmissive and share a position
       during the hand-off; on a tie the order falls to object ids, and a
       bead drawn first depth-rejects the orb it is meant to fade onto. */
    cluster.renderOrder = 7;
    /* With the droplet on, the cluster is layout and pointer data only. */
    if (dropSDF) cluster.layers.set(1);
    cluster.position.set(CONFIG.drop.x, CONFIG.drop.y, CONFIG.drop.z);
    cluster.scale.setScalar(currentDropRadius() * 2.6);
    /* Visible but empty from the start, so the physical-glass programs (and
       the back-face variant the transmission pass needs) are built behind
       the loader instead of on the very frame the reveal begins. */
    cluster.reset();
    cluster.update();
    scene.add(cluster);
    /* The loop rebuilds this field on every frame for as long as the page is
       open, so the two library calls that fill it are replaced.
       addBall also paints a colour palette in every cell it touches — a
       square root per cell — and allocates a Color on each call; the cluster
       wears no vertex colours, so only the field is written here. The falloff
       is the library's own, strength/d² - subtract, into the same cells, but
       each row is walked only across the span where that is positive. On the
       desktop grid the palette alone was over half the loop's cost. */
    function addFieldBall(ballx, bally, ballz, strength, subtract) {
      const size = cluster.size;
      const size2 = cluster.size2;
      const field = cluster.field;
      const reach2 = strength / subtract - .000001;
      if (!(reach2 > 0)) return;
      const radius = size * Math.sqrt(strength / subtract);
      const zs = ballz * size, ys = bally * size, xs = ballx * size;
      const minZ = Math.max(1, Math.floor(zs - radius));
      const maxZ = Math.min(size - 1, Math.floor(zs + radius));
      const minY = Math.max(1, Math.floor(ys - radius));
      const maxY = Math.min(size - 1, Math.floor(ys + radius));
      const minX = Math.max(1, Math.floor(xs - radius));
      const maxX = Math.min(size - 1, Math.floor(xs + radius));
      for (let z = minZ; z < maxZ; z++) {
        const fz = z / size - ballz;
        const restZ = reach2 - fz * fz;
        if (restZ <= 0) continue;
        const zOffset = size2 * z;
        for (let y = minY; y < maxY; y++) {
          const fy = y / size - bally;
          const rest = restZ - fy * fy;
          if (rest <= 0) continue;
          /* A cell wider either side than the exact span, so rounding can
             never drop one the library would have written. */
          const span = Math.sqrt(rest) * size;
          const x0 = Math.max(minX, Math.floor(xs - span) - 1);
          const x1 = Math.min(maxX, Math.ceil(xs + span) + 2);
          const yOffset = zOffset + size * y;
          const fyz = fy * fy + fz * fz;
          for (let x = x0; x < x1; x++) {
            const fx = x / size - ballx;
            const val = strength / (.000001 + fx * fx + fyz) - subtract;
            if (val > 0) field[yOffset + x] += val;
          }
        }
      }
    }
    /* reset() walks every cell clearing the palette too. update() reads only
       the field and the normal cache — it computes a normal wherever the
       cache still reads zero — so those two are cleared, as memory. */
    function clearField() {
      cluster.field.fill(0);
      cluster.normal_cache.fill(0);
    }
    /* Up to 24 beads are laid out once, deterministically, and `count` of
       them are used — so the slider can be dragged without a rebuild. The
       largest is the survivor and sits at the centre; the rest are placed
       touching the clump so the field fuses them, with a few standing a
       little apart as satellites. */
    const clusterBeads = [];
    for (let i = 0; i < 24; i++) {
      const u = seeded(i, 311), v = seeded(i, 733), w = seeded(i, 919);
      const theta = u * Math.PI * 2, phi = Math.acos(v * 2 - 1);
      const dir = new THREE.Vector3(
        Math.sin(phi) * Math.cos(theta),
        Math.sin(phi) * Math.sin(theta) * .72,
        Math.cos(phi) * .85
      );
      clusterBeads.push({
        dir,
        /* Log-distributed sizes: many small, few large. */
        size: Math.pow(w, 1.6),
        reach: .55 + seeded(i, 157) * .55 + (seeded(i, 281) > .84 ? .55 : 0),
        order: 0,
        side: seeded(i, 421) > .5 ? 1 : -1,
        phase: seeded(i, 503) * Math.PI * 2,
        done: false,
        /* Drawn afresh each turn by chooseStrays: whether it breaks away on
           its own, where to and when it lets go, and its place in the split
           order. */
        stray: false,
        strayDir: new THREE.Vector3(0, 1, 0),
        strayOrder: 0,
        shuffle: 0
      });
    }
    /* Small first, by design: the survivor eats the crumbs before the big
       ones, so the end of the merge is the few large swallows that ring. */
    clusterBeads.slice().sort((a, b) => a.size - b.size)
      .forEach((bead, rank) => { bead.order = rank / 23; });
    /* Where the drop is in its life:
       off      — before the reveal, and for reduced motion always
       loop     — the beads gather and rest as one drop; with LOOP 1 they split
                  and gather again, with LOOP 0 the drop then goes to the orb
       collapse — the scroll has taken it: every bead is drawn in at once
       orb      — the modelled orb has the drop (the fall into section two)
       `g` is how far the gather has got (0 scattered, 1 one drop). `opacity`
       is how much of the cluster lies over the orb; it eases rather than
       switching, so a hand-off either way is a cross-fade that can be turned
       round half done. `balls` is what the field was built from this frame,
       in world offsets, for the pointer. */
    const gatherState = {
      mode: 'off', clock: 0, time: 0, g: 0, splitting: false,
      opacity: 1, osc: 0, ring: 1, ringEnv: 0, activeCount: 0, volume: 0, total: 1,
      /* Turns completed, the turn the strays were last drawn for, and a seed
         so every visit draws a different sequence. */
      cycle: 0, strayCycle: -1, seed: Math.floor(Math.random() * 997),
      balls: Array.from({ length: clusterBeads.length + 1 }, () => ({ x: 0, y: 0, z: 0, r: 0, ux: 0, uy: 0, uz: 0, ur: 0, index: -1 })),
      /* The ring and pointer squash of this frame, for the droplet. */
      fx: 1, fy: 1, fz: 1,
      ballCount: 0,
      /* No resume of the loop before this gather time: after a load with no
         intro, the whole drop rests through the loader and a HOLD first. */
      resumeAfter: 0
    };
    const _beadPos = new THREE.Vector3();
    /* Radius and fusing are kept apart. The isosurface of one ball sits at
       sqrt(strength/(isolation+subtract)), so the strength is solved for the
       radius wanted; FUSE then acts only through `subtract`, which sets how
       far the field reaches past that surface — how soon two beads neck —
       without changing the size of either. */
    function clusterStrength(radiusWorld, spread, subtract) {
      const r = radiusWorld / (2 * spread);
      return r * r * (cluster.isolation + subtract);
    }
    /* One turn of the loop: apart (HOLD), gathering (DURATION), one drop at
       rest (SETTLE), shedding its beads (SPLIT). */
    function gatherCycle(G) {
      const hold = Math.max(0, G.hold);
      const duration = Math.max(.05, G.duration);
      const settle = Math.max(0, G.settle);
      const split = Math.max(.05, G.split);
      return { hold, duration, settle, split, length: hold + duration + settle + split };
    }
    /* The orb is under the cluster whenever the cluster is not wholly there:
       before the reveal, while the orb has the drop, and through either
       cross-fade. */
    function syncOrbVisibility() {
      const orb = dropRoot.userData.orbMesh;
      if (!orb) return;
      const S = gatherState;
      orb.visible = (S.mode !== 'loop' && S.mode !== 'collapse') || S.opacity < 1;
    }
    function beginGather() {
      const S = gatherState;
      S.mode = 'loop';
      S.clock = 0;
      S.time = 0;
      S.g = 0;
      S.splitting = false;
      S.opacity = 1;
      S.osc = 0;
      S.ring = 1;
      S.ringEnv = 0;
      S.activeCount = 0;
      S.volume = 0;
      S.cycle = 0;
      S.strayCycle = -1;
      for (const bead of clusterBeads) {
        bead.done = false;
        bead.stray = false;
      }
      clusterMaterial.opacity = 1;
      clusterMaterial.depthWrite = true;
      cluster.visible = true;
      syncOrbVisibility();
    }
    /* The scroll takes the drop. Whatever the loop was doing — beads apart,
       half gathered, half split — every one is drawn in over a moment, and
       the orb carries the single drop down. */
    function collapseGather() {
      if (gatherState.mode === 'loop') gatherState.mode = 'collapse';
    }
    function endGather(kick = true) {
      const S = gatherState;
      if (S.mode === 'orb') return;
      if (S.mode === 'off') {
        /* Reduced motion: no bead was ever on screen, so nothing fades and
           nothing rings — the orb is simply there. */
        S.mode = 'orb';
        S.opacity = 0;
        cluster.visible = false;
        syncOrbVisibility();
        return;
      }
      /* The orb appears inside the last bead and the bead fades over it, so
         the swap from a marched surface to the modelled one is never seen.
         The fade itself is run by updateGatherLoop. */
      S.mode = 'orb';
      S.g = 1;
      S.splitting = false;
      S.ring = 0;
      /* The last swallow is still ringing when the orb takes over: hand it
         that energy, so the membrane goes on wobbling instead of snapping
         to rest at the swap. */
      /* Only when the scroll takes it. With LOOP off the drop also comes here
         at the end of the gather, already still, and a kick would twitch it. */
      if (kick) dropTouch.wobble = Math.min(1, dropTouch.wobble + .34);
      syncOrbVisibility();
    }
    /* Back from section two, the orb has risen to where the drop hangs. The
       cluster comes up over it as that same single drop, resting, and the
       loop carries on from there: it splits next. */
    function resumeGather() {
      const S = gatherState;
      const C = gatherCycle(CONFIG.gather);
      S.mode = 'loop';
      S.clock = C.hold + C.duration;
      S.g = 1;
      S.splitting = false;
      S.osc = 0;
      /* The ring comes up with the fade, from a round drop over the round
         orb. */
      S.ring = 0;
      S.ringEnv = 0;
      /* Every bead is already inside the drop. Each is taken as it is found
         on the first frame, so none rings as a fresh swallow. */
      S.activeCount = 0;
    }
    /* Every turn one to STRAYS of the small beads break away on their own.
       Which ones, where they head and when each lets go are drawn once the
       drop is whole, while every bead is inside it, so a new draw can never
       make one jump. */
    const _strayCandidate = new THREE.Vector3();
    const _strayOther = new THREE.Vector3();
    /* The field's frame, from the settings alone and never from where the
       beads are, so the grid holds still under the surface for a whole turn.
       wall      where a surface can exist at all. addBall writes cells
                 1..size-2 and update() polygonises the same span, so the
                 usable local box is [-1+2/size, 1-4/size]; a bead must fit
                 inside it whole or its far side is cut flat. One cell spare.
       bulge     FUSE lowers the subtract, so fields reach further and crowded
                 beads swell past their own radius; every margin grows with it.
       spread    the grid's half-size. SPREAD scales the clump, but the grid is
                 never smaller than the survivor with the largest bead fused to
                 its side, or big beads at a tight SPREAD pile through the wall.
       formation how far the clump is drawn in together, so that every bead's
                 start, turned any way the spin can take it and bowed by the
                 larger ARC, clears the wall. Drawing in only the outliers piles
                 them on the wall, where their fields add and bulge through
                 anyway. Strays are left out; each is held off the wall alone.
       minRadius a cell and a fifth. A sphere smaller than that can fall between
                 the grid's samples and blink out for a frame. */
    const _layout = { wall: 1, bulge: 1, spread: 1, formation: 1, minRadius: 0 };
    function gatherLayout(G, R, count) {
      const edge = 1 - 5 / CLUSTER_RES;
      const swell = Math.max(1, 1 + .25 * (G.fuse - 1));
      const fitHalf = (R * (1 + G.breathe * .6)
        + R * Math.max(G.sizeMin, G.sizeMax, G.straySize) * 1.85 * (1 + G.breathe)) * 1.1 * swell / edge;
      const half = Math.max(R * 2.6 * Math.max(.3, G.spread), fitHalf);
      let pullIn = 1;
      for (let i = 0; i < count; i++) {
        const bead = clusterBeads[i];
        if (bead.stray) continue;
        const size = R * THREE.MathUtils.lerp(G.sizeMin, G.sizeMax, bead.size);
        const away = (R * .5 + size * .85 + R * bead.reach) * G.spread;
        const extent = Math.max(Math.hypot(bead.dir.x, bead.dir.z) * away,
          Math.abs(bead.dir.y) * away + Math.max(G.arc, G.splitArc) * R);
        const space = half * edge - size * 1.25 * swell * (1 + G.breathe);
        if (extent > 1e-6) pullIn = Math.min(pullIn, Math.max(0, space / extent));
      }
      _layout.wall = edge;
      _layout.bulge = swell;
      _layout.spread = half;
      _layout.formation = pullIn;
      _layout.minRadius = 1.2 * 2 * half / CLUSTER_RES;
      return _layout;
    }
    function chooseStrays() {
      const S = gatherState;
      const G = CONFIG.gather;
      S.strayCycle = S.cycle;
      const count = Math.min(Math.round(G.count), clusterBeads.length);
      /* Salt ranges kept apart so no two draws share a number: how many 1,
         which 10+, when 20+, headings 400+, split order 900+. */
      const rand = salt => seeded(S.seed + S.cycle * 1.618, salt);
      clusterBeads.forEach((bead, i) => {
        bead.stray = false;
        bead.shuffle = rand(900 + i);
      });
      const most = THREE.MathUtils.clamp(Math.round(G.strays), 0, 3);
      if (most < 1 || count < 4) return;
      const wanted = 1 + Math.floor(rand(1) * most);
      const R = currentDropRadius();
      /* From the smaller half, so what breaks away is a droplet and not a
         lobe of the clump. */
      const pool = [];
      for (let i = 0; i < count; i++)pool.push(i);
      pool.sort((a, b) => clusterBeads[a].size - clusterBeads[b].size);
      pool.length = Math.max(1, Math.ceil(count / 2));
      const placed = [];
      for (let k = 0; k < wanted && pool.length; k++) {
        const bead = clusterBeads[pool.splice(Math.floor(rand(10 + k) * pool.length), 1)[0]];
        bead.stray = true;
        bead.strayOrder = rand(20 + k);
        /* Where everything will rest once apart, from the same layout the
           field uses, with this turn's strays already out of the draw-in. */
        const layout = gatherLayout(G, R, count);
        const strayR = Math.max(R * G.straySize, layout.minRadius);
        const strayAway = (R * .5 + strayR * .85 + R * bead.reach + R * Math.max(0, G.strayReach)) * G.spread;
        const limit = Math.max(0, layout.spread * layout.wall - strayR * 1.25 * layout.bulge);
        /* Out into the emptiest side: of sixteen random headings, the one whose
           narrowest gap between surfaces is widest — so a large bead nearby
           counts against a heading more than a small one further off. Kept
           level or rising and shallow in depth, so it reads as a drop of its
           own beside the clump instead of hiding behind it. */
        let best = -Infinity;
        for (let c = 0; c < 16; c++) {
          const theta = rand(400 + k * 40 + c * 2) * Math.PI * 2;
          const y = -.1 + rand(401 + k * 40 + c * 2) * .8;
          const across = Math.sqrt(1 - y * y);
          _strayCandidate.set(Math.cos(theta) * across, y, Math.sin(theta) * across * .5).normalize();
          /* As far out as the wall lets it rest at any turn of the spin. */
          const rest = Math.min(strayAway, limit / Math.max(1e-6,
            Math.hypot(_strayCandidate.x, _strayCandidate.z), Math.abs(_strayCandidate.y)));
          const px = _strayCandidate.x * rest, py = _strayCandidate.y * rest, pz = _strayCandidate.z * rest;

             而且是金屬」的證據。仰角已經被 uEnvSquash 壓過，所以緯線被壓

          uChromeRough: { value: CONFIG.drop.roughness },

      transparent: true,
      depthWrite: true,
      vertexShader: `
        attribute vec3 instanceExtra;   /* x 淡出, y 亂數種子, z 拉長量 */
        varying vec3 vN;

        varying vec3 vExtra;
        void main(){
          vExtra=instanceExtra;
          /* 拉長只發生在觀察空間的 Z 上，也就是「朝鏡頭」的方向，因為那
             才是速度的方向。在物件空間拉長會跟著珠子的側偏一起歪掉。 */

      fragmentShader: MONTIS_ENV_GLSL + MONTIS_CHROME_GLSL + `

        varying vec3 vW;
        varying vec3 vExtra;
        void main(){

             結果整顆球被墨塗滿變成一顆暗行星。 */
          float mask=smoothstep(.25,.85,fract(vExtra.y+N.y*.5+N.x*.31));

          float behind=clamp(dot(-V,normalize(uEnvCoreDir)),0.,1.);

    });
    const disperseMesh = new THREE.InstancedMesh(
      new THREE.IcosahedronGeometry(1, 3),
      disperseMaterial,
      DISPERSE_MAX
    );
    disperseMesh.name = 'drop-dispersal';
    disperseMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    disperseMesh.geometry.setAttribute(
      'instanceExtra',
      new THREE.InstancedBufferAttribute(new Float32Array(DISPERSE_MAX * 3), 3)
    );
    disperseMesh.geometry.attributes.instanceExtra.setUsage(THREE.DynamicDrawUsage);
    /* 珠子會飛到鏡頭旁邊、甚至擦過畫面邊緣，包圍球算出來的結果會誤判。 */
    disperseMesh.frustumCulled = false;
    disperseMesh.renderOrder = 8;
    disperseMesh.count = 0;
    disperseMesh.visible = false;
    disperseMesh.raycast = () => { };
    scene.add(disperseMesh);
    const disperseMatrix = new THREE.Matrix4();
    const disperseQuat = new THREE.Quaternion();
    const dispersePos = new THREE.Vector3();
    const disperseScale = new THREE.Vector3();
    const disperseVel = new THREE.Vector3();

       們交給英雄的 SDF 一起 raymarch（借 uTrail 的世界座標球位），smooth-min
       會在芽與本體之間長出真正的液橋和頸縮；交接那一格才切成 instanced。
       倒捲回來時走同一條路：珠子飛回原位、切回 SDF、橋接、併回核心。 */
    /* 主珠在哪、什麼形狀、身上還掛著幾顆芽：updateDispersal 每格填，英雄的

      y: new Float32Array(DISPERSE_MAX),

    const ENV_SQUASH_BASE = montisEnvUniforms.uEnvSquash.value;
    const ENV_KEY_BASE = montisEnvUniforms.uEnvKey.value.clone();

       the head on the pointer. Here they lie on the drop's drag plane. */
    const dropletTrail = {
      points: Array.from({ length: DROPLET_TRAIL }, () => new THREE.Vector3(CONFIG.drop.x, CONFIG.drop.y, CONFIG.drop.z)),
      prev: new THREE.Vector3(),
      amount: 0,
      acc: 0,
      primed: false,
      touchDown: false,
      pointerType: 'mouse'

    const _dropletCentre = new THREE.Vector3();
    const _dropletMatrix = new THREE.Matrix4();
    const _dropletQuat = new THREE.Quaternion();
    const _dropletScale = new THREE.Vector3();
    const _dropletMin = new THREE.Vector3();
    const _dropletMax = new THREE.Vector3();
    const _dropletSphere = new THREE.Sphere();
    const _jellyAxis = new THREE.Vector3(0, 0, 1);

    let dropletNoisePhase = 0;

      if (!dropSDF) return;
      const U = dropletUniforms;

      const D = CONFIG.droplet;
      const R = currentDropRadius();
      const base = Math.max(1e-4, CONFIG.drop.scale);
      const balls = U.uBalls.value;

        fz = dropRoot.scale.z / base;

        ? dispersalK(R)
        : Math.max(.5, D.smooth) * .55 / (R * Math.max(.2, CONFIG.gather.fuse));
      U.uK.value = k;

      U.uDentDir.value.copy(T.uTouchDirection.value).applyQuaternion(dropRoot.quaternion)
        .applyAxisAngle(_jellyAxis, -dropTouch.jellyAngle).normalize();
      U.uDent.value.set(T.uTouchStrength.value, T.uTouchRadius.value, T.uTouchWobble.value, T.uTouchTime.value);

      U.uWave.value.set(T.uWaveAmplitude.value * gain, T.uWaveFrequency.value, T.uWaveSpeed.value, T.uBreathing.value * gain);

      const trail = dropletTrail;
      const reach = Math.max(.1, D.trailReach) * R;
      const waterY = CONFIG.physics.waterY;
      let trailCount = 0;
      if (disperseBuds.count > 0) {
        /* 斷裂前的芽（updateDispersal 填的）：世界座標的球、權重 1，跟本體
           一起 smooth-min，芽根就是液橋。指標拖尾這時本來就已經關了。 */
        for (let i = 0; i < disperseBuds.count; i++) {
          U.uTrail.value[i].set(disperseBuds.x[i], disperseBuds.y[i], disperseBuds.z[i], disperseBuds.r[i]);

           離英雄 TRAIL REACH 個半徑內才存在——靠近就和本體融成一顆、拉開

        for (let i = 0; i < DROPLET_TRAIL; i++) {
          const point = trail.points[i];
          const r = R * (.12 - .008 * i) / .55 * Math.max(0, D.trailSize);
          const gate = 1 - smooth01((point.distanceTo(dropRoot.position) - reach * .55) / (reach * .45));
          U.uTrail.value[i].set(point.x, Math.max(point.y, waterY + r), point.z, r);

      const c = dropRoot.position;
      const fmax = Math.max(fx, fy, fz);
      _dropletMin.set(Infinity, Infinity, Infinity);
      _dropletMax.set(-Infinity, -Infinity, -Infinity);

      const swell = U.uWave.value.x + Math.abs(U.uWave.value.w) + .048 * U.uDent.value.x + .096 * U.uDent.value.z;
      for (let i = 0; i < count; i++) {
        const ball = balls[i];

        _dropletCentre.set(c.x + ball.x * fx, c.y + ball.y * fy, c.z + ball.z * fz);

      U.uBoxMax.value.copy(_dropletMax);

      const side = Math.max(_dropletMax.x - _dropletMin.x, _dropletMax.y - _dropletMin.y, _dropletMax.z - _dropletMin.z) + .1;

    const ENTRY = {
      hold: .55,       /* still water while the loader finishes clearing */
      swell: .55,      /* climbing blind toward the surface */
      preRipple: .30,  /* surface answers just before the crown arrives */
      rise: 1.90,      /* break -> hover */
      settle: 1.40,    /* buoyant wobble decaying to rest */

      done: false,
      splashed: false,
      time: 0,

      stretch: 0,
      extras: 0,
      rippleAge: -1,
      rippleFade: 0,
      rippleAmount: 0
    };

    function skipEntry() {
      entry.running=false; entry.done=true; entry.extras=1; entry.y=CONFIG.drop.y;
      gatherState.mode='journey'; gatherState.opacity=1;
    }

    /* The entrance used to surface the orb from the river. It now forms
       in the air: the cluster gathers into one drop where the orb hangs,
       and the orb takes over from the last bead. The river's own entry

      entry.extras = smooth01((t - G.hold * .6) / 1.4);
      entry.rippleAge = -1;
      entry.rippleFade = 0;

      if (t >= G.hold + G.duration + G.settle) skipEntry();

      progress: 0,
      target: 0

    let transitionSplashed = false;
    let impactKick = 0;
    let appliedKick = 0;
    /* Ambient extras (shafts, mist, birds) share one dimmer that
       the transition drives toward zero as section two takes over. */
    let sceneDim = 1;

       SECTION TWO FILM

    let videoWarmed = false;
    let videoPlaying = false;
    function warmSectionTwoVideo() {

      sectionTwoVideo.addEventListener('loadeddata', markReady, { once: true });

    /* ------------------------------------------------------------------

       ------------------------------------------------------------------ */
    const beadOut = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, tl: 0, v0: 0 };
    const beadParent = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, tl: 0, v0: 0 };

       起步：碎片不是零時刻就滿速的——爆開的壓力衝量作用一小段時間，所以
       前 launch 秒是等加速（v = v0·t/launch，位移 v0·t²/2launch），之後才
       是彈道；位置與速度在接點都連續。少了這一段，珠子在一格之內就從英

       因為它有含重力的閉式解，往回捲一格不差。 */
    function beadBallistic(out, x0, y0, z0, vx0, vy0, vz0, k, g, tl, launch) {
      out.tl = tl;
      if (tl < launch) {
        const q = tl * tl / (2 * launch);
        const f = tl / launch;
        out.x = x0 + vx0 * q;
        out.y = y0 + vy0 * q;
        out.z = z0 + vz0 * q;
        out.vx = vx0 * f;
        out.vy = vy0 * f;
        out.vz = vz0 * f;
        return out;
      }
      const t = tl - launch;
      const h = launch * .5;
      const e = 1 - Math.exp(-k * t);
      const decay = 1 - e;
      out.x = x0 + vx0 * h + vx0 * e / k;
      out.y = y0 + vy0 * h + (vy0 + g / k) * e / k - g * t / k;
      out.z = z0 + vz0 * h + vz0 * e / k;
      out.vx = vx0 * decay;
      out.vy = vy0 * decay - (g / k) * e;
      out.vz = vz0 * decay;
      return out;
    }
    /* 第 i 顆在鏡頭時間 tShot 的位置與速度。(ox,oy,oz) 是英雄水珠斷裂時的

       主珠與一級碎片（0..7）：從英雄體內出發，脫離延遲 rel·release，側向
       速度正比於離球心的距離（邊緣的甩出去、中心的直直衝）。
       衛星滴（8..）：母珠離開時從核心拖出一條細絲，細絲上的速度是線性分

       f = satSpeed·(.85–1.15) 處，所以衛星滴天生在母珠正後方、同一條線上、
       速度只有母珠的一部分，之後越拉越開。這是一串珠，不是一把扇。衛星
       滴的起步只有一半長：它是從已經在動的細絲上收出來的。 */
    function beadKinematics(out, i, tShot, tBreak, DZ, R, ox, oy, oz) {
      const s = disperseSeeds[i];
      const ratio = DISPERSE_SIZES[0] / s.size;
      const k = Math.max(DZ.drag, .05) * Math.pow(ratio, DZ.sizeDrag);
      const g = Math.max(DZ.gravity, 0);
      if (i <= DISPERSE_PRIMARY) {
        /* 脫離時刻以主珠出發（BREAK AT）為零點，一級碎片從它之前 .4·RELEASE
           就開始走：最小的先甩出去，大的等頸縮長出來才斷，主珠出發時還
           掛著的那幾顆被它拉出液橋、拉斷。 */
        const tRel = i === 0 ? 0 : (s.rel - .6) * DZ.release;
        const v0 = DZ.speed * s.jit * Math.pow(ratio, DZ.sizeSpeed);
        const lat = v0 * Math.tan(THREE.MathUtils.degToRad(DZ.cone)) * s.swing * s.pack / .66;
        beadBallistic(out,
          ox + s.dirN.x * R * s.pack, oy + s.dirN.y * R * s.pack, oz + s.packZ * R,
          lat * s.dir.x, lat * s.dir.y + v0 * DZ.loft, v0,
          k, g, Math.max(0, tShot - tBreak - tRel), Math.max(DZ.launch, .001));
        out.v0 = v0;
        return out;
      }
      const tRel = (disperseSeeds[s.parent].rel - .6) * DZ.release
        + DZ.satDelay * (.3 + .7 * s.rel);
      /* 母珠在細絲斷開那一刻的狀態（母珠是一級碎片，遞迴只有一層）。 */
      beadKinematics(beadParent, s.parent, tBreak + tRel, tBreak, DZ, R, ox, oy, oz);
      const f = DZ.satSpeed * (.85 + .3 * s.rel);
      beadBallistic(out,
        ox + (beadParent.x - ox) * f, oy + (beadParent.y - oy) * f, oz + (beadParent.z - oz) * f,
        beadParent.vx * f, beadParent.vy * f, beadParent.vz * f,
        k, g, Math.max(0, tShot - tBreak - tRel), Math.max(DZ.launch, .001) * .5);
      out.v0 = Math.hypot(beadParent.vx, beadParent.vy, beadParent.vz) * f;
      return out;
    }
    /* 英雄核心的半徑比例：斷裂期間從 1 縮到主珠的 .86（體積交給邊緣冒出來
       的碎片），在 breakAt 那一格剛好等於主珠。 */
    const heroCore = progress => THREE.MathUtils.lerp(
      1, DISPERSE_SIZES[0],
      smooth01((progress - .06) / Math.max(CONFIG.disperse.breakAt - .06, .02))
    );
    /* 頸縮：斷裂前水珠朝鏡頭拉成長橢（軸比 1 + neck）——被拉長、變細、然
       後斷，液體斷開前真正會做的事。主珠出生時的振幅就是 neck，所以交接
       那一格兩顆球形狀相同。 */
    const heroNeck = progress => 1 + CONFIG.disperse.neck
      * smooth01((progress - .06) / Math.max(CONFIG.disperse.breakAt - .06, .02));
    /* 英雄 → 主珠的交接：breakAt ± .02。此時兩顆球同位置、同半徑、同軸比、
       同一種鉻，所以這不是疊化，是同一顆球換了名字。 */
    /* 芽和本體 smooth-min 的 k：水珠自己的 SMOOTH，再用 disperse.fuse 收緊。
       syncDroplet 畫的時候和這裡判斷橋斷了沒，用的是同一個數。 */
    const dispersalK = R => Math.max(.5, CONFIG.droplet.smooth) * .55
      / (R * Math.max(.2, CONFIG.gather.fuse) * Math.max(.2, CONFIG.disperse.fuse));
    const heroHandover = progress => smooth01(
      (progress - (CONFIG.disperse.breakAt - .02)) / .04
    );
    function updateDispersal(progress, breakUp, flight, hx, hy, hz) {
      const DZ = CONFIG.disperse;
      const n = Math.min(DISPERSE_MAX, Math.max(0, Math.round(DZ.beads)));
      disperseBuds.count = 0;
      disperseLead.attached = 0;
      disperseLead.sdf = true;
      if (breakUp <= .0005 || n === 0) {
        if (disperseMesh.visible) {
          disperseMesh.visible = false;
          disperseMesh.count = 0;
        }
        /* 房間歸位。這兩個 uniform 是 montisEnv 共用的，只有 card>0 的人
           看得到（英雄水珠和珠子），但還是要一格不差地放回去。 */
        montisEnvUniforms.uEnvSquash.value = ENV_SQUASH_BASE;
        montisEnvUniforms.uEnvKey.value.copy(ENV_KEY_BASE);
        return;
      }
      disperseMesh.visible = true;
      disperseMesh.count = n;
      /* currentDropRadius() 本身就已經乘過 CONFIG.drop.scale 了，再乘一次
         整團珠子會大 1.2 倍、體積多七成，近處那幾顆會把畫面糊成一片。 */
      const R = currentDropRadius();
      const extra = disperseMesh.geometry.attributes.instanceExtra;
      const camZ = camera.position.z;
      const tShot = shotTime(progress);
      const tBreak = shotTime(DZ.breakAt);
      /* 本體：BREAK AT 之前是縮核、頸縮中的英雄，之後就是主珠本人（迴圈第
         一顆算完就換成它的位置與軸比）。一級碎片離本體表面多遠決定它是
         SDF 上的芽（液橋還連著）還是 instanced 的球（液橋已斷）。REACH 是
         smooth-min 的橋真正斷開的間距——兩顆球相隔 2·ln2/k 時場在中點剛好
         掉到表面以下——再加 .05 的餘裕，所以切換那一格橋已經不見了，兩邊
         都是圓球、同位置同半徑，眼睛看不到換手。 */
      const broken = progress >= DZ.breakAt;
      const core = heroCore(progress);
      const neckAxis = heroNeck(progress);
      const reach = 2 * Math.LN2 / dispersalK(R) + .05;
      let bodyX = hx;
      let bodyY = hy;

      let bodyXY = R * core / Math.cbrt(neckAxis);
      let bodyZZ = R * core * Math.cbrt(neckAxis * neckAxis);
      let leadNear = 0;
      const lead = DISPERSE_SIZES[0];

      let dNear = Infinity;

      for (let i = 0; i < n; i++) {
        const s = disperseSeeds[i];
        const ratio = lead / s.size;

        const speed = Math.hypot(b.vx, b.vy, b.vz);

           收——.30 一個週期就死了，飛行中看不到任何抖動。

           往扁的那一側只走 55%——否則主珠從 1.5:1 盪過去會變成一片薄餅。
           主珠的起始振幅就是英雄的頸縮量：交接那一格兩顆球軸比相同。 */
        const omega = Math.min(84, DZ.ringFreq * Math.pow(ratio, 1.5));

           ∝ We ∝ v²·r，主珠全速時扁到 1-FLATTEN；在半個振盪週期內建立。 */
        const weber = Math.min(1, speed * speed * s.size / (DZ.speed * DZ.speed * lead));
        const aero = 1 - DZ.flatten * weber * smooth01(b.tl * omega / 3.1416);
        /* 直接寫「軸比」A：飛行拉長 1 + stretch·(v/v0)·ratio^.25，硬上限
           1.6，乘上振盪 (1 ± amp) 和壓扁，最壞 1.6 × 1.25 = 2.0:1——鉻珠
           子該是近圓帶一點拖影。體積守恆：沿速度 A^(2/3)，橫向 A^(-1/3)。 */
        const axis = THREE.MathUtils.clamp(
          Math.min(1 + DZ.stretch * (speed / Math.max(DZ.speed, 1)) * Math.pow(ratio, .25), 1.6)
            * ring * aero,

           主珠：交接那一格英雄換成它，半徑就是核心縮到的 .86 R。
           一級碎片：交接之前是英雄 SDF 上的芽（交給 uTrail，見 syncDroplet），
             核心一縮、身體一頸縮變細，芽就從表面冒出來，芽根有真的液橋；
             instanced 的球藏著。交接那一格切成 instanced——那一格它們還是
             圓的，細絲的拉長是離開之後 50 毫秒內才長出來的。往回捲就是倒
             著併回去。
           衛星滴：細絲斷開後 40 毫秒內從細絲收成球（半徑 .6 → 1）。 */
        let born;
        let radius = R * s.size;
        let shape = 1;
        if (i === 0) {
          /* 主珠：它的 instanced 球只在最後一顆芽脫離之後才畫（迴圈結束時
             決定），在那之前它就是英雄的 SDF 本體。 */
          born = 0;
          disperseLead.x = b.x;
          disperseLead.y = b.y;
          disperseLead.z = b.z;
          disperseLead.axis = axis;
          if (broken) {
            bodyX = b.x;
            bodyY = b.y;
            bodyZ = b.z;
            bodyXY = R * lead / Math.cbrt(axis);
            bodyZZ = R * lead * Math.cbrt(axis * axis);
          }
        } else if (i <= DISPERSE_PRIMARY) {
          /* 一級碎片：離本體表面的間距。BREAK AT 之前它整顆在體內；主珠一
             走，它還留在原點，液橋被拉長、變細、斷開——這就是細絲的斷裂。
             橋還連著就是 SDF 上的芽（instanced 藏著）；斷了才以 instanced 出
             現，而且那一格還是圓的：細絲的拉長是離開之後才長出來的。 */
          const ex = (b.x - bodyX) / bodyXY;
          const ey = (b.y - bodyY) / bodyXY;
          const ez = (b.z - bodyZ) / bodyZZ;
          const gap = (Math.hypot(ex, ey, ez) - 1) * bodyXY - radius;
          /* 只看間距：主珠出發前就先走的小顆，自己把橋拉斷；主珠出發那一格
             還掛著的，被它一走就扯斷。 */
          if (gap < reach) {
            born = 0;
            disperseLead.attached++;
            const q = disperseBuds.count++;
            disperseBuds.x[q] = b.x;
            disperseBuds.y[q] = b.y;
            disperseBuds.z[q] = b.z;
            disperseBuds.r[q] = radius;
          } else {
            born = 1;
            shape = smooth01((gap - reach) / (radius * .5));
          }
        } else {
          const pinch = smooth01(b.tl / .04);
          born = pinch;
          radius *= .6 + .4 * pinch;
        }
        const axisNow = 1 + (axis - 1) * shape;
        const sz = Math.cbrt(axisNow * axisNow);
        const sxy = 1 / Math.cbrt(axisNow);
        /* 過近平面：化進光裡，不是啪一聲不見。距離用自己的速度換算成時
           間——2.2 個單位在 100 單位/秒下只有一格半，等於沒淡。取 nearFade
           與「最後 .09 秒的行程」之中較長者，主珠約 9 個單位＝5 格。 */
        const dist = camZ - b.z;
        const near = THREE.MathUtils.clamp(
          dist / Math.max(DZ.nearFade, Math.max(b.vz, 0) * .09, .05), 0, 1
        );
        if (i === 0) leadNear = near;
        const fade = born * smooth01(near * 1.6);
        if (fade > .003) {
          shown++;
          if (dist < dNear) dNear = dist;
        }
        dispersePos.set(b.x, b.y, b.z);
        disperseScale.set(radius * sxy, radius * sxy, radius * sz);
        disperseMatrix.compose(dispersePos, disperseQuat, disperseScale);
        disperseMesh.setMatrixAt(i, disperseMatrix);
        extra.array[i * 3] = fade;
        /* 球體自轉在解析環境下是看不見的——法線沒變，反射就沒變。所以
           「轉」這件事寫在虹彩遮罩的相位上：色斑會沿著珠子表面爬，那才
           是眼睛真正讀得到的旋轉。轉速隨時間，不隨進度。 */
        extra.array[i * 3 + 1] = s.seed + b.tl * DZ.spin;
        /* 越靠近鏡頭越自體發光，於是它是「化成光」而不是「淡掉」。 */
        extra.array[i * 3 + 2] = (1 - near) * 1.35;
      }
      /* 主珠換手：最後一顆芽的液橋斷了，英雄的 SDF 讓位，主珠以 instanced
         出現——同位置、同半徑、同軸比。 */
      disperseLead.sdf = !broken || disperseLead.attached > 0;
      if (!disperseLead.sdf) {
        const leadFade = smooth01(leadNear * 1.6);
        extra.array[0] = leadFade;
        if (leadFade > .003) {
          shown++;
          const leadDist = camZ - disperseLead.z;
          if (leadDist < dNear) dNear = leadDist;

      disperseMesh.instanceMatrix.needsUpdate = true;
      extra.needsUpdate = true;
      /* 沒有一顆看得見就整個關掉。否則減少動態模式一格跳到終點、或者正
         常轉場走到尾巴之後，十五顆全透明的球會在鏡頭背後永遠畫下去。 */
      disperseMesh.visible = shown > 0;
      if (shown === 0) disperseMesh.count = 0;

         V 在球面上的擺幅、環境的模糊，在 17、4、0.5 單位外全都一樣。球
         自己的著色說不出它離你多近——所以「扁平的塊」不是著色不夠，是
         反射裡的內容不夠。離鏡頭最近的那顆決定整組的房間：光帶開起來、
         黑卡退開、粗糙度降到近乎鏡面（那才是「濕」）、透光核心放大。
         這些全是珠子材質自己的 uniform；共用的 uEnvSquash / uEnvKey 一
         動，天空和海面會一起被重新打光，所以碰都不碰。 */
      const u = disperseMaterial.uniforms;
      const close = shown > 0
        ? 1 - smooth01((dNear - .40) / 8.60)
        : 0;
      const L = THREE.MathUtils.lerp;
      u.uBeadBand.value = L(.16, .86, close);
      u.uDropCard.value = L(CONFIG.drop.card, .22, close);
      u.uChromeRough.value = L(CONFIG.drop.roughness, .012, close);
      u.uDropLens.value.set(
        L(CONFIG.drop.lens, 1.05, close),
        L(CONFIG.drop.lensEdge, 3.4, close)

    }

       品牌 LOGO：logo.svg 擠出成玻璃塊（index.html 的做法：span·.06 的厚度、
       小倒角、y 翻轉、置中、以 HEIGHT 定尺寸、z 再乘 DEPTH），材質是物理玻璃
       （折射、菲涅耳、薄膜虹彩），環境就是這一頁的 scene.environment。
       ------------------------------------------------------------------ */
    const logoRoot = new THREE.Group();
    logoRoot.name = 'brand-mark';
    logoRoot.visible = false;
    scene.add(logoRoot);

    logoRoot.add(logoSpin);
