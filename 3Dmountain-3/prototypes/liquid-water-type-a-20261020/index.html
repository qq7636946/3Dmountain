<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>A — 透明水體材質測試</title>
  <link rel="icon" href="data:,">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{background:#e7e5df;color:#303c43;font-family:Arial,"Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
    #stage{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}
    header{position:absolute;top:32px;left:38px;pointer-events:none}header p{font-size:10px;letter-spacing:.24em;margin:0 0 13px}h1{font-size:15px;font-weight:500;letter-spacing:.06em;margin:0}
    .tag{position:absolute;right:38px;top:35px;font-size:10px;letter-spacing:.16em}
    .controls{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 30px);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;background:#f7f6f0d6;border:1px solid #fff9;border-radius:14px;backdrop-filter:blur(12px)}
    button{font:inherit;font-size:12px;color:#334049;background:transparent;border:1px solid #75828b40;border-radius:7px;padding:10px 13px;cursor:pointer;min-height:38px}
    button:hover{background:#fff8}button:focus-visible{outline:2px solid #3883a0;outline-offset:3px}
    button[aria-pressed=true]{background:#33464f;color:#f8fbfc;border-color:#33464f}
    #status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:90%;padding:14px 20px;background:#f8f7f1e8;font-size:13px;border-radius:10px;text-align:center;line-height:1.8}
    #status[hidden]{display:none}#status.error{color:#963a2b}
    #stats{position:absolute;left:38px;bottom:100px;font-size:10px;line-height:1.8;letter-spacing:.02em;font-variant-numeric:tabular-nums;color:#53626c}
    .note{position:absolute;right:38px;bottom:104px;font-size:10px;color:#53626c;letter-spacing:.02em}
    body.dark{color:#d9e1e6}body.dark #stats,body.dark .note{color:#b8c8d0}
    @media(max-width:700px){header{top:24px;left:22px}header p{font-size:8px}h1{font-size:12px}.tag{top:80px;left:22px;right:auto;font-size:8px}.controls{bottom:18px;gap:6px;width:calc(100% - 28px);padding:9px}button{font-size:11px;padding:8px 10px}#stats{left:22px;bottom:135px;font-size:9px}.note{display:none}}
  </style>
</head>
<body>
  <main id="stage" aria-label="透明水體字母 A 三維模型檢視器"></main>
  <header><p>LIQUID TYPOGRAPHY / MATERIAL STUDY 01</p><h1>A / 透明水體材質測試 · 未套用正式頁面</h1></header>
  <span class="tag">SINGLE LETTER · APPROVAL STUDY</span>
  <div id="status" role="status" aria-live="polite">載入獨立 A 模型與水體材質…</div>
  <output id="stats" aria-label="即時渲染統計"></output>
  <span class="note">獨立模型 · 水的折射率 1.333 · 即時 WebGL</span>
  <nav class="controls" aria-label="模型檢視控制">
    <button data-view="front" aria-pressed="false">正面</button>
    <button data-view="quarter" aria-pressed="true">3/4 視角</button>
    <button data-view="side" aria-pressed="false">側面</button>
    <button id="rotation" aria-pressed="false">開始旋轉</button>
    <button id="background" aria-pressed="false">深色背景</button>
    <button id="pattern" aria-pressed="false">折射對照</button>
  </nav>
  <script type="module" src="./study.js"></script>
</body>
</html>
