<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOGO 1 區塊原型</title>
<style>
  html, body { margin: 0; background: #1b2c44; color: #eef4fb; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  /* 背景：參考 6.webp 的天色與海面（佔位，之後可換成海洋段的同一套色） */
  #sky { position: fixed; inset: 0; background:
    radial-gradient(40% 30% at 22% 14%, rgba(255, 236, 200, .55), rgba(255, 236, 200, 0) 70%),
    linear-gradient(180deg, #3e5585 0%, #6c86b0 42%, #8aa3c4 56%, #3b5878 66%, #1d3349 100%); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .spacer { height: 400vh; }
  .caption { position: fixed; left: 0; right: 310px; bottom: 9vh; text-align: center; pointer-events: none; }
  .caption .kicker { font-size: 12px; letter-spacing: .28em; color: #d9c7a0; }
  .caption h2 { margin: 8px 0 10px; font-size: clamp(22px, 3.2vw, 40px); font-weight: 600; letter-spacing: .04em; text-shadow: 0 2px 18px rgba(10, 25, 45, .5); }
  .caption p { margin: 0 auto; max-width: 560px; font-size: 14px; line-height: 1.8; color: #dbe6f3; }
  #panel { position: fixed; top: 14px; right: 14px; width: 292px; max-height: calc(100vh - 28px); overflow: auto;
    background: rgba(12, 26, 44, .86); border: 1px solid rgba(160, 200, 240, .28); border-radius: 10px; padding: 12px 14px; font-size: 13px; box-sizing: border-box; }
  #panel h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .08em; color: #cfe0f2; }
  #panel label { display: grid; grid-template-columns: 1fr 52px; gap: 4px 8px; align-items: center; margin: 7px 0; }
  #panel label span.v { text-align: right; color: #9ec3e6; font-variant-numeric: tabular-nums; }
  #panel label.full { grid-template-columns: 1fr; }
  #panel input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; }
  #panel input[type=color] { width: 100%; height: 26px; border: 0; background: none; padding: 0; }
  #panel .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  #panel button { flex: 1 1 auto; padding: 7px 8px; border-radius: 6px; border: 1px solid rgba(160, 200, 240, .35); background: rgba(40, 70, 105, .6); color: #eef4fb; font: inherit; cursor: pointer; }
  #panel button:hover { background: rgba(60, 100, 145, .7); }
  #panel .note { margin-top: 8px; font-size: 12px; color: #9fb4cc; line-height: 1.6; }
  @media (max-width: 640px) {
    #panel { top: auto; bottom: 10px; left: 10px; right: 10px; width: auto; max-height: 42vh; }
    .caption { bottom: 46vh; right: 0; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<canvas id="view" aria-label="LOGO 1 三維原型"></canvas>
<div class="spacer" aria-hidden="true"></div>
<div class="caption">
  <div class="kicker">佔位標題區</div>
  <h2>區塊標題</h2>
  <p>區塊內文，待提供。滾動即可看 LOGO 1 平旋轉一圈，結尾回到正面。</p>
</div>

<aside id="panel">
  <h3>LOGO 1 旋鈕（原型）</h3>
  <div class="row">
    <button type="button" id="preset-water">水感（圓潤）</button>
    <button type="button" id="preset-glass">玻璃（近似原本）</button>
    <button type="button" id="preset-silver">銀藍（對照 6.webp）</button>
  </div>
  <div id="controls"></div>
  <div class="row">
    <button type="button" id="copy">複製參數</button>
    <button type="button" id="reset">重設</button>
  </div>
  <div class="note" id="readout">旋轉 0%｜0°</div>
  <div class="note">旋鈕的值記在這個瀏覽器裡；按「複製參數」取得 JSON，再交給工程師寫成預設值。</div>
</aside>

<script type="module" src="./logo1-block.js"></script>
</body>
</html>
